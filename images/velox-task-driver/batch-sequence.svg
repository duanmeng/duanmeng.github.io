<text x="455.0" y="675" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" font-weight="400" text-anchor="middle">batch B</text>
<polyline points="135,748 1135,748" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="548.5" y="719" width="173" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="635.0" y="738" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" font-weight="400" text-anchor="middle">addInput(batch B)</text>
<text x="640" y="800" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="18" font-weight="400" text-anchor="middle">传递后 i += 2，再经循环 --i：净前进到下游算子。</text>
<rect x="40" y="836" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="836.0" x2="1240.0" y2="836.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="865" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">下游表达需求，Driver 从上游取批次，再把批次交给下游。</text>
<text x="60" y="890" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">nullptr 后还要检查阻塞与完成状态；它本身不代表让出线程或整个 pipeline 结束。</text>
</svg>
