<polyline points="135,646 775,646" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="395.5" y="617" width="119" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
