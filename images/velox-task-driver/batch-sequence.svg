<polyline points="135,501 435,501" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="225.5" y="472" width="119" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
