<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="938" viewBox="0 0 1280 938" role="img" aria-labelledby="title desc">
<title id="title">一批数据怎样穿过 Scan → FilterProject → Sink</title><desc id="desc">普通并行路径示意：初始无缓存输出；省略重复的控制、阻塞与需求检查。时间由上向下。</desc>
