<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">普通并行路径示意：初始无缓存输出；省略重复的控制、阻塞与需求检查。时间由上向下。</text>
