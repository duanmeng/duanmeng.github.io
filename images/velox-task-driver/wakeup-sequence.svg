<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="908" viewBox="0 0 1280 908" role="img" aria-labelledby="title desc">
<title id="title">一次异步等待：离开 Driver，再安排恢复</title><desc id="desc">以等待 split 为例。Future 可以提前就绪，恢复回调必须在 Task::leave 之后安装。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="908" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="892" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">一次异步等待：离开 Driver，再安排恢复</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">以等待 split 为例。Future 可以提前就绪，恢复回调必须在 Task::leave 之后安装。</text>
<rect x="27" y="140" width="216" height="78" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="27" y="144" width="4" height="70" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="49" y="175" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Driver</text>
<text x="135" y="202" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">run / runInternal</text>
<line x1="135" y1="229" x2="135" y2="781" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="282" y="140" width="216" height="78" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="282" y="144" width="4" height="70" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="304" y="175" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Task</text>
<text x="390" y="202" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">登记与共享状态</text>
<line x1="390" y1="229" x2="390" y2="781" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="537" y="140" width="216" height="78" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="537" y="144" width="4" height="70" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="559" y="175" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Operator</text>
<text x="645" y="202" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">报告等待</text>
<line x1="645" y1="229" x2="645" y2="781" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="792" y="140" width="216" height="78" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<rect x="792" y="144" width="4" height="70" rx="0" fill="#c2410c" stroke="none" stroke-width="1"/>
<text x="814" y="175" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">事件生产者</text>
<text x="900" y="202" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">如 split 提交方</text>
<line x1="900" y1="229" x2="900" y2="781" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="1042" y="140" width="216" height="78" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="1042" y="144" width="4" height="70" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="1064" y="175" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Executor</text>
<text x="1150" y="202" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">运行 Driver</text>
<line x1="1150" y1="229" x2="1150" y2="781" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<polyline points="135,263 645,263" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="299.0" y="234" width="182" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="390.0" y="253" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">isBlocked(&amp;future)</text>
<polyline points="645,308 135,308" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="312.5" y="279" width="155" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="390.0" y="298" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">reason + future</text>
<rect x="42" y="329" width="409" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="48" y="351" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">创建 BlockingState，hasBlockingFuture = true</text>
<polyline points="135,392 390,392" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="203.0" y="363" width="119" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="262.5" y="382" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">Task::leave</text>
<rect x="425" y="398" width="272" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="431" y="420" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">清除 thread，减少 numThreads_</text>
<polyline points="135,431 187,431 187,461 135,461" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="210" y="437" width="265" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="216" y="459" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">setResume：安装 continuation</text>
<polyline points="900,520 390,520" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="599.0" y="491" width="92" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="645.0" y="510" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">addSplit</text>
<polyline points="390,574 135,574" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="182.5" y="545" width="160" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="262.5" y="564" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">出锁兑现 promise</text>
<rect x="169" y="591" width="442" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="175" y="613" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">continuation：在 Task 锁内清除 hasBlockingFuture</text>
<polyline points="135,661 1150,661" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="531.0" y="632" width="223" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="642.5" y="651" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">未暂停：enqueue(driver)</text>
<polyline points="1150,722 135,722" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="464.5" y="693" width="356" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="642.5" y="712" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">Driver::run → Task::enter → 执行算子</text>
<rect x="40" y="806" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="835" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">Blocked 等待期间不占 executor 工作线程；就绪后重新排队，不要求回到原线程。</text>
<text x="60" y="860" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">若 pause 已生效，回调暂不 enqueue，后续由 Task::resume 根据当前等待状态决定。</text>
</svg>