<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1270" viewBox="0 0 1280 1270" role="img"><title>从 getOutput 空返回，到下一次真正 on-thread</title><desc>并行执行路径；各列是逻辑参与者，Driver 前后两次执行可以由不同 worker 承担</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="1270" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">从 getOutput 空返回，到下一次真正 on-thread</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">并行执行路径；各列是逻辑参与者，Driver 前后两次执行可以由不同 worker 承担</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><rect x="87" y="143" width="196" height="82" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="185" y="173" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="middle">Driver</text><text x="185" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="middle">调用与保存执行状态</text><line x1="185" y1="228" x2="185" y2="1125" stroke="#657386" stroke-width="2.3" stroke-dasharray="6 5"/><rect x="312" y="143" width="196" height="82" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="410" y="173" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="middle">Operator</text><text x="410" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="middle">发现等待条件</text><line x1="410" y1="228" x2="410" y2="1125" stroke="#657386" stroke-width="2.3" stroke-dasharray="6 5"/><rect x="552" y="143" width="196" height="82" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.6"/><text x="650" y="173" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#877951" text-anchor="middle">Event producer</text><text x="650" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="middle">队列 / split / I/O</text><line x1="650" y1="228" x2="650" y2="1125" stroke="#657386" stroke-width="2.3" stroke-dasharray="6 5"/><rect x="787" y="143" width="196" height="82" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="885" y="173" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="middle">Task</text><text x="885" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="middle">执行资格与状态锁</text><line x1="885" y1="228" x2="885" y2="1125" stroke="#657386" stroke-width="2.3" stroke-dasharray="6 5"/><rect x="1042" y="143" width="196" height="82" rx="5" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.6"/><text x="1140" y="173" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c6f6b" text-anchor="middle">Query executor</text><text x="1140" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="middle">调度 worker</text><line x1="1140" y1="228" x2="1140" y2="1125" stroke="#657386" stroke-width="2.3" stroke-dasharray="6 5"/><rect x="40" y="237" width="1200" height="35" fill="white"/><text x="40" y="262" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#326cae" text-anchor="start">1  再查阻塞状态，保存 future 并离开执行线程</text><polyline points="185,300 410,300" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><rect x="158.96358096313477" y="265.05" width="277.07283807373045" height="30.6" fill="white"/><text x="297.5" y="288" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#326cae" text-anchor="middle">① isBlocked → kNotBlocked</text><polyline points="185,344 410,344" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><rect x="110.72850790405275" y="309.05" width="373.5429841918945" height="30.6" fill="white"/><text x="297.5" y="332" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2e7963" text-anchor="middle">② getOutput：发现空队列，保存 future</text><polyline points="410,388 185,388" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><rect x="236.31521025085448" y="353.05" width="122.36957949829102" height="30.6" fill="white"/><text x="297.5" y="376" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2e7963" text-anchor="middle">返回 nullptr</text><polyline points="185,432 410,432" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="127.0862337615967" y="397.05" width="340.8275324768066" height="30.6" fill="white"/><text x="297.5" y="420" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#65537f" text-anchor="middle">③ 再次 isBlocked → reason + future</text><rect x="40" y="454" width="610" height="55" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="55" y="481" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">blockDriver → kBlock</text><text x="327" y="478" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2d3d" text-anchor="start">BlockingState 保留等待</text><text x="327" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2d3d" text-anchor="start">hasBlockingFuture = true</text><polyline points="185,547 885,547" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="318.00764100341803" y="512.05" width="433.984717993164" height="30.6" fill="white"/><text x="535.0" y="535" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#65537f" text-anchor="middle">退出 runInternal：CancelGuard → Task::leave</text><rect x="40" y="568" width="610" height="59" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.6"/><text x="55" y="595" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#877951" text-anchor="start">Driver 已 off-thread</text><text x="327" y="593" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2d3d" text-anchor="start">setResume 安装恢复回调</text><text x="327" y="616" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2d3d" text-anchor="start">worker 可运行其他工作</text><rect x="40" y="640" width="1200" height="35" fill="white"/><text x="40" y="665" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#65537f" text-anchor="start">2  事件满足，回调申请重新排队</text><polyline points="650,706 185,706" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><rect x="202.25285769348147" y="671.05" width="430.49428461303705" height="30.6" fill="white"/><text x="417.5" y="694" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2e7963" text-anchor="middle">事件完成 → promise.setValue → continuation</text><polyline points="185,750 885,750" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="355.02203977966315" y="715.05" width="359.95592044067376" height="30.6" fill="white"/><text x="535.0" y="738" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#65537f" text-anchor="middle">Task 锁内：清除等待标志，检查 pause</text><polyline points="885,794 185,794" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="315.4144561889649" y="759.05" width="439.1710876220703" height="30.6" fill="white"/><text x="535.0" y="782" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#65537f" text-anchor="middle">未暂停：允许重新入队；暂停则等 Task::resume</text><polyline points="185,838 1140,838" fill="none" stroke="#3e8580" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><rect x="417.0319907928467" y="803.05" width="490.9360184143066" height="30.6" fill="white"/><text x="662.5" y="826" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2c6f6b" text-anchor="middle">Driver::enqueue：isEnqueued = true；executor.add</text><rect x="40" y="862" width="1200" height="35" fill="white"/><text x="40" y="887" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2e7963" text-anchor="start">3  worker 取任务，Task 再授予执行资格</text><polyline points="1140,932 185,932" fill="none" stroke="#3e8580" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><rect x="450.7038576934815" y="897.05" width="423.59228461303707" height="30.6" fill="white"/><text x="662.5" y="920" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2c6f6b" text-anchor="middle">worker 取出任务 → Driver::run → runInternal</text><polyline points="185,976 885,976" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="284.8287680847168" y="941.05" width="500.3424638305664" height="30.6" fill="white"/><text x="535.0" y="964" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#65537f" text-anchor="middle">Task::enter：检查 terminate / pause / 是否已在线程上</text><polyline points="885,1020 185,1020" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><rect x="293.5351423675537" y="985.05" width="482.92971526489254" height="30.6" fill="white"/><text x="535.0" y="1008" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2e7963" text-anchor="middle">获准：numThreads++；setThread；真正 on-thread</text><polyline points="185,1070 410,1070" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><rect x="108.53958670043949" y="1035.05" width="377.920826599121" height="30.6" fill="white"/><text x="297.5" y="1058" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#2e7963" text-anchor="middle">普通路径从 sink 重新检查，继续推进算子</text><line x1="40" y1="1150" x2="1240" y2="1150" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="1179" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">reason 决定本次是否退出执行；future 决定何时可以再次申请执行</text><text x="40" y="1208" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">future ready ≠ 已入队 ≠ 已 on-thread；只有最后一步取得执行资格，算子才重新运行。</text></svg>