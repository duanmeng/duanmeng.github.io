<polyline points="445,291 372,291 372,354 193,354 193,318" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="278" y="384" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="middle">ctx_-&gt;task：shared_ptr</text>
