<text x="926" y="689" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">~Driver → Task 最终可析构</text>
<rect x="40" y="760" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="789" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">解除 drivers_ 引用不等于 Driver 立即析构；DriverCtx 保证 Task 的生命期覆盖 Driver。</text>
<text x="60" y="814" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">pool 对象保活与 buffer 数据保活分开：实际数据的释放由 vector / buffer 持有者决定。</text>
</svg>