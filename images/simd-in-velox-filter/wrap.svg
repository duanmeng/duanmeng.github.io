<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="609" viewBox="0 0 1440 609" role="img"><title>末尾 padding 与逻辑回绕</title><desc>padding 复制最后一个逻辑槽；不是把表头复制到末尾。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="633" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">末尾 padding 与逻辑回绕</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">padding 复制最后一个逻辑槽；不是把表头复制到末尾。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#326cae" font-weight="600" text-anchor="start">逻辑哈希表</text><text x="859" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="600" text-anchor="start">额外 4 个 int64</text><rect x="48" y="224" width="163" height="60" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="129.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">…</text><rect x="216" y="224" width="163" height="60" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="297.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">slot N−3</text><rect x="384" y="224" width="163" height="60" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="465.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">slot N−2</text><rect x="552" y="224" width="163" height="60" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="633.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">slot N−1</text><rect x="720" y="224" width="163" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="801.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">pad 0</text><rect x="888" y="224" width="163" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="969.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">pad 1</text><rect x="1056" y="224" width="163" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="1137.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">pad 2</text><rect x="1224" y="224" width="163" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="1305.5" y="261" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">pad 3</text><line x1="720" y1="199" x2="720" y2="308.5468" stroke="#657386" stroke-width="2" stroke-dasharray="7 6" /><polyline points="632,284 632,296.6619 803,296.6619 803,284" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><polyline points="632,284 632,300.0863 971,300.0863 971,284" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><polyline points="632,284 632,303.5108 1139,303.5108 1139,284" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><polyline points="632,284 632,306.9353 1307,306.9353 1307,284" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><text x="48" y="348" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">每个 pad 都复制 slot N−1</text><line x1="48" y1="397" x2="646" y2="397" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="426" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">连续 load 可跨逻辑末端</text><text x="48" y="464" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">访问仍在分配的物理 buffer 中</text><line x1="795" y1="397" x2="1391" y2="397" stroke="#dce3ea" stroke-width="1.85" /><text x="795" y="426" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">下一轮 index 超界后置为 0</text><text x="795" y="464" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">仍需显式从逻辑表头继续探测</text><line x1="48" y1="506.3684" x2="1392" y2="506.3684" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="538" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">不制造额外空槽，保留线性探测的终止语义。</text><text x="48" y="572" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">固定 padding 与 batch 宽度相关，不能无条件推广到任意更宽 ISA。</text></svg>