<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">末尾 padding 与逻辑回绕</title><desc id="desc">padding 复制最后一个逻辑槽；不是把表头复制到末尾。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="700" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="684" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">末尾 padding 与逻辑回绕</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">padding 复制最后一个逻辑槽；不是把表头复制到末尾。</text>
<rect x="60" y="205" width="145" height="72" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<text x="132" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">…</text>
<rect x="205" y="205" width="145" height="72" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<text x="277" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">slot N−3</text>
<rect x="350" y="205" width="145" height="72" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<text x="422" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">slot N−2</text>
<rect x="495" y="205" width="145" height="72" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<text x="567" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">slot N−1</text>
<rect x="640" y="205" width="145" height="72" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<text x="712" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">pad 0</text>
<rect x="785" y="205" width="145" height="72" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<text x="857" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">pad 1</text>
<rect x="930" y="205" width="145" height="72" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<text x="1002" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">pad 2</text>
<rect x="1075" y="205" width="145" height="72" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<text x="1147" y="248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="middle">pad 3</text>
<text x="350" y="163" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="21" font-weight="600" text-anchor="middle">逻辑哈希表</text>
<text x="930" y="163" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="21" font-weight="600" text-anchor="middle">额外 4 个 int64</text>
<polyline points="566,290 566,335 950,335 950,290" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="770" y="364" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="18" font-weight="400" text-anchor="middle">每个 pad 都复制 slot N−1</text>
<rect x="60" y="405" width="520" height="100" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="60" y="409" width="4" height="92" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="82" y="440" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">连续 load 可跨逻辑末端</text>
<text x="82" y="473" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">访问仍在分配的物理 buffer 中</text>
<rect x="680" y="405" width="540" height="100" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="680" y="409" width="4" height="92" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="702" y="440" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">下一轮 index 超界后置为 0</text>
<text x="702" y="473" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">仍需显式从逻辑表头继续探测</text>
<rect x="40" y="598" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="598.0" x2="1240.0" y2="598.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="627" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">不制造额外空槽，保留线性探测的终止语义。</text>
<text x="60" y="652" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">固定 padding 与 batch 宽度相关，不能无条件推广到任意更宽 ISA。</text>
</svg>
