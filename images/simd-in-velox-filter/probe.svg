<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1256" viewBox="0 0 1440 1256" role="img"><title>两层 SIMD：查询并行 → 候选槽并行</title><desc>以 AVX2 的四个 int64 lane 为例；实际宽度由构建目标决定。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1256" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">两层 SIMD：查询并行 → 候选槽并行</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">以 AVX2 的四个 int64 lane 为例；实际宽度由构建目标决定。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="175" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">4 个查询</text><text x="48" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">各自计算初始下标</text><text x="48" y="251" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不同 lane 可以访问不同缓存行</text><text x="48" y="334" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">输入 batch</text><text x="48" y="375" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">x0 · x1 · x2 · x3</text><text x="48" y="409" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">先判断范围与特殊 fallback</text><rect x="510" y="317" width="209" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="614.5" y="352.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">x0</text><rect x="724" y="317" width="209" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="828.5" y="352.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">x1</text><rect x="938" y="317" width="209" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="1042.5" y="352.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">x2</text><rect x="1152" y="317" width="209" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="1256.5" y="352.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">x3</text><text x="510" y="418" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="start">各 lane 计算下标</text><rect x="510" y="453" width="209" height="56" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="614.5" y="488.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">table[h0]</text><rect x="724" y="453" width="209" height="56" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="828.5" y="488.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">table[h1]</text><rect x="938" y="453" width="209" height="56" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="1042.5" y="488.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">table[h2]</text><rect x="1152" y="453" width="209" height="56" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="1256.5" y="488.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">table[h3]</text><polyline points="614,374 614,394 614,449" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><polyline points="828,374 828,394 828,449" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><polyline points="1042,374 1042,394 1042,449" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><polyline points="1256,374 1256,394 1256,449" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><text x="48" y="489" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">首轮 maskGather</text><text x="48" y="532" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">每个查询读取一个首槽</text><text x="48" y="566" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">命中 / 空槽 / unresolved</text><line x1="48" y1="642" x2="632" y2="642" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="671" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">压缩结果</text><text x="48" y="709" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">resultBits 与 missed</text><text x="48" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">剩余位组成 unresolved</text><line x1="796" y1="642" x2="1392" y2="642" stroke="#dce3ea" stroke-width="1.5" /><text x="796" y="671" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">提取未决 lane</text><text x="796" y="709" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">逐个处理冲突查询</text><text x="796" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">广播当前查询值</text><polyline points="632,655 784,655" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><rect x="795" y="827" width="596" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="1093.0" y="863.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="400" text-anchor="middle">广播 xk → [ xk, xk, xk, xk ]</text><text x="48" y="861" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">连续 load</text><text x="48" y="903" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同时比较多个相邻槽</text><text x="48" y="937" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">命中或空槽结束，否则前进</text><rect x="795" y="970" width="145" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="867.5" y="1005.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">slot i</text><rect x="945" y="970" width="145" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1017.5" y="1005.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">i+1</text><rect x="1095" y="970" width="145" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1167.5" y="1005.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">i+2</text><rect x="1245" y="970" width="145" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1317.5" y="1005.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">i+3</text><polyline points="1092,885 1092,966" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)" /><line x1="48" y1="1134" x2="1392" y2="1134" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1168" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">首轮跨查询做 gather，后续对一个查询扫描连续槽。</text><text x="48" y="1202" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">哨兵查询的混合 batch 边界见正文；不要把 maskGather 的填充值直接等同于 false。</text></svg>