<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">两层 SIMD：查询并行 → 候选槽并行</title><desc id="desc">以 AVX2 的四个 int64 lane 为例；实际宽度由构建目标决定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="744" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">两层 SIMD：查询并行 → 候选槽并行</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">以 AVX2 的四个 int64 lane 为例；实际宽度由构建目标决定。</text>
<rect x="50" y="165" width="350" height="128" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">4 个查询</text>
<text x="72" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">各自计算初始下标</text>
<text x="72" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">不同 lane 可以访问不同缓存行</text>
<polyline points="414,225 450,225" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="370" width="350" height="155" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">输入 batch</text>
<text x="72" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">x0 · x1 · x2 · x3</text>
<text x="72" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">先判断范围与特殊 fallback</text>
<polyline points="225,306 225,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="165" width="350" height="128" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">首轮 maskGather</text>
<text x="487" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">每个查询读取一个首槽</text>
<text x="487" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">命中 / 空槽 / unresolved</text>
<polyline points="829,225 865,225" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="370" width="350" height="155" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">压缩结果</text>
<text x="487" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">resultBits 与 missed</text>
<text x="487" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">剩余位组成 unresolved</text>
<polyline points="640,306 640,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="880" y="165" width="350" height="128" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">提取未决 lane</text>
<text x="902" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">逐个处理冲突查询</text>
<text x="902" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">广播当前查询值</text>
<rect x="880" y="370" width="350" height="155" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">连续 load</text>
<text x="902" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">同时比较多个相邻槽</text>
<text x="902" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">命中或空槽结束，否则前进</text>
<polyline points="1055,306 1055,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="658" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="658.0" x2="1240.0" y2="658.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="687" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">首轮跨查询做 gather，后续对一个查询扫描连续槽。</text>
<text x="60" y="712" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">哨兵查询的混合 batch 边界见正文；不要把 maskGather 的填充值直接等同于 false。</text>
</svg>
