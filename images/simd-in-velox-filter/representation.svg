<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="973" viewBox="0 0 1440 973" role="img"><title>先选择集合表示，再优化查询</title><desc>工厂依据值域与密度选择结构；图中为正向 IN-list。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="990" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">先选择集合表示，再优化查询</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">工厂依据值域与密度选择结构；图中为正向 IN-list。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="181" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#326cae" font-weight="600" text-anchor="start">Range</text><text x="48" y="226" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">单点或连续区间</text><text x="48" y="260" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">用上下界表达集合</text><text x="825" y="181" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">比较</text><text x="825" y="226" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">上下界判断</text><text x="825" y="260" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不必逐项存 key</text><text x="48" y="416" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#65537f" font-weight="600" text-anchor="start">Bitmask</text><text x="48" y="461" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">较小或较密的值域</text><text x="48" y="495" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">bit(value - min) 表示成员</text><text x="825" y="416" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">定位 bit</text><text x="825" y="461" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">计算相对偏移</text><text x="825" y="495" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">值域大小决定空间</text><text x="48" y="663" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#2e7963" font-weight="600" text-anchor="start">HashTable</text><text x="48" y="708" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">大值域中的稀疏集合</text><text x="48" y="742" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">直接存储 int64 值</text><text x="825" y="663" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">探测</text><text x="825" y="708" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">首槽 + 冲突扫描</text><text x="825" y="742" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">低装载率有利于 miss</text><line x1="73" y1="296.4118" x2="640" y2="296.4118" stroke="#4078bd" stroke-width="2" /><line x1="151" y1="291.7451" x2="151" y2="301.0784" stroke="#4078bd" stroke-width="2" /><line x1="550" y1="291.7451" x2="550" y2="301.0784" stroke="#4078bd" stroke-width="2" /><text x="137" y="335" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="start">min</text><text x="531" y="335" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="start">max</text><rect x="48" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="87.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">0</text><rect x="131" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="170.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">1</text><rect x="214" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="253.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">0</text><rect x="297" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="336.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">1</text><rect x="380" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="419.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">1</text><rect x="463" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="502.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">0</text><rect x="546" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="585.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">0</text><rect x="629" y="542" width="78" height="50" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="668.0" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">1</text><rect x="48" y="789" width="125" height="50" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="110.5" y="821" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">k₀</text><rect x="178" y="789" width="125" height="50" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="240.5" y="821" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">empty</text><rect x="308" y="789" width="125" height="50" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="370.5" y="821" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">k₁</text><rect x="438" y="789" width="125" height="50" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="500.5" y="821" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">empty</text><rect x="568" y="789" width="125" height="50" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="630.5" y="821" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">k₂</text><line x1="48" y1="870.134" x2="1392" y2="870.134" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">表示选择会改变访存模式，不能只比较某条 SIMD 指令。</text><text x="48" y="936" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">nullAllowed 独立于整数值；SQL NULL 不是哈希表的空槽哨兵。</text></svg>