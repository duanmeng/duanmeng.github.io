<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="828" viewBox="0 0 1280 828" role="img" aria-labelledby="title desc">
<title id="title">Pool 生命周期：谁持有引用，谁归还额度</title><desc id="desc">父子结构与强引用方向不同。Task 清理、buffer 释放、capacity 归还和 pool 析构要分开。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.6" /></marker></defs>
<rect x="0" y="0" width="1280" height="839" rx="0" fill="white" stroke="none" stroke-width="1" />
<rect x="8" y="8" width="1264" height="823" rx="4" fill="white" stroke="none" stroke-width="1" />
<rect x="9" y="9" width="1262" height="89.3448" rx="0" fill="white" stroke="none" stroke-width="1" />
<line x1="9" y1="98.3448" x2="1271" y2="98.3448" stroke="#dce3ea" stroke-width="1.85" />
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">Pool 生命周期：谁持有引用，谁归还额度</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">父子结构与强引用方向不同。Task 清理、buffer 释放、capacity 归还和 pool 析构要分开。</text>
<rect x="50" y="126" width="320" height="95" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="50" y="130" width="4" height="87" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="72" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">Query / Task 持有者</text>
<text x="72" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">shared_ptr 保活相关 pool</text>
<rect x="480" y="126" width="330" height="95" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<rect x="480" y="130" width="4" height="87" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="502" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">Query root</text>
<text x="502" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Manager 只用 weak_ptr 跟踪</text>
<rect x="920" y="126" width="310" height="95" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" />
<rect x="920" y="130" width="4" height="87" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="942" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#877951" font-size="21" font-weight="600" text-anchor="start">Scoped participant</text>
<text x="942" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">仲裁期间强持有 root</text>
<polyline points="382,171 468,171" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<polyline points="908,171 822,171" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="480" y="359" width="330" height="95" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="480" y="363" width="4" height="87" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="502" y="394" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">Child pool</text>
<text x="502" y="427" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Task / Node / Operator</text>
<polyline points="530,233 530,347" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<text x="503" y="297" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="end">children_：weak_ptr</text>
<polyline points="760,347 760,233" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<text x="791" y="297" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">parent_：shared_ptr</text>
<rect x="50" y="362" width="320" height="134" rx="4" fill="white" stroke="none" stroke-width="1" />
<line x1="50" y1="362" x2="370.0" y2="362" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="398" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="21" font-weight="600" text-anchor="start">Task::childPools_</text>
<text x="72" y="433" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" font-weight="400" text-anchor="start">保活 node / operator pools</text>
<text x="72" y="468" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">customChildPools_ 同理</text>
<polyline points="382,407 468,407" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="50" y="584" width="320" height="100" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="50" y="588" width="4" height="92" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="72" y="619" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">释放执行资源</text>
<text x="72" y="652" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">free buffer / release reservation</text>
<polyline points="382,632 468,632" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="480" y="584" width="320" height="100" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<rect x="480" y="588" width="4" height="92" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="502" y="619" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">最后的引用释放</text>
<text x="502" y="652" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">child 注销；root 析构回调</text>
<polyline points="812,632 898,632" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="910" y="584" width="320" height="100" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="910" y="588" width="4" height="92" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="932" y="619" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">removePool</text>
<text x="932" y="652" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">收回余量、移除 participant</text>
<text x="646" y="537" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="20" font-weight="400" text-anchor="middle">Child 和仲裁活动都可能让 root 活得比 QueryCtx 更久。</text>
<rect x="40" y="737" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="737" x2="1240.0" y2="737" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="766" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">Pool 析构做泄漏检查，不是扫描并释放任意指针的垃圾回收。</text>
<text x="60" y="791" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Task 会保留执行子池；allocator / arbitrator 的提供方还必须满足它们被借用期间的生命周期。</text>
</svg>