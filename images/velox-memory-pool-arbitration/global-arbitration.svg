<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title desc">
<title id="title">全局仲裁线程时序：控制线程也参与回收</title><desc id="desc">展示一次存在多个 victim 的成功路径。请求线程同步等待；容量归还方可直接唤醒它。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="1090" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="1074" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
