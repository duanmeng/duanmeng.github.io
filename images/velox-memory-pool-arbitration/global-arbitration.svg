<polyline points="145,320 475,320" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="197.5" y="291" width="225" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="310.0" y="310" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">通知 condition variable</text>
