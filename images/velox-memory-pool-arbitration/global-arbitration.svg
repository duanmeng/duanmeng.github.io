<text x="55" y="368" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Driver 请求方已 suspended；future.wait 保留原线程</text>
<polyline points="475,426 805,426" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="488.0" y="397" width="304" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="640.0" y="416" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">第 2 个起：executor.add(prepare)</text>
<rect x="350" y="458" width="250" height="121" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="369" y="490" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="600" text-anchor="start">第 1 个回收任务</text>
<text x="369" y="525" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">move() 在控制线程执行</text>
<text x="369" y="552" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">pause → reclaim → shrink</text>
<rect x="680" y="458" width="250" height="121" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="699" y="490" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="600" text-anchor="start">其他回收任务</text>
<text x="699" y="525" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">worker 或调用方执行</text>
<text x="699" y="552" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">pause → reclaim → shrink</text>
<polyline points="805,623 1135,623" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="863.5" y="594" width="213" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="970.0" y="613" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">freeCapacity：归还额度</text>
<rect x="813" y="643" width="164" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="819" y="665" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">锁内分配给 waiter</text>
<polyline points="1135,711 145,711" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="449.5" y="682" width="381" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="640.0" y="701" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">出锁兑现 promise；也可能由控制线程归还触发</text>
<polyline points="145,760 191,760 191,790 145,790" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="224" y="759" width="360" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="230" y="781" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">请求方：在 root 提交 grow + reservation</text>
<polyline points="805,830 475,830" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="513.5" y="801" width="253" height="24" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="640.0" y="820" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="middle">move() 收集结果；必要时等待</text>
<rect x="326" y="855" width="339" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="332" y="877" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">这一批结束后，控制线程重新计算回收目标</text>
<rect x="49" y="913" width="417" height="29" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="55" y="935" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">请求方检查结果、退出 suspension，继续 allocate</text>
<rect x="40" y="988" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="1017" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">控制线程不是派发后即返回；第一个任务在本线程执行，其他结果通过 move() 收集。</text>
<text x="60" y="1042" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">请求方可在某个 victim 归还足够额度时被唤醒，无需等待整批回收完成。</text>
</svg>