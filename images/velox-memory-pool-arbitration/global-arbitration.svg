<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">全局仲裁线程时序：控制线程也参与回收</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">展示一次存在多个 victim 的成功路径。请求线程同步等待；容量归还方可直接唤醒它。</text>
