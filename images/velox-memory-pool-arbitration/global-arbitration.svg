<text x="475" y="205" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">ArbitrationMain</text>
<line x1="475" y1="233" x2="475" y2="957" stroke="#d6d3cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="695" y="140" width="220" height="82" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="695" y="144" width="4" height="74" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
