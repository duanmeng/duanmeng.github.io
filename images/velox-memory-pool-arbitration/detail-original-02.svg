<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="534" viewBox="0 0 1280 534" role="img"><title>进入仲裁：从 Pool 桥接到 Driver</title><rect width="1280" height="534" fill="white"/><rect x="8" y="8" width="1264" height="518" fill="white" stroke="#d6d3cc"/><rect x="9" y="9" width="1262" height="76" fill="#edf5ff"/><text x="36" y="53" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="26" fill="#111827">进入仲裁：从 Pool 桥接到 Driver</text><g transform="translate(24 106) scale(1.4)">
<rect fill="#f2f7ff" height="56" rx="4" stroke="#d6d3cc" stroke-width="1" width="760" x="60" y="16"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14.0" font-weight="500" text-anchor="start" x="76" y="40">Layer 1 — MemoryPoolArbitrationSection (pool 层 RAII guard)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" text-anchor="start" x="76" y="62">ctor: pool-&gt;enterArbitration()　·　dtor: pool-&gt;leaveArbitration()</text><rect fill="#f2f7ff" height="56" rx="4" stroke="#d6d3cc" stroke-width="1" width="760" x="60" y="82"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14.0" font-weight="500" text-anchor="start" x="76" y="106">Layer 2 — MemoryPoolImpl::enter / leaveArbitration</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" text-anchor="start" x="76" y="128">委托给 reclaimer_</text><rect fill="#f2f7ff" height="56" rx="4" stroke="#d6d3cc" stroke-width="1" width="760" x="60" y="148"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14.0" font-weight="500" text-anchor="start" x="76" y="172">Layer 3 — MemoryReclaimer::enter / leaveArbitration (virtual)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" text-anchor="start" x="76" y="194">具体桥接：exec::MemoryReclaimer / Operator reclaimer</text><rect fill="#f2f7ff" height="56" rx="4" stroke="#d6d3cc" stroke-width="1" width="760" x="60" y="214"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14.0" font-weight="500" text-anchor="start" x="76" y="238">Layer 4 — Task::enter / leaveSuspended (停稳计数协议)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" text-anchor="start" x="76" y="260">state.numSuspensions 递增/递减；仅外层进入/离开调整 numThreads_</text>
</g></svg>