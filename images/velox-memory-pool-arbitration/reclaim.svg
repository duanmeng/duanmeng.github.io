<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="962" viewBox="0 0 1280 962" role="img" aria-labelledby="title desc">
<title id="title">从回收到额度归还：两个阶段的闭环</title><desc id="desc">Reclaimer 沿执行树操作资源；Arbitrator 在 shrink 之后才能把 capacity 分配给其他 root。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="962" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="946" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">从回收到额度归还：两个阶段的闭环</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Reclaimer 沿执行树操作资源；Arbitrator 在 shrink 之后才能把 capacity 分配给其他 root。</text>
<rect x="50" y="148" width="670" height="102" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="152" width="4" height="94" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">QueryCtx reclaimer</text>
<text x="72" y="216" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">标记查询处于回收阶段</text>
<polyline points="385,259 385,275" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="286" width="670" height="102" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="50" y="290" width="4" height="94" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="72" y="321" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Task reclaimer</text>
<text x="72" y="354" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">requestPause → 等活跃计数归零</text>
<polyline points="385,397 385,413" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="424" width="670" height="102" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="50" y="428" width="4" height="94" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="72" y="459" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Node / Operator reclaimer</text>
<text x="72" y="492" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">检查可回收状态，释放执行资源</text>
<rect x="830" y="148" width="400" height="132" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<rect x="830" y="152" width="4" height="124" rx="0" fill="#c2410c" stroke="none" stroke-width="1"/>
<text x="852" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">请求方 Driver</text>
<text x="852" y="216" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Suspended 保留线程和栈</text>
<text x="852" y="249" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">暂不计入 Task 活跃线程数。</text>
<rect x="830" y="306" width="400" height="112" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="830" y="310" width="4" height="104" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="852" y="341" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">其他活跃 Driver</text>
<text x="852" y="374" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">协作式响应 pause 请求</text>
<text x="852" y="398" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">不是抢占式强停。</text>
<rect x="830" y="472" width="400" height="117" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="830" y="476" width="4" height="109" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="852" y="507" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">保护算子状态</text>
<text x="852" y="540" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">canReclaim / 非回收区检查</text>
<text x="852" y="565" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">Hash Join 使用专用 reclaimer。</text>
<polyline points="732,337 818,362" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="732,475 818,526" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="563" width="670" height="102" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="567" width="4" height="94" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="598" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">退出回收作用域</text>
<text x="72" y="631" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Task::resume；QueryCtx 结束回收阶段</text>
<polyline points="385,537 385,551" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="707" width="670" height="108" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="50" y="711" width="4" height="100" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="72" y="742" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Participant::shrink(false)</text>
<text x="72" y="775" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">降低 root capacity，再 freeCapacity 归还额度</text>
<polyline points="385,677 385,695" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="830" y="663" width="400" height="150" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="852" y="699" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="22" font-weight="600" text-anchor="start">三个不同的数量</text>
<text x="852" y="735" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="start">释放的 reservation / 退回的 capacity</text>
<text x="852" y="772" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="17" font-weight="400" text-anchor="start">写出的 spill bytes</text>
<rect x="40" y="860" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="889" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">普通 shrink 保留 min(固定空闲量, capacity × 比例)，并尊重 participant minimum。</text>
<text x="60" y="914" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Reclaim 可能部分完成或返回 0；暂停成功仍不代表每个算子都可以回收。</text>
</svg>