rif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">init = 128M</text><rect x="954" y="482" width="406" height="60" rx="5" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5" /><rect x="954" y="482" width="4" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="954" y="585" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">0</text><text x="1360" y="585" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="end">30 GB</text><text x="48" y="676" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">实色浅底：当前 capacity；整条标尺：该 query 的 maxCapacity</text><line x1="48" y1="764" x2="1392" y2="764" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="798" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">约束:0 ≤ reservationBytes_ ≤ capacity_ ≤ maxCapacity_　·　Σ root.capacity_ ≤ arbitrator.capacity_</text><text x="48" y="832" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">maxCap = 每 query 上限　·　cap = 当前持有(动态)　·　init = 创建时初始</text></svg>