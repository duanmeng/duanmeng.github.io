<text x="55" y="612" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="400" text-anchor="start">横向：同 node 的多个算子可由 executor 并行回收，须满足具体算子的共享资源协议。</text>
<text x="55" y="653" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="400" text-anchor="start">纵向：默认树内有顺序和早停规则；不能仅凭独立 pool 推导所有状态互不共享。</text>
<rect x="40" y="678" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="707" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">一个 op pool 是记账边界，不自动构成线程安全证明。</text>
<text x="60" y="732" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">reclaim 的并行度还受调用线程、executor 和 I/O/内存峰值制约。</text>
