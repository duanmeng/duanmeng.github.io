<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">从行状态到磁盘文件</title><desc id="desc">run、batch 和 file 使用不同边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="744" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">从行状态到磁盘文件</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">run、batch 和 file 使用不同边界。</text>
<rect x="50" y="170" width="350" height="118" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="174" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">RowContainer</text>
<text x="72" y="238" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">执行状态仍由算子持有</text>
<polyline points="410,229 450,229" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="170" width="350" height="118" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="174" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">fillSpillRuns</text>
<text x="487" y="238" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">每次取最多 4096 个候选行</text>
<polyline points="825,229 865,229" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="880" y="170" width="350" height="118" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="174" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">分区 run</text>
<text x="902" y="238" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">收集 char* 行指针</text>
<rect x="50" y="395" width="350" height="118" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="399" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="430" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">可选排序</text>
<text x="72" y="463" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">按 key 排序指针</text>
<polyline points="410,454 450,454" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="395" width="350" height="118" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="399" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="430" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">extractSpillVector</text>
<text x="487" y="463" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">最多 64 行，目标约 256 KiB</text>
<polyline points="825,454 865,454" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="880" y="395" width="350" height="118" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="399" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="430" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">append / finishFile</text>
<text x="902" y="463" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">序列化、缓冲和磁盘写入</text>
<polyline points="1055,305 1055,340 225,340 225,378" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="658" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="658.0" x2="1240.0" y2="658.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="687" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">字节目标允许包含跨过阈值的最后一行，以保证前进。</text>
<text x="60" y="712" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">runSpill 清指针数组；成功后由算子清理 RowContainer。</text>
</svg>
