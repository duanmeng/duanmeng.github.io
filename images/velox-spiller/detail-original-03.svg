<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="733" viewBox="0 0 1440 733" role="img"><title>Build / Probe / Restore 三阶段</title><desc>Build 阶段</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="755" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Build / Probe / Restore 三阶段</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Build 阶段</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><line x1="90" y1="150" x2="1334" y2="150" stroke="#dce3ea" stroke-width="1.85" /><text x="90" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Build 阶段</text><text x="90" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">addInput → ensureInputFits → [内存不足] → reclaim</text><text x="90" y="251" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">spill 触发后:addInput → spillInput → 直接 spill 到对应 partition</text><text x="90" y="285" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">noMoreInput → finishHashBuild → finishSpill → joinBridge.setHashTable</text><text x="90" y="319" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">postHashBuildProcess → waitForProbe / setupSpillInput</text><line x1="90" y1="368" x2="1334" y2="368" stroke="#dce3ea" stroke-width="1.85" /><text x="90" y="397" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Probe 阶段</text><text x="90" y="435" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">探测内存中的 hash 表 + 同步 spill 对应分区的 probe 侧数据</text><text x="90" y="469" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">joinBridge.setSpillPartitions → build 侧 setupSpillInput</text><line x1="90" y1="518" x2="1334" y2="518" stroke="#dce3ea" stroke-width="1.85" /><text x="90" y="547" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Restore 阶段(递归,每个 spill partition 一轮)</text><text x="90" y="585" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">setupSpillInput → processSpillInput → addInput(重建表)</text><text x="90" y="619" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">→ finishHashBuild → 新一轮 probe / 再次 spill(递归)</text><polyline points="66,238 66,373 90,373" fill="none" stroke="#4078bd" stroke-width="1.85" marker-end="url(#a-blue)" /><polyline points="66,450 66,522 90,522" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="1360,648.1772 1406,648.1772 1406,397 1350,397" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-green)" /><text x="91" y="695" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">按 partition ID 继续下一轮；递归 spill 会产生更深的子分区。</text></svg>