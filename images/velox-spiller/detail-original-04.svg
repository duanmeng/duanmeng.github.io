<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="813" viewBox="0 0 1440 813" role="img"><title>HashJoinBridge 的交接事件</title><desc>HashJoinBridge — Build / Probe 协调中枢</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="868" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">HashJoinBridge 的交接事件</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">HashJoinBridge — Build / Probe 协调中枢</text><line x1="48" y1="116.8596" x2="1392" y2="116.8596" stroke="#dce3ea" stroke-width="1.85" /><rect x="48" y="141" width="369" height="62" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="232.5" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="400" text-anchor="middle">HashBuild peers</text><rect x="535" y="141" width="369" height="62" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="719.5" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="400" text-anchor="middle">HashJoinBridge</text><rect x="1023" y="141" width="369" height="62" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="1207.5" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="400" text-anchor="middle">HashProbe peers</text><line x1="232" y1="203" x2="232" y2="740.9174" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6" /><line x1="719" y1="203" x2="719" y2="740.9174" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6" /><line x1="1207" y1="203" x2="1207" y2="740.9174" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6" /><polyline points="232,299.3478 719,299.3478" fill="none" stroke="#4078bd" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-blue)" /><text x="260" y="282" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">setHashTable(table, spillPartitionSet, …)</text><polyline points="719,380 1207,380" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-green)" /><text x="756" y="355" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">probe 侧 asyncWaitForHashTable 取到 HashBuildResult</text><polyline points="1207,528 719,528" fill="none" stroke="#8d76b7" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-purple)" /><text x="756" y="503" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">probeFinished()</text><polyline points="1207,717.5455 719,717.5455" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><text x="756" y="701" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">appendSpilledHashTablePartitions(spillPartitionSet)</text><text x="756" y="433" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">spillPartitionIds 非空 → 触发 input spill</text><text x="48" y="593" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">last prober 调用,通知 bridge 准备下一个要恢复的 partition</text><text x="48" y="627" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">从 spillPartitionSets_ 取下一个 → split 为 N shard 分发给各 build 线程</text><polyline points="719,661.7037 232,661.7037" fill="none" stroke="#8d76b7" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-purple)" /><text x="48" y="775" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">probe 侧 reclaim 时,将被 spill 的 hash table 分区交还 bridge</text></svg>