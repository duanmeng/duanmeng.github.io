<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="863" viewBox="0 0 1280 863" role="img" aria-labelledby="title desc">
<title id="title">HashBuild：输入、发布与 spill 恢复循环</title><desc id="desc">保留写出与恢复的全部阶段；常规 build 先保存行，再由 prepareJoinTable 建立最终索引。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.6" /></marker></defs>
<rect x="0" y="0" width="1280" height="874" rx="0" fill="white" stroke="none" stroke-width="1" />
<rect x="8" y="8" width="1264" height="858" rx="4" fill="white" stroke="none" stroke-width="1" />
<rect x="9" y="9" width="1262" height="89.7547" rx="0" fill="white" stroke="none" stroke-width="1" />
<line x1="9" y1="98.7547" x2="1271" y2="98.7547" stroke="#dce3ea" stroke-width="1.85" />
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">HashBuild：输入、发布与 spill 恢复循环</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">保留写出与恢复的全部阶段；常规 build 先保存行，再由 prepareJoinTable 建立最终索引。</text>
<rect x="55" y="120.9434" width="1170" height="91.4437" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="55" y="124" width="4" height="86.5806" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="155" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">初始化 → addInput → ensureInputFits</text>
<text x="77" y="188" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">触发回收时：fillSpillRuns → 可选排序 → writeSpill → 磁盘</text>
<polyline points="640,216 640,225.0323" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="55" y="229.0968" width="1170" height="91.2903" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="55" y="232" width="4" height="86.5806" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="263" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">写出成功后的状态变化</text>
<text x="77" y="296" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">清理相应表状态 clear(true)，记录 spillTriggered_；清 run 指针不等于清源行</text>
<polyline points="640,324 640,333.0323" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="55" y="337.0968" width="1170" height="91.2903" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="55" y="340" width="4" height="86.5806" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="371" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">后续输入路由</text>
<text x="77" y="404" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">已 spill 的分区 → spillInput；其余行 → RowContainer（特定去重路径可建索引）</text>
<polyline points="640,432 640,441.0323" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="55" y="445.0968" width="1170" height="91.2903" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="55" y="448" width="4" height="86.5806" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="479" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">noMoreInput → finishHashBuild</text>
<text x="77" y="512" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">peer barrier 后合并文件；prepareJoinTable 处理保留行；bridge 发布 table / partitions</text>
<polyline points="640,540 640,549.0323" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="55" y="553.0968" width="1170" height="91.2903" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="55" y="556" width="4" height="86.5806" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="587" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">Probe 本轮探测与收尾</text>
<text x="77" y="620" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">探测内存表，保存对应分区的 probe 输入；必要时还需保存尚未排出的输出</text>
<polyline points="640,648 640,657.0323" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="55" y="661.0968" width="1170" height="90.2366" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="55" y="664" width="4" height="85.7101" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="77" y="695" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">下一轮恢复或结束</text>
<text x="77" y="728" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">setupSpillInput → processSpillInput → addInput；不足时换后续 hash bits 继续分区</text>
<rect x="40" y="772" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="772" x2="1240.0" y2="772" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="801" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">没有待恢复分区时 Finish；递归仍受分区层数、hash 位和磁盘等限制。</text>
<text x="60" y="826" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Build / Probe 的分区身份必须一致；不能丢弃已经匹配的标记或重新输出已交付的前缀。</text>
</svg>