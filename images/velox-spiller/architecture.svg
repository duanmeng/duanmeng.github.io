<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1162" viewBox="0 0 1440 1162" role="img"><title>Spill 的分层：语义 → 写出 → 文件</title><desc>算子决定恢复需要什么；通用基础设施不替算子选择语义。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1162" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Spill 的分层：语义 → 写出 → 文件</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">算子决定恢复需要什么；通用基础设施不替算子选择语义。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><rect x="48" y="192" width="435" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="66" y="228" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Operator</text><text x="48" y="294" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">HashJoin / Aggregation / Sort</text><text x="48" y="328" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">触发时机与恢复逻辑</text><line x1="835" y1="197" x2="1392" y2="197" stroke="#dce3ea" stroke-width="1.5" /><text x="835" y="226" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">资源状态</text><text x="835" y="264" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">何时可 reclaim</text><text x="835" y="298" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">何时能清原始执行状态</text><rect x="48" y="477" width="435" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="66" y="513" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Spiller</text><text x="48" y="579" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">分区 / run / 排序 / 提取</text><text x="48" y="613" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">RowContainer 或直接 RowVector</text><line x1="835" y1="482" x2="1392" y2="482" stroke="#dce3ea" stroke-width="1.5" /><text x="835" y="511" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">临时数据</text><text x="835" y="549" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">spill pool 分配</text><text x="835" y="583" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">指针数组、提取向量和缓冲</text><rect x="48" y="772" width="435" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="66" y="808" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">SpillState / File</text><text x="48" y="874" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">writer / 文件列表 / reader</text><text x="48" y="908" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">序列化页及统计</text><line x1="835" y1="777" x2="1392" y2="777" stroke="#dce3ea" stroke-width="1.5" /><text x="835" y="806" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">读回协议</text><text x="835" y="844" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">unordered / ordered</text><text x="835" y="878" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">重建表或按 key / 顺序归并</text><polyline points="264,366 264,477" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)" /><polyline points="264,651 264,772" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)" /><line x1="48" y1="1040" x2="1392" y2="1040" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1074" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Spill 文件不是 RowContainer 内存的直接 dump。</text><text x="48" y="1108" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">恢复后仍可能受内存、磁盘或递归层数限制。</text></svg>