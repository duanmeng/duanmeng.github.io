<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Spill 的分层：语义 → 写出 → 文件</title><desc id="desc">算子决定恢复需要什么；通用基础设施不替算子选择语义。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="744" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">Spill 的分层：语义 → 写出 → 文件</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">算子决定恢复需要什么；通用基础设施不替算子选择语义。</text>
<rect x="50" y="165" width="350" height="128" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="169" width="4" height="120" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="200" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Operator</text>
<text x="72" y="233" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">HashJoin / Aggregation / Sort</text>
<text x="72" y="265" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">触发时机与恢复逻辑</text>
<polyline points="414,225 450,225" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="370" width="350" height="155" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="374" width="4" height="147" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="405" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">资源状态</text>
<text x="72" y="438" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">何时可 reclaim</text>
<text x="72" y="477" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">何时能清原始执行状态</text>
<polyline points="225,306 225,353" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="165" width="350" height="128" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="465" y="169" width="4" height="120" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="487" y="200" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Spiller</text>
<text x="487" y="233" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">分区 / run / 排序 / 提取</text>
<text x="487" y="265" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">RowContainer 或直接 RowVector</text>
<polyline points="829,225 865,225" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="370" width="350" height="155" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="465" y="374" width="4" height="147" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="487" y="405" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">临时数据</text>
<text x="487" y="438" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">spill pool 分配</text>
<text x="487" y="477" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">指针数组、提取向量和缓冲</text>
<polyline points="640,306 640,353" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="880" y="165" width="350" height="128" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="880" y="169" width="4" height="120" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="902" y="200" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">SpillState / File</text>
<text x="902" y="233" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">writer / 文件列表 / reader</text>
<text x="902" y="265" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">序列化页及统计</text>
<rect x="880" y="370" width="350" height="155" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="880" y="374" width="4" height="147" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="902" y="405" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">读回协议</text>
<text x="902" y="438" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">unordered / ordered</text>
<text x="902" y="477" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="16" font-weight="400" text-anchor="start">重建表或按 key / 顺序归并</text>
<polyline points="1055,306 1055,353" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="658" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="687" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">Spill 文件不是 RowContainer 内存的直接 dump。</text>
<text x="60" y="712" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">恢复后仍可能受内存、磁盘或递归层数限制。</text>
</svg>