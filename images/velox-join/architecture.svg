<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1126" viewBox="0 0 1440 1126" role="img"><title>HashJoin：两条 pipeline 的共享状态协议</title><desc>多个 build / probe Driver 各自拥有 Operator 实例。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1143" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">HashJoin：两条 pipeline 的共享状态协议</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">多个 build / probe Driver 各自拥有 Operator 实例。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="177" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">Build pipeline：每个 Driver 保存局部输入</text><rect x="48" y="221" width="616" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="66" y="257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">HashBuild × N</text><text x="48" y="323" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">输入 → 局部 RowContainer</text><text x="48" y="357" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">最后到达者协调 prepareJoinTable</text><line x1="795" y1="223" x2="1392" y2="223" stroke="#dce3ea" stroke-width="1.85" /><text x="795" y="252" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">输入语义</text><text x="795" y="290" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">key / payload / null</text><text x="795" y="324" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">重复行能否丢弃由 join 类型决定</text><rect x="48" y="404" width="332" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="214.0" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Driver 0</text><rect x="385" y="404" width="332" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="551.0" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Driver 1</text><rect x="722" y="404" width="332" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="888.0" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">…</text><rect x="1059" y="404" width="332" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="1225.0" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Driver N−1</text><polyline points="720,460 720,487.7576" fill="none" stroke="#4078bd" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-blue)" /><rect x="48" y="496" width="616" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="66" y="532" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">HashJoinBridge</text><text x="48" y="597" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">HashBuildResult</text><text x="48" y="631" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">共享表、分区 ID 与等待 promises</text><line x1="795" y1="498" x2="1392" y2="498" stroke="#dce3ea" stroke-width="1.85" /><text x="795" y="527" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">发布 / 恢复</text><text x="795" y="565" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">tableOrFuture</text><text x="795" y="599" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">spillInputOrFuture / probeFinished</text><polyline points="720,663.9565 720,694" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-green)" /><text x="48" y="710" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">Probe pipeline：从共享表生成连接结果</text><rect x="48" y="754" width="616" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="66" y="790" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">HashProbe × M</text><text x="48" y="855" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">查表 → filter → 输出</text><text x="48" y="889" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">保留跨 batch 的结果迭代状态</text><line x1="795" y1="756" x2="1392" y2="756" stroke="#dce3ea" stroke-width="1.85" /><text x="795" y="785" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">输出语义</text><text x="795" y="823" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">匹配、补行、标记</text><text x="795" y="857" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">right-side 输出可能并行分工</text><rect x="48" y="936" width="332" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="214.0" y="971" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">Driver 0</text><rect x="385" y="936" width="332" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="551.0" y="971" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">Driver 1</text><rect x="722" y="936" width="332" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="888.0" y="971" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">…</text><rect x="1059" y="936" width="332" height="56" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="1225.0" y="971" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">Driver M−1</text><line x1="48" y1="1022.623" x2="1392" y2="1022.623" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="1055" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">最后到达的 build 是协调者；实际建表可按条件并行。</text><text x="48" y="1089" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">HashBuild 的 getOutput 返回空，表通过 bridge 发布。</text></svg>