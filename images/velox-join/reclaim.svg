<line x1="465" y1="126" x2="815.0" y2="126" stroke="#dce3ea" stroke-width="1.85" /><rect x="465" y="130" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="487" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">发布后 / probe 前</text>
<text x="487" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">HashJoinBridge::reclaim</text>
