<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="526" viewBox="0 0 1280 526" role="img" aria-labelledby="title desc">
<title id="title">表在三个阶段由谁回收</title><desc id="desc">Task 暂停和可回收状态是重要前提。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.6" /></marker></defs>
<rect x="0" y="0" width="1280" height="537" rx="0" fill="white" stroke="none" stroke-width="1" />
<rect x="8" y="8" width="1264" height="521" rx="4" fill="white" stroke="none" stroke-width="1" />
