<line x1="880" y1="285.2533" x2="1230.0" y2="285.2533" stroke="#dce3ea" stroke-width="1.85" /><rect x="880" y="288" width="4" height="122.0909" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="902" y="319" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">保存执行语义</text>
<text x="902" y="352" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">spill output / table / input</text>
<text x="902" y="391" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">维护 probed flag 与恢复 ID</text>
<polyline points="1055,261.36 1055,278.9067" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="40" y="435" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="435" x2="1240.0" y2="435" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="464" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">reclaim 不是任意时刻删除 targetBytes 字节。</text>
<text x="60" y="489" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">cached table、counting join、递归限制和执行模式都会限制 canSpill。</text>
