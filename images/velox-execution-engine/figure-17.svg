<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Bucket 的 128 字节布局</title><desc id="desc">以下宽度按字节比例绘制；Bucket 占两个 64 B cache line。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="730" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Bucket 的 128 字节布局</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">以下宽度按字节比例绘制；Bucket 占两个 64 B cache line。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="132" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 0</text><rect x="205" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="277" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 1</text><rect x="350" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="422" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 2</text><rect x="495" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="567" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 3</text><rect x="640" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="712" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 4</text><rect x="785" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="857" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 5</text><rect x="930" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="1002" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 6</text><rect x="1075" y="165" width="145" height="63" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="1147" y="205" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">Bucket 7</text><polyline points="132,228 132,307 640,307 640,369" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="655" y="300" font-size="17" fill="#657386" text-anchor="start">放大一个 Bucket</text><rect x="60" y="372" width="145" height="100" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="132.5" y="411" font-size="21" fill="#65537f" text-anchor="middle" font-weight="600">tags</text><text x="132.5" y="449" font-size="19" fill="#657386" text-anchor="middle">16 B</text><rect x="205" y="372" width="870" height="100" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="640.0" y="411" font-size="21" fill="#2e7963" text-anchor="middle" font-weight="600">row pointers</text><text x="640.0" y="449" font-size="19" fill="#657386" text-anchor="middle">16 × 6 = 96 B</text><rect x="1075" y="372" width="145" height="100" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="1147.5" y="411" font-size="21" fill="#877951" text-anchor="middle" font-weight="600">padding</text><text x="1147.5" y="449" font-size="19" fill="#657386" text-anchor="middle">16 B</text><text x="60" y="508" font-size="18" fill="#657386" text-anchor="middle">0</text><text x="205" y="508" font-size="18" fill="#657386" text-anchor="middle">16</text><text x="1075" y="508" font-size="18" fill="#657386" text-anchor="middle">112</text><text x="1220" y="508" font-size="18" fill="#657386" text-anchor="middle">128</text><line x1="640" y1="348" x2="640" y2="527" stroke="#657386" stroke-width="1.6" stroke-dasharray="5 5" /><text x="640" y="557" font-size="20" fill="#657386" text-anchor="middle">byte 64：cache-line 边界位于 pointers 区</text><line x1="48" y1="641" x2="1232" y2="641" stroke="#dce3ea" stroke-width="1" /><text x="48" y="668" font-size="18" fill="#657386" text-anchor="start">非 kArray 容量 = bucket 数 × 16；当前 kHashTableLoadFactor = 0.7。</text><text x="48" y="696" font-size="18" fill="#657386" text-anchor="start">kArray 模式直接用 value ID 索引 row-pointer 数组，不使用这套 Bucket 目录。</text></svg>