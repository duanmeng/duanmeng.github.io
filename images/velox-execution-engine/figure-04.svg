<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">FlatVector：值缓冲区与 null 位图</title><desc id="desc">INTEGER 的 C++ 存储为 int32_t；每一行的有效性由位图决定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="820" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">FlatVector：值缓冲区与 null 位图</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">INTEGER 的 C++ 存储为 int32_t；每一行的有效性由位图决定。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="155" width="640" height="40" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="77" y="182.6" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="177" y="182.6" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">逻辑值</text><text x="367" y="182.6" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">values_[row]</text><text x="587" y="182.6" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">null bit</text><rect x="65" y="195" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="222.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="177" y="222.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="367" y="222.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="587" y="222.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="235" x2="705" y2="235" stroke="#dce3ea" stroke-width="1" /><text x="77" y="262.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="177" y="262.6" font-size="18" fill="#1f2d3d" text-anchor="start">10</text><text x="367" y="262.6" font-size="18" fill="#1f2d3d" text-anchor="start">10</text><text x="587" y="262.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="275" x2="705" y2="275" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="275" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="302.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><text x="177" y="302.6" font-size="18" fill="#1f2d3d" text-anchor="start">NULL</text><text x="367" y="302.6" font-size="18" fill="#1f2d3d" text-anchor="start">2347632</text><text x="587" y="302.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="65" y1="315" x2="705" y2="315" stroke="#dce3ea" stroke-width="1" /><text x="77" y="342.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="177" y="342.6" font-size="18" fill="#1f2d3d" text-anchor="start">30</text><text x="367" y="342.6" font-size="18" fill="#1f2d3d" text-anchor="start">30</text><text x="587" y="342.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="355" x2="705" y2="355" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="355" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="382.6" font-size="18" fill="#1f2d3d" text-anchor="start">4</text><text x="177" y="382.6" font-size="18" fill="#1f2d3d" text-anchor="start">40</text><text x="367" y="382.6" font-size="18" fill="#1f2d3d" text-anchor="start">40</text><text x="587" y="382.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="395" x2="705" y2="395" stroke="#dce3ea" stroke-width="1" /><text x="77" y="422.6" font-size="18" fill="#1f2d3d" text-anchor="start">5</text><text x="177" y="422.6" font-size="18" fill="#1f2d3d" text-anchor="start">50</text><text x="367" y="422.6" font-size="18" fill="#1f2d3d" text-anchor="start">50</text><text x="587" y="422.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="435" x2="705" y2="435" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="435" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="462.6" font-size="18" fill="#1f2d3d" text-anchor="start">6</text><text x="177" y="462.6" font-size="18" fill="#1f2d3d" text-anchor="start">60</text><text x="367" y="462.6" font-size="18" fill="#1f2d3d" text-anchor="start">60</text><text x="587" y="462.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="475" x2="705" y2="475" stroke="#dce3ea" stroke-width="1" /><text x="77" y="502.6" font-size="18" fill="#1f2d3d" text-anchor="start">7</text><text x="177" y="502.6" font-size="18" fill="#1f2d3d" text-anchor="start">NULL</text><text x="367" y="502.6" font-size="18" fill="#1f2d3d" text-anchor="start">4326543</text><text x="587" y="502.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="65" y1="515" x2="705" y2="515" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="515" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="542.6" font-size="18" fill="#1f2d3d" text-anchor="start">8</text><text x="177" y="542.6" font-size="18" fill="#1f2d3d" text-anchor="start">80</text><text x="367" y="542.6" font-size="18" fill="#1f2d3d" text-anchor="start">80</text><text x="587" y="542.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="555" x2="705" y2="555" stroke="#dce3ea" stroke-width="1" /><text x="77" y="582.6" font-size="18" fill="#1f2d3d" text-anchor="start">9</text><text x="177" y="582.6" font-size="18" fill="#1f2d3d" text-anchor="start">90</text><text x="367" y="582.6" font-size="18" fill="#1f2d3d" text-anchor="start">90</text><text x="587" y="582.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="595" x2="705" y2="595" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="595" width="640" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="77" y="622.6" font-size="18" fill="#1f2d3d" text-anchor="start">10</text><text x="177" y="622.6" font-size="18" fill="#1f2d3d" text-anchor="start">100</text><text x="367" y="622.6" font-size="18" fill="#1f2d3d" text-anchor="start">100</text><text x="587" y="622.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="65" y1="635" x2="705" y2="635" stroke="#dce3ea" stroke-width="1" /><text x="77" y="662.6" font-size="18" fill="#1f2d3d" text-anchor="start">11</text><text x="177" y="662.6" font-size="18" fill="#1f2d3d" text-anchor="start">NULL</text><text x="367" y="662.6" font-size="18" fill="#1f2d3d" text-anchor="start">6534561</text><text x="587" y="662.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="65" y1="675" x2="705" y2="675" stroke="#dce3ea" stroke-width="1" /><rect x="765" y="170" width="440" height="175" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="783" y="203" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">0 = NULL；1 = 非空</text><text x="783" y="237" font-size="18" fill="#657386" text-anchor="start">没有 null buffer 时，所有行非空。</text><text x="783" y="266" font-size="18" fill="#657386" text-anchor="start">NULL 行的 value bytes 不可解释为值。</text><text x="783" y="295" font-size="18" fill="#657386" text-anchor="start">BOOLEAN 的 values 另用 bit-packed 布局。</text><rect x="765" y="397" width="440" height="150" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="783" y="430" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">BaseVector 元信息</text><text x="783" y="464" font-size="18" fill="#657386" text-anchor="start">type() = INTEGER()，size() = 12</text><text x="783" y="493" font-size="18" fill="#657386" text-anchor="start">向量编码 = FLAT</text><text x="783" y="522" font-size="18" fill="#657386" text-anchor="start">编码方式与逻辑类型是两条不同维度。</text><line x1="48" y1="759" x2="1232" y2="759" stroke="#dce3ea" stroke-width="1" /><text x="48" y="786" font-size="18" fill="#657386" text-anchor="start">数组下标定位一个值，但访问前仍要遵守 null 语义；图中的 NULL 槽字节只是原例占位。</text></svg>