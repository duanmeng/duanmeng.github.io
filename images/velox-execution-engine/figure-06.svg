,222 795,222" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="560" y="251" font-size="17" fill="#657386" text-anchor="start">通过索引引用</text><rect x="750" y="515" width="455" height="168" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="768" y="548" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">DICTIONARY + VARCHAR()</text><text x="768" y="582" font-size="18" fill="#657386" text-anchor="start">外层 null 与底层 null 共同决定结果。</text><text x="768" y="611" font-size="18" fill="#657386" text-anchor="start">过滤或排序可创建新的 indices。</text><text x="768" y="640" font-size="18" fill="#657386" text-anchor="start">多层 Dictionary 的索引可以组合。</text><line x1="48" y1="779" x2="1232" y2="779" stroke="#dce3ea" stroke-width="1" /><text x="48" y="806" font-size="18" fill="#657386" text-anchor="start">逻辑行数仍然是 12，底层只有 6 个 StringView；映射本身也占用内存，需权衡收益。</text></svg>