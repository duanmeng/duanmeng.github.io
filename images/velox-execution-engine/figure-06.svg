<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">DictionaryVector：用索引重排、筛选与复用值</title><desc id="desc">不复制底层值，也不意味着底层一定是已去重的字典。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="840" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">DictionaryVector：用索引重排、筛选与复用值</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">不复制底层值，也不意味着底层一定是已去重的字典。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="155" width="460" height="42" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="72" y="183.98" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="157" y="183.98" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">逻辑值</text><text x="362" y="183.98" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">indices_[row]</text><rect x="60" y="197" width="460" height="42" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="225.98" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="157" y="225.98" font-size="18" fill="#1f2d3d" text-anchor="start">red</text><text x="362" y="225.98" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="60" y1="239" x2="520" y2="239" stroke="#dce3ea" stroke-width="1" /><text x="72" y="267.98" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="157" y="267.98" font-size="18" fill="#1f2d3d" text-anchor="start">blue</text><text x="362" y="267.98" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="60" y1="28