<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Reservation 的量化，不是 malloc 的分配粒度</title><desc id="desc">MemoryPool::quantizedSize(size) 量化的是累计 reservation 需求。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="650" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Reservation 的量化，不是 malloc 的分配粒度</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">MemoryPool::quantizedSize(size) 量化的是累计 reservation 需求。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="170" width="1160" height="80" rx="3" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="72" y="225.2" font-size="20" fill="#877951" text-anchor="start" font-weight="600">输入 size</text><text x="502" y="225.2" font-size="20" fill="#877951" text-anchor="start" font-weight="600">向上取整粒度</text><text x="857" y="225.2" font-size="20" fill="#877951" text-anchor="start" font-weight="600">代码中的边界</text><rect x="60" y="250" width="1160" height="80" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="305.2" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 16 MiB</text><text x="502" y="305.2" font-size="20" fill="#1f2d3d" text-anchor="start">1 MiB</text><text x="857" y="305.2" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 16 * kMB</text><line x1="60" y1="330" x2="1220" y2="330" stroke="#dce3ea" stroke-width="1" /><text x="72" y="385.2" font-size="20" fill="#1f2d3d" text-anchor="start">16 MiB ≤ size &lt; 64 MiB</text><text x="502" y="385.2" font-size="20" fill="#1f2d3d" text-anchor="start">4 MiB</text><text x="857" y="385.2" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 64 * kMB</text><line x1="60" y1="410" x2="1220" y2="410" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="410" width="1160" height="80" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="465.2" font-size="20" fill="#1f2d3d" text-anchor="start">size ≥ 64 MiB</text><text x="502" y="465.2" font-size="20" fill="#1f2d3d" text-anchor="start">8 MiB</text><text x="857" y="465.2" font-size="20" fill="#1f2d3d" text-anchor="start">其余情况</text><line x1="60" y1="490" x2="1220" y2="490" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="487" width="1160" height="82" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="78" y="520" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">目的：减少 leaf → root 的预留调整频率，在记账开销与闲置 reservation 之间取舍。</text><line x1="48" y1="589" x2="1232" y2="589" stroke="#dce3ea" stroke-width="1" /><text x="48" y="616" font-size="18" fill="#657386" text-anchor="start">这是配额 / 记账层规则；allocator 的字节分配与 page SizeClass 是另一层机制。</text></svg>