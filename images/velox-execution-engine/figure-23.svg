<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="566.8" viewBox="0 0 1280 566.8" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Reservation 的量化，不是 malloc 的分配粒度</title><desc id="desc">MemoryPool::quantizedSize(size) 量化的是累计 reservation 需求。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="566.8" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Reservation 的量化，不是 malloc 的分配粒度</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">MemoryPool::quantizedSize(size) 量化的是累计 reservation 需求。</text><line x1="48" y1="109.127" x2="1232" y2="109.127" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="125.6349" width="1160" height="64.1651" rx="3" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="125.6349" x2="1220.0" y2="125.6349" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="165" font-size="20" fill="#877951" text-anchor="start" font-weight="600">输入 size</text><text x="502" y="165" font-size="20" fill="#877951" text-anchor="start" font-weight="600">向上取整粒度</text><text x="857" y="165" font-size="20" fill="#877951" text-anchor="start" font-weight="600">代码中的边界</text><rect x="60" y="189.8" width="1160" height="80" rx="0" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="189.8" x2="1220.0" y2="189.8" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="245" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 16 MiB</text><text x="502" y="245" font-size="20" fill="#1f2d3d" text-anchor="start">1 MiB</text><text x="857" y="245" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 16 * kMB</text><line x1="60" y1="269.8" x2="1220" y2="269.8" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="325" font-size="20" fill="#1f2d3d" text-anchor="start">16 MiB ≤ size &lt; 64 MiB</text><text x="502" y="325" font-size="20" fill="#1f2d3d" text-anchor="start">4 MiB</text><text x="857" y="325" font-size="20" fill="#1f2d3d" text-anchor="start">size &lt; 64 * kMB</text><line x1="60" y1="349.8" x2="1220" y2="349.8" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="349.8" width="1160" height="80" rx="0" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="349.8" x2="1220.0" y2="349.8" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="405" font-size="20" fill="#1f2d3d" text-anchor="start">size ≥ 64 MiB</text><text x="502" y="405" font-size="20" fill="#1f2d3d" text-anchor="start">8 MiB</text><text x="857" y="405" font-size="20" fill="#1f2d3d" text-anchor="start">其余情况</text><line x1="60" y1="429.8" x2="1220" y2="429.8" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="426.8" width="1160" height="66.6667" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="78" y="459.8" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">目的：减少 leaf → root 的预留调整频率，在记账开销与闲置 reservation 之间取舍。</text><line x1="48" y1="505.8" x2="1232" y2="505.8" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="532.8" font-size="18" fill="#657386" text-anchor="start">这是配额 / 记账层规则；allocator 的字节分配与 page SizeClass 是另一层机制。</text></svg>