.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="642" y="424.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="60" y1="438" x2="890" y2="438" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="438" width="830" height="43" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="467.67" font-size="18" fill="#1f2d3d" text-anchor="start">6</text><text x="172" y="467.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="382" y="467.67" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="642" y="467.67" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="60" y1="481" x2="890" y2="481" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="510.67" font-size="18" fill="#1f2d3d" text-anchor="start">7</text><text x="172" y="510.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="382" y="510.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="642" y="510.67" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="60" y1="524" x2="890" y2="524" stroke="#dce3ea" stroke-width="1.85" /><rect x="970" y="137" width="245" height="255" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="988" y="170" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">同一结果</text><text x="988" y="204" font-size="19" fill="#1f2d3d" text-anchor="start">bitmap:</text><text x="988" y="233" font-size="19" fill="#1f2d3d" text-anchor="start">10000100</text><text x="988" y="262" font-size="19" fill="#1f2d3d" text-anchor="start">position list:</text><text x="988" y="291" font-size="19" fill="#1f2d3d" text-anchor="start">[0, 5]</text><text x="60" y="601" font-size="22" fill="#1f2d3d" text-anchor="start" font-weight="600">原文 position list 例子：活动行 [0, 2]，并不代表这些行每一列都非空</text><rect x="60" y="637" width="930" height="50" rx="3" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="72" y="671.5" font-size="18" fill="#2