">photon</text><text x="807" y="821.5" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="60" y1="837" x2="990" y2="837" stroke="#dce3ea" stroke-width="1.85" /><line x1="48" y1="872" x2="1232" y2="872" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="899" font-size="18" fill="#657386" text-anchor="start">下表沿用原例 isNull = 1 的展示口径；它与 Velox null bitmap 中 0 表示 NULL 的位极性不同。</text><text x="48" y="927" font-size="18" fill="#657386" text-anchor="start">SelectivityVector 是行集合，不是 BaseVector 的数据编码，也不是 null buffer。</text></svg>