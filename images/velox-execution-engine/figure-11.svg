<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="961" viewBox="0 0 1280 961" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">SelectivityVector：选中行与 null 是两件事</title><desc id="desc">bitmap 在过滤阶段间缩小活动集合；position list 直接列出活动行号。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="961" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">SelectivityVector：选中行与 null 是两件事</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">bitmap 在过滤阶段间缩小活动集合；position list 直接列出活动行号。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="830" height="43" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="72" y="166.67" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="172" y="166.67" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">初始选择</text><text x="382" y="166.67" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">过滤一之后</text><text x="642" y="166.67" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">过滤二之后</text><rect x="60" y="180" width="830" height="43" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="209.67" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="172" y="209.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="382" y="209.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="642" y="209.67" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><line x1="60" y1="223" x2="890" y2="223" stroke="#dce3ea" stroke-width="1.85" /><text x="72" y="252.67" font-