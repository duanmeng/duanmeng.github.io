<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="548" viewBox="0 0 1280 548" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">专门化循环：把条件移到循环外</title><desc id="desc">kHasNulls = false，kAllRowsActive = true：消除行号间接访问与 null 判断。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="548" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">专门化循环：把条件移到循环外</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">kHasNulls = false，kAllRowsActive = true：消除行号间接访问与 null 判断。</text><line x1="48" y1="111.8679" x2="1232" y2="111.8679" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="135" width="1160" height="180.0085" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="135" x2="1220.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="168" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">循环入口与条件</text><text x="78" y="202" font-size="21" fill="#1f2d3d" text-anchor="start">row = i，访问连续的 input[i]</text><text x="78" y="231" font-size="21" fill="#1f2d3d" text-anchor="start">编译期布尔参数允许删去不需要的分支</text><text x="78" y="260" font-size="21" fill="#1f2d3d" text-anchor="start">循环展开、SIMD 与数学语义是不同问题</text><text x="78" y="289" font-size="21" fill="#1f2d3d" text-anchor="start">原截图 vsqrtsd 仍是单个 double 的平方根。</text><rect x="60" y="336" width="545" height="116" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="78" y="369" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">编译器能做什么</text><text x="78" y="403" font-size="17" fill="#657386" text-anchor="start">内联、常量传播、循环展开、满足条件时自动向量化</text><rect x="675" y="336" width="545" height="116" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="693" y="369" font-size="22" fill="#877951" text-anchor="start" font-weight="600">必须单独验证</text><text x="693" y="403" font-size="17" fill="#657386" text-anchor="start">packed 指令、负数 / NaN、errno、别名与数据依赖</text><line x1="48" y1="487" x2="1232" y2="487" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="514" font-size="18" fill="#657386" text-anchor="start">C++ 示例与验证结果见正文。不能把消除分支直接等同于执行了 SIMD 指令。</text></svg>