<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">通用循环：行号映射与 null 分支</title><desc id="desc">保留原例的稀疏访问条件，逐行定位后再计算平方根。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="730" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">通用循环：行号映射与 null 分支</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">保留原例的稀疏访问条件，逐行定位后再计算平方根。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="1160" height="215" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#877951" text-anchor="start" font-weight="600">循环入口与条件</text><text x="78" y="227" font-size="21" fill="#657386" text-anchor="start">p = [0, 2, 5, 6, 7]</text><text x="78" y="256" font-size="21" fill="#657386" text-anchor="start">row = p[i] → 读取 null 标志</text><text x="78" y="285" font-size="21" fill="#657386" text-anchor="start">仅非空行执行 sqrt(input[row])</text><text x="78" y="314" font-size="21" fill="#657386" text-anchor="start">此例 null 标志为 1 = NULL，区别于 Velox 位图。</text><rect x="60" y="450" width="545" height="116" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="483" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">编译器能做什么</text><text x="78" y="517" font-size="17" fill="#657386" text-anchor="start">内联、常量传播、循环展开、满足条件时自动向量化</text><rect x="675" y="450" width="545" height="116" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="693" y="483" font-size="22" fill="#877951" text-anchor="start" font-weight="600">必须单独验证</text><text x="693" y="517" font-size="17" fill="#657386" text-anchor="start">packed 指令、负数 / NaN、errno、别名与数据依赖</text><line x1="48" y1="669" x2="1232" y2="669" stroke="#dce3ea" stroke-width="1" /><text x="48" y="696" font-size="18" fill="#657386" text-anchor="start">C++ 示例与验证结果见正文。不能把消除分支直接等同于执行了 SIMD 指令。</text></svg>