<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="627" viewBox="0 0 1280 627" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">四个量：used、reserved、capacity、maxCapacity</title><desc id="desc">图示取稳定时刻的常见关系；capacity 是配额，不等于已经触碰的物理页或进程 RSS。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="627" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">四个量：used、reserved、capacity、maxCapacity</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">图示取稳定时刻的常见关系；capacity 是配额，不等于已经触碰的物理页或进程 RSS。</text><line x1="48" y1="107.5816" x2="1232" y2="107.5816" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="310" height="125" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="215.0" y="181" font-size="19" fill="#326cae" text-anchor="middle" font-weight="600">used bytes</text><text x="215.0" y="225" font-size="18" fill="#1f2d3d" text-anchor="middle">已使用</text><rect x="370" y="137" width="200" height="125" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="470.0" y="181" font-size="19" fill="#65537f" text-anchor="middle" font-weight="600">reservation slack</text><text x="470.0" y="225" font-size="18" fill="#1f2d3d" text-anchor="middle">已预留未使用</text><rect x="570" y="137" width="300" height="125" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="720.0" y="181" font-size="19" fill="#2e7963" text-anchor="middle" font-weight="600">free capacity</text><text x="720.0" y="225" font-size="18" fill="#1f2d3d" text-anchor="middle">root 已有配额</text><rect x="870" y="137" width="350" height="125" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="1045.0" y="181" font-size="19" fill="#877951" text-anchor="middle" font-weight="600">未获配额的区间</text><text x="1045.0" y="225" font-size="18" fill="#1f2d3d" text-anchor="middle">直到 maxCapacity</text><line x1="370" y1="267" x2="370" y2="313" stroke="#657386" stroke-width="1.85" /><text x="370" y="337" font-size="20" fill="#1f2d3d" text-anchor="middle">usedBytes</text><line x1="570" y1="267" x2="570" y2="358" stroke="#657386" stroke-width="1.85" /><text x="570" y="382" font-size="20" fill="#1f2d3d" text-anchor="middle">reservedBytes</text><line x1="870" y1="267" x2="870" y2="403" stroke="#657386" stroke-width="1.85" /><text x="870" y="427" font-size="20" fill="#1f2d3d" text-anchor="middle">capacity</text><line x1="1220" y1="267" x2="1220" y2="448" stroke="#657386" stroke-width="1.85" /><text x="1220" y="472" font-size="20" fill="#1f2d3d" text-anchor="middle">maxCapacity</text><line x1="48" y1="538" x2="1232" y2="538" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="565" font-size="18" fill="#657386" text-anchor="start">用完本地 reservation 不必立即做跨查询仲裁；先尝试 root 的空闲 capacity 和配置允许的增长。</text><text x="48" y="593" font-size="18" fill="#657386" text-anchor="start">不同 API 中的 used / reservation 字段语境不同，读统计时应同时确认 pool 层级。</text></svg>