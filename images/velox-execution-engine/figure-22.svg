 x="368" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">N · Driver 1</text><text x="368" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">Operator leaf pool</text><rect x="640" y="553" width="260" height="90" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="658" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">M · Driver 0</text><text x="658" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">Operator leaf pool</text><rect x="930" y="553" width="260" height="90" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="948" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">K · Driver 0</text><text x="948" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">Operator leaf pool</text><polyline points="170,517 170,551" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="280,517 280,535.3889 480,535.3889 480,551" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="535,517 535,528 770,528 770,551" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="995,517 1060,517 1060,551" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><line x1="48" y1="692" x2="1232" y2="692" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="719" font-size="18" fill="#657386" text-anchor="start">HashJoin 有按 split group 的专用 node pool；Connector 和自定义 memory resource 可扩展这棵默认树。</text></svg>