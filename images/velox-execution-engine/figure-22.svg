<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">默认 MemoryPool 树：Query → Task → PlanNode → Operator</title><desc id="desc">Pipeline ID / Driver ID 编入 operator pool 名字，不代表有独立的 PipelinePool / DriverPool 层。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="880" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">默认 MemoryPool 树：Query → Task → PlanNode → Operator</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">Pipeline ID / Driver ID 编入 operator pool 名字，不代表有独立的 PipelinePool / DriverPool 层。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="435" y="150" width="410" height="100" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="453" y="183" font-size="22" fill="#877951" text-anchor="start" font-weight="600">Query root pool</text><text x="453" y="217" font-size="20" fill="#657386" text-anchor="start">QueryCtx::pool()</text><rect x="105" y="335" width="470" height="100" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="123" y="368" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Task A aggregate pool</text><text x="123" y="402" font-size="20" fill="#657386" text-anchor="start">Task::initTaskPool()</text><rect x="710" y="335" width="470" height="100" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="728" y="368" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Task B aggregate pool</text><text x="728" y="402" font-size="20" fill="#657386" text-anchor="start">另一个本地 Task</text><polyline points="5