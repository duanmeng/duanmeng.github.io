<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="663" viewBox="0 0 1280 663" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">RowNumber：恢复 partition counter，再继续输入</title><desc id="desc">这里是按 partition keys 计数的 RowNumber 算子，不是 RowContainer，也不是通用排序窗口。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="663" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">RowNumber：恢复 partition counter，再继续输入</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">这里是按 partition keys 计数的 RowNumber 算子，不是 RowContainer，也不是通用排序窗口。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="137" x2="600.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">未 spill：边输入边输出</text><text x="78" y="204" font-size="17" fill="#657386" text-anchor="start">HashTable：partition keys → BIGINT counter</text><text x="78" y="233" font-size="17" fill="#657386" text-anchor="start">新分组计数初始化为 0；每行递增后输出 row number</text><text x="78" y="262" font-size="17" fill="#657386" text-anchor="start">没有 partition keys 时可以使用单个计数器。</text><rect x="680" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="170" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">发生 spill 后的两类数据</text><text x="698" y="204" font-size="18" fill="#1f2d3d" text-anchor="start">A：已有 keys + counters，代表处理进度</text><text x="698" y="233" font-size="18" fill="#1f2d3d" text-anchor="start">B：后续未处理的输入 RowVectors</text><text x="698" y="262" font-size="18" fill="#1f2d3d" text-anchor="start">按相同 hash partition 写出，无需先排序。</text><polyline points="600,212 678,212" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="321" width="540" height="143.9412" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="321" x2="600.0" y2="321" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="354" font-size="22" fill="#877951" text-anchor="start" font-weight="600">恢复当前分区的状态文件 A</text><text x="78" y="388" font-size="18" fill="#1f2d3d" text-anchor="start">createUnorderedReader()</text><text x="78" y="417" font-size="18" fill="#1f2d3d" text-anchor="start">重建 HashTable，恢复已记录的 counters</text><text x="78" y="446" font-size="18" fill="#1f2d3d" text-anchor="start">不是把已输出过的结果再输出一次。</text><rect x="680" y="321" width="540" height="143.9412" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="321" x2="1220.0" y2="321" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="354" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">重放同分区的输入文件 B</text><text x="698" y="388" font-size="18" fill="#1f2d3d" text-anchor="start">createUnorderedReader() → addInput()</text><text x="698" y="417" font-size="18" fill="#1f2d3d" text-anchor="start">probe 分组，更新 counter，产生新的输出</text><text x="698" y="446" font-size="18" fill="#1f2d3d" text-anchor="start">完成当前分区，再恢复下一分区。</text><polyline points="950,287 950,303.8062 325,303.8062 325,319" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="600,401 678,401" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="490" width="1160" height="85.4333" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="78" y="523" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">内存仍不足：可递归 repartition / spill，直到配置的层数和资源限制。</text><text x="78" y="557" font-size="18" fill="#1f2d3d" text-anchor="start">带 ORDER BY 的窗口语义由相应计划 / 算子承担，不能把 unordered restore 推广到所有窗口计算。</text><line x1="48" y1="602" x2="1232" y2="602" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="629" font-size="18" fill="#657386" text-anchor="start">有序归并与无序恢复由算子状态决定：Aggregation 需要合并中间态；RowNumber 需要延续计数进度。</text></svg>