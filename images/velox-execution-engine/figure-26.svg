<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Page SizeClass 与 150-page 请求</title><desc id="desc">示例 minSizeClass = 4 pages，page = 4 KiB；实际 SizeMix 按当前 allocationSize() 选择。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="900" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Page SizeClass 与 150-page 请求</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">示例 minSizeClass = 4 pages，page = 4 KiB；实际 SizeMix 按当前 allocationSize() 选择。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><text x="118" y="171" font-size="17" fill="#657386" text-anchor="middle">1 pages</text><rect x="75" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="75" y="200" width="86" height="25" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="247" y="171" font-size="17" fill="#657386" text-anchor="middle">2 pages</text><rect x="204" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="204" y="200" width="86" height="50" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="376" y="171" font-size="17" fill="#657386" text-anchor="middle">4 pages</text><rect x="333" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="333" y="200" width="86" height="120" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="505" y="171" font-size="17" fill="#657386" text-anchor="middle">8 pages</text><rect x="462" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="462" y="200" width="86" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="634" y="171" font-size="17" fill="#657386" text-anchor="middle">16 pages</text><rect x="591" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="591" y="200" width="86" height="160" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="763" y="171" font-size="17" fill="#657386" text-anchor="middle">32 pages</text><rect x="720" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="720" y="200" width="86" height="50" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="892" y="171" font-size="17" fill="#657386" text-anchor="middle">64 pages</text><rect x="849" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="849" y="200" width="86" height="100" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="1021" y="171" font-size="17" fill="#657386" text-anchor="middle">128 pages</text><rect x="978" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="978" y="200" width="86" height="210" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="1150" y="171" font-size="17" fill="#657386" text-anchor="middle">256 pages</text><rect x="1107" y="200" width="86" height="250" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><rect x="1107" y="200" width="86" height="75" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="60" y="510" font-size="21" fill="#1f2d3d" text-anchor="start">每个 SizeClass 预留虚拟地址范围；全局仍限制 allocated / mapped pages。</text><rect x="60" y="570" width="540" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="603" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">当前代码得到的组合</text><text x="78" y="637" font-size="18" fill="#657386" text-anchor="start">128 × 1 + 16 × 1 + 4 × 2 = 152 pages</text><text x="78" y="666" font-size="18" fill="#657386" text-anchor="start">比请求多 2 pages；共 608 KiB</text><text x="78" y="695" font-size="18" fill="#657386" text-anchor="start">SizeMix 转成若干 Allocation::PageRun。</text><rect x="680" y="570" width="540" height="150" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="698" y="603" font-size="22" fill="#877951" text-anchor="start" font-weight="600">原图的分解也要算对</text><text x="698" y="637" font-size="18" fill="#657386" text-anchor="start">64 × 2 + 16 × 1 + 4 × 2 同样等于 152</text><text x="698" y="666" font-size="18" fill="#657386" text-anchor="start">原图标为 150 是算术错误。</text><text x="698" y="695" font-size="18" fill="#657386" text-anchor="start">不保证每次都采用原图的 64-page 分解。</text><line x1="48" y1="839" x2="1232" y2="839" stroke="#dce3ea" stroke-width="1" /><text x="48" y="866" font-size="18" fill="#657386" text-anchor="start">SizeClass 是按页组织的分配机制，不等同于 MemoryPool 的 MiB reservation 量化。</text></svg>