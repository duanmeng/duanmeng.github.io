" /><text x="812" y="272.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="927" y="272.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><line x1="800" y1="285" x2="1100" y2="285" stroke="#dce3ea" stroke-width="1" /><rect x="800" y="285" width="300" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="812" y="312.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><text x="927" y="312.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><line x1="800" y1="325" x2="1100" y2="325" stroke="#dce3ea" stroke-width="1" /><text x="812" y="352.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="927" y="352.6" font-size="18" fill="#1f2d3d" text-anchor="start">5</text><line x1="800" y1="365" x2="1100" y2="365" stroke="#dce3ea" stroke-width="1" /><rect x="800" y="365" width="300" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="812" y="392.6" font-size="18" fill="#1f2d3d" text-anchor="start">4</text><text x="927" y="392.6" font-size="18" fill="#1f2d3d" text-anchor="start">8</text><line x1="800" y1="405" x2="1100" y2="405" stroke="#dce3ea" stroke-width="1" /><text x="812" y="432.6" font-size="18" fill="#1f2d3d" text-anchor="start">5</text><text x="927" y="432.6" font-size="18" fill="#1f2d3d" text-anchor="start">10</text><line x1="800" y1="445" x2="1100" y2="445" stroke="#dce3ea" stroke-width="1" /><rect x="800" y="445" width="300" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="812" y="472.6" font-size="18" fill="#1f2d3d" text-anchor="start">6</text><text x="927" y="472.6" font-size="18" fill="#1f2d3d" text-anchor="start">12</text><line x1="800" y1="485" x2="1100" y2="485" stroke="#dce3ea" stroke-width="1" /><text x="812" y="512.6" font-size="18" fill="#1f2d3d" text-anchor="start">7</text><text x="927" y="512.6" font-size="18" fill="#1f2d3d" text-anchor="start">-1</text><line x1="800" y1="525" x2="1100" y2="525" stroke="#dce3ea" stroke-width="1" /><rect x="800" y="525" width="300" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="812" y="552.6" font-size="18" fill="#1f2d3d" text-anchor="start">8</text><text x="927" y="552.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><line x1="800" y1="565" x2="1100" y2="565" stroke="#dce3ea" stroke-width="1" /><text x="812" y="592.6" font-size="18" fill="#1f2d3d" text-anchor="start">9</text><text x="927" y="592.6" font-size="18" fill="#1f2d3d" text-anchor="start">123</text><line x1="800" y1="605" x2="1100" y2="605" stroke="#dce3ea" stroke-width="1" /><rect x="800" y="605" width="300" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="812" y="632.6" font-size="18" fill="#1f2d3d" text-anchor="start">10</text><text x="927" y="632.6" font-size="18" fill="#1f2d3d" text-anchor="start">9</text><line x1="800" y1="645" x2="1100" y2="645" stroke="#dce3ea" stroke-width="1" /><polyline points="570,331 690,331 690,425 795,425" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="590" y="300" font-size="17" fill="#657386" text-anchor="start">row 2 → [5, 9)</text><rect x="60" y="460" width="630" height="155" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="493" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">ARRAY(INTEGER())</text><text x="78" y="527" font-size="18" fill="#657386" text-anchor="start">父向量的 null buffer 描述整个数组是否为 NULL。</text><text x="78" y="556" font-size="18" fill="#657386" text-anchor="start">元素自身是否为 NULL，由 elements 的 null buffer 描述。</text><text x="78" y="585" font-size="18" fill="#657386" text-anchor="start">offsets 不要求单调；空数组和 NULL 数组是两种状态。</text><line x1="48" y1="749" x2="1232" y2="749" stroke="#dce3ea" stroke-width="1" /><text x="48" y="776" font-size="18" fill="#657386" text-anchor="start">四个数组共引用 11 个元素；ArrayVector 不要求 elements 一定是 FlatVector。</text></svg>