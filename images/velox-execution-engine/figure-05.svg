<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">ArrayVector：行范围引用共享 elements</title><desc id="desc">offsets[row] 与 sizes[row] 定位 elements 中的片段，child vector 可以继续使用编码。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="810" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">ArrayVector：行范围引用共享 elements</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">offsets[row] 与 sizes[row] 定位 elements 中的片段，child vector 可以继续使用编码。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="165" width="510" height="48" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="72" y="198.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="147" y="198.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">逻辑数组</text><text x="402" y="198.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">offset</text><text x="497" y="198.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">size</text><rect x="60" y="213" width="510" height="48" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="246.12" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="147" y="246.12" font-size="18" fill="#1f2d3d" text-anchor="start">[1, 2, 3]</text><text x="402" y="246.12" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="497" y="246.12" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><line x1="60" y1="261" x2="570" y2="261" stroke="#dce3ea" stroke-width="1" /><tex