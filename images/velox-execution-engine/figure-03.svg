<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">可组合的数据系统：接口连接组件</title><desc id="desc">以下是架构角色与示例，连接是否可用取决于宿主适配。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="900" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">可组合的数据系统：接口连接组件</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">以下是架构角色与示例，连接是否可用取决于宿主适配。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="65" y="155" width="550" height="145" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="83" y="188" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">语言前端</text><text x="83" y="222" font-size="18" fill="#657386" text-anchor="start">SQL：ZetaSQL / PostgreSQL / UPM / CRUX</text><text x="83" y="251" font-size="18" fill="#657386" text-anchor="start">非 SQL：Ibis / Pandas / UPM / CRUX</text><rect x="675" y="155" width="540" height="145" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="693" y="188" font-size="22" fill="#877951" text-anchor="start" font-weight="600">计划表示</text><text x="693" y="222" font-size="18" fill="#657386" text-anchor="start">Substrait 等跨系统 IR</text><text x="693" y="251" font-size="18" fill="#657386" text-anchor="start">Velox 本地计划：core::PlanNode / PlanFragment</text><polyline points="615,226 673,226" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="65" y="365" width="550" height="120" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="83" y="398" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">查询优化器</text><text x="83" y="432" font-size="20" fill="#657386" text-anchor="start">例如 Apache Calcite、ORCA</text><rect x="675" y="365" width="540" height="120" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="693" y="398" font-size="22" fill="#877951" text-anchor="start" font-weight="600">计划转换与绑定</text><text x="693" y="432" font-size="20" fill="#657386" text-anchor="start">类型、函数方言、Connector 与执行选项</text><polyline points="945,300 945,333 340,333 340,363" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="615,425 673,425" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="65" y="560" width="550" height="140" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="83" y="593" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Velox 库</text><text x="83" y="627" font-size="17" fill="#657386" text-anchor="start">在本机执行计划；允许单独使用 Vector、Expr 等组件</text><rect x="675" y="560" width="540" height="140" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="693" y="593" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Execution Runtime</text><text x="693" y="627" font-size="17" fill="#657386" text-anchor="start">Spark / MapReduce / Ray / Serverless 等宿主模式</text><text x="693" y="656" font-size="17" fill="#657386" text-anchor="start">分布式任务调度和运行环境由集成方负责</text><polyline points="945,485 945,528 340,528 340,558" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="615,630 673,630" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="839" x2="1232" y2="839" stroke="#dce3ea" stroke-width="1" /><text x="48" y="866" font-size="18" fill="#657386" text-anchor="start">共享执行机制，同时显式保留函数语义、类型规则、生命周期和分布式调度的边界。</text></svg>