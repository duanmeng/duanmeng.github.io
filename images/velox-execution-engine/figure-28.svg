<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="684" viewBox="0 0 1280 684" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">HashAggregation：分区 spill 与有序归并恢复</title><desc id="desc">输入阶段保存 group keys 与聚合中间态，按 grouping keys 排序形成 runs。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="684" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">HashAggregation：分区 spill 与有序归并恢复</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">输入阶段保存 group keys 与聚合中间态，按 grouping keys 排序形成 runs。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="540" height="140" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="137" x2="600.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">输入阶段</text><text x="78" y="204" font-size="17" fill="#657386" text-anchor="start">RowVector → HashTable::groupProbe</text><text x="78" y="233" font-size="17" fill="#657386" text-anchor="start">RowContainer：group keys + accumulator</text><text x="78" y="262" font-size="17" fill="#657386" text-anchor="start">例如 avg 的中间态需要 sum / count，而非仅最终平均值。</text><rect x="680" y="137" width="540" height="140" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="170" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Spill 阶段</text><text x="698" y="204" font-size="17" fill="#657386" text-anchor="start">按 hash bits 分区，分区内部排序写出</text><text x="698" y="233" font-size="17" fill="#657386" text-anchor="start">同一分区可以有多个有序 spill files / runs</text><text x="698" y="262" font-size="17" fill="#657386" text-anchor="start">并行分区写出时冻结 HashStringAllocator 的修改。</text><polyline points="600,207 678,207" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="680" y="313" width="540" height="135" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="313" x2="1220.0" y2="313" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="346" font-size="22" fill="#877951" text-anchor="start" font-weight="600">磁盘分区</text><text x="698" y="380" font-size="19" fill="#1f2d3d" text-anchor="start">P0：run 0、run 1、…</text><text x="698" y="409" font-size="19" fill="#1f2d3d" text-anchor="start">P1：run 0、run 1、…；P2、P3 同理</text><polyline points="950,277 950,311" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="313" width="540" height="135" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="313" x2="600.0" y2="313" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="346" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">输入结束（已发生 spill）</text><text x="78" y="380" font-size="18" fill="#1f2d3d" text-anchor="start">冲出剩余状态，完成所有输入 runs</text><text x="78" y="409" font-size="18" fill="#1f2d3d" text-anchor="start">未 spill 查询走普通输出，不进入本图恢复支路</text><rect x="60" y="482" width="1160" height="119.2453" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="482" x2="1220.0" y2="482" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="515" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">恢复一个分区 → createOrderedReader → 多路归并 → 合并同 key 的中间态 → 输出</text><text x="78" y="549" font-size="18" fill="#1f2d3d" text-anchor="start">用合并状态和受控批次逐步输出，再进入下一分区；不是一次重建所有分区的大 HashTable。</text><text x="78" y="578" font-size="18" fill="#1f2d3d" text-anchor="start">GroupingSet 还有输出阶段 spill 和 distinct 专用分支，不能把这张典型路径当作全部分支。</text><polyline points="950,448 950,480" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="325,448 325,480" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><line x1="48" y1="623" x2="1232" y2="623" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="650" font-size="18" fill="#657386" text-anchor="start">排序服务于同 key 状态的归并，不保证 GROUP BY 的 SQL 结果天然有序。</text></svg>