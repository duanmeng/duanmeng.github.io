"60" y="561.88" width="1160" height="48" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="595" font-size="18" fill="#1f2d3d" text-anchor="start">8</text><text x="157" y="595" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="332" y="595" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><text x="572" y="595" font-size="18" fill="#1f2d3d" text-anchor="start">NULL</text><text x="862" y="595" font-size="18" fill="#1f2d3d" text-anchor="start">triangle</text><line x1="60" y1="609.88" x2="1220" y2="609.88" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="644.88" width="1160" height="75" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="78" y="677.88" font-size="22" fill="#877951" text-anchor="start" font-weight="600">第 2 行整体为 NULL；第 4、7、8 行是非空 ROW，内部某个字段为 NULL。</text><line x1="48" y1="728.88" x2="1232" y2="728.88" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="755.88" font-size="18" fill="#657386" text-anchor="start">Operator 之间通常传递 RowVectorPtr；每列仍是独立 Vector，并不变成逐行连续存储。</text></svg>