<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">RowVector：列式 children 组合一批关系行</title><desc id="desc">ROW(INTEGER(), VARCHAR(), VARCHAR())；父行 null 与子字段 null 互相独立。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="820" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">RowVector：列式 children 组合一批关系行</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">ROW(INTEGER(), VARCHAR(), VARCHAR())；父行 null 与子字段 null 互相独立。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="1160" height="48" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="72" y="193.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="157" y="193.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">父 null bit</text><text x="332" y="193.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">children[0]</text><text x="572" y="193.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">children[1]</text><text x="862" y="193.12" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">children[2]</text><rect x="60" y="208" width="1160" height="48" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="72" y="241.12" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="157" y="241.12" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="332" y="241.12" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="572" y="241.12" font-size="18" fill="#1f