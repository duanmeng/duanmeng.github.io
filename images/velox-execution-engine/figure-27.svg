<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">MmapAllocator：free 与归还物理页不是同一步</title><desc id="desc">保留映射可加速复用；madvise(MADV_DONTNEED) 用于释放不再需要的物理页。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="780" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">MmapAllocator：free 与归还物理页不是同一步</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">保留映射可加速复用；madvise(MADV_DONTNEED) 用于释放不再需要的物理页。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="410" y="160" width="460" height="115" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="428" y="193" font-size="22" fill="#877951" text-anchor="start" font-weight="600">已预留虚拟地址，未保留物理页</text><text x="428" y="227" font-size="18" fill="#657386" text-anchor="start">尚未使用 / 已 advise 的页面</text><rect x="60" y="440" width="480" height="130" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="473" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Allocated + Mapped</text><text x="78" y="507" font-size="18" fill="#657386" text-anchor="start">调用者正在使用</text><text x="78" y="536" font-size="18" fill="#657386" text-anchor="start">pageAllocated 与 pageMapped 都跟踪</text><rect x="740" y="440" width="480" height="130" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="758" y="473" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Free + Mapped</text><text x="758" y="507" font-size="18" fill="#657386" text-anchor="start">调用者已释放，可以直接复用</text><text x="758" y="536" font-size="18" fill="#657386" text-anchor="start">仍占 allocator 的 mapped-page 预算</text><polyline points="470,275 305,438" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="225" y="352" font-size="17" fill="#657386" text-anchor="start">allocate / 触碰页面</text><polyline points="540,485 738,485" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="615" y="459" font-size="17" fill="#657386" text-anchor="start">free</text><polyline points="740,545 542,545" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="613" y="602" font-size="17" fill="#657386" text-anchor="start">复用</text><polyline points="980,440 820,275" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="995" y="350" font-size="17" fill="#657386" text-anchor="start">madvise</text><line x1="48" y1="691" x2="1232" y2="691" stroke="#dce3ea" stroke-width="1" /><text x="48" y="718" font-size="18" fill="#657386" text-anchor="start">匿名 mmap 主要预留地址，物理页通常按需建立；它不意味着所有相关元数据和内核开销都为零。</text><text x="48" y="746" font-size="18" fill="#657386" text-anchor="start">Allocator 的容量计数不是内核 RSS 的同义词；页大小与平台约束也必须满足。</text></svg>