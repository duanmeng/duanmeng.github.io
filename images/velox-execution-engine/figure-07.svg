<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">ConstantVector：标量与复杂值两条表示路径</title><desc id="desc">逻辑长度可以很大，物理上只保存一个值或一次底层引用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">ConstantVector：标量与复杂值两条表示路径</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">逻辑长度可以很大，物理上只保存一个值或一次底层引用。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="525" height="160" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">标量常量：DOUBLE()</text><text x="78" y="227" font-size="18" fill="#657386" text-anchor="start">value_ = 3.5；isNull_ = false</text><text x="78" y="256" font-size="18" fill="#657386" text-anchor="start">size = N，valueAt(i) 对各行返回同一个值</text><text x="78" y="285" font-size="18" fill="#657386" text-anchor="start">通常不需要保留一个底层 FlatVector。</text><rect x="665" y="160" width="555" height="160" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="683" y="193" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">复杂常量：ARRAY(INTEGER())</text><text x="683" y="227" font-size="18" fill="#657386" text-anchor="start">valueVector_ → ArrayVector</text><text x="683" y="256" font-size="18" fill="#657386" text-anchor="start">index_ = 2，size = N</text><text x="683" y="285" font-size="18" fill="#657386" text-anchor="start">逻辑值重复为 [10, 12, -1, 0]。</text><rect x="665" y="400" width="555" height="40" rx="3" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="677" y="427.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">base row</text><text x="767" y="427.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">数组</text><text x="1017" y="427.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">offset</text><text x="1117" y="427.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">size</text><rect x="665" y="440" width="555" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="677" y="467.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="767" y="467.6" font-size="18" fill="#1f2d3d" text-anchor="start">[1, 2, 3]</text><text x="1017" y="467.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="1117" y="467.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><line x1="665" y1="480" x2="1220" y2="480" stroke="#dce3ea" stroke-width="1" /><text x="677" y="507.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="767" y="507.6" font-size="18" fill="#1f2d3d" text-anchor="start">[5, 8]</text><text x="1017" y="507.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="1117" y="507.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><line x1="665" y1="520" x2="1220" y2="520" stroke="#dce3ea" stroke-width="1" /><rect x="665" y="520" width="555" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="677" y="547.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><text x="767" y="547.6" font-size="18" fill="#1f2d3d" text-anchor="start">[10, 12, -1, 0]</text><text x="1017" y="547.6" font-size="18" fill="#1f2d3d" text-anchor="start">5</text><text x="1117" y="547.6" font-size="18" fill="#1f2d3d" text-anchor="start">4</text><line x1="665" y1="560" x2="1220" y2="560" stroke="#dce3ea" stroke-width="1" /><text x="677" y="587.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="767" y="587.6" font-size="18" fill="#1f2d3d" text-anchor="start">[123, 9]</text><text x="1017" y="587.6" font-size="18" fill="#1f2d3d" text-anchor="start">9</text><text x="1117" y="587.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><line x1="665" y1="600" x2="1220" y2="600" stroke="#dce3ea" stroke-width="1" /><polyline points="940,320 940,378 710,378 710,397" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="705" y="356" font-size="17" fill="#657386" text-anchor="start">引用底层第 2 行</text><rect x="60" y="400" width="525" height="140" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="433" font-size="22" fill="#877951" text-anchor="start" font-weight="600">共同约束</text><text x="78" y="467" font-size="18" fill="#657386" text-anchor="start">Constant 仍携带完整 TypePtr 与逻辑行数。</text><text x="78" y="496" font-size="18" fill="#657386" text-anchor="start">复杂值的 child vector 和缓冲区必须存活。</text><line x1="48" y1="699" x2="1232" y2="699" stroke="#dce3ea" stroke-width="1" /><text x="48" y="726" font-size="18" fill="#657386" text-anchor="start">“只包含一个 index 和一个指针”只覆盖了复杂常量 / 包装路径，不能概括所有 ConstantVector。</text></svg>