<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="668.6" viewBox="0 0 1280 668.6" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">ConstantVector：标量与复杂值两条表示路径</title><desc id="desc">逻辑长度可以很大，物理上只保存一个值或一次底层引用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="668.6" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">ConstantVector：标量与复杂值两条表示路径</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">逻辑长度可以很大，物理上只保存一个值或一次底层引用。</text><line x1="48" y1="111.8679" x2="1232" y2="111.8679" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="135" width="525" height="160" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="135" x2="585.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="168" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">标量常量：DOUBLE()</text><text x="78" y="202" font-size="18" fill="#1f2d3d" text-anchor="start">value_ = 3.5；isNull_ = false</text><text x="78" y="231" font-size="18" fill="#1f2d3d" text-anchor="start">size = N，valueAt(i) 对各行返回同一个值</text><text x="78" y="260" font-size="18" fill="#1f2d3d" text-anchor="start">通常不需要保留一个底层 FlatVector。</text><rect x="665" y="135" width="555" height="160" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="665" y1="135" x2="1220.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="683" y="168" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">复杂常量：ARRAY(INTEGER())</text><text x="683" y="202" font-size="18" fill="#1f2d3d" text-anchor="start">valueVector_ → ArrayVector</text><text x="683" y="231" font-size="18" fill="#1f2d3d" text-anchor="start">index_ = 2，size = N</text><text x="683" y="260" font-size="18" fill="#1f2d3d" text-anchor="start">逻辑值重复为 [10, 12, -1, 0]。</text><rect x="665" y="375" width="555" height="40" rx="3" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="677" y="402.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">base row</text><text x="767" y="402.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">数组</text><text x="1017" y="402.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">offset</text><text x="1117" y="402.6" font-size="18" fill="#2e7963" text-anchor="start" font-weight="600">size</text><rect x="665" y="415" width="555" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="677" y="442.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="767" y="442.6" font-size="18" fill="#1f2d3d" text-anchor="start">[1, 2, 3]</text><text x="1017" y="442.6" font-size="18" fill="#1f2d3d" text-anchor="start">0</text><text x="1117" y="442.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><line x1="665" y1="455" x2="1220" y2="455" stroke="#dce3ea" stroke-width="1.85" /><text x="677" y="482.6" font-size="18" fill="#1f2d3d" text-anchor="start">1</text><text x="767" y="482.6" font-size="18" fill="#1f2d3d" text-anchor="start">[5, 8]</text><text x="1017" y="482.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="1117" y="482.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><line x1="665" y1="495" x2="1220" y2="495" stroke="#dce3ea" stroke-width="1.85" /><rect x="665" y="495" width="555" height="40" rx="0" fill="#fafbfc" stroke="none" stroke-width="1" /><text x="677" y="522.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><text x="767" y="522.6" font-size="18" fill="#1f2d3d" text-anchor="start">[10, 12, -1, 0]</text><text x="1017" y="522.6" font-size="18" fill="#1f2d3d" text-anchor="start">5</text><text x="1117" y="522.6" font-size="18" fill="#1f2d3d" text-anchor="start">4</text><line x1="665" y1="535" x2="1220" y2="535" stroke="#dce3ea" stroke-width="1.85" /><text x="677" y="562.6" font-size="18" fill="#1f2d3d" text-anchor="start">3</text><text x="767" y="562.6" font-size="18" fill="#1f2d3d" text-anchor="start">[123, 9]</text><text x="1017" y="562.6" font-size="18" fill="#1f2d3d" text-anchor="start">9</text><text x="1117" y="562.6" font-size="18" fill="#1f2d3d" text-anchor="start">2</text><line x1="665" y1="575" x2="1220" y2="575" stroke="#dce3ea" stroke-width="1.85" /><polyline points="940,295 940,353 710,353 710,372" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><text x="705" y="331" font-size="17" fill="#657386" text-anchor="start">引用底层第 2 行</text><rect x="60" y="375" width="525" height="140" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="375" x2="585.0" y2="375" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="408" font-size="22" fill="#877951" text-anchor="start" font-weight="600">共同约束</text><text x="78" y="442" font-size="18" fill="#1f2d3d" text-anchor="start">Constant 仍携带完整 TypePtr 与逻辑行数。</text><text x="78" y="471" font-size="18" fill="#1f2d3d" text-anchor="start">复杂值的 child vector 和缓冲区必须存活。</text><line x1="48" y1="607.6" x2="1232" y2="607.6" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="634.6" font-size="18" fill="#657386" text-anchor="start">“只包含一个 index 和一个指针”只覆盖了复杂常量 / 包装路径，不能概括所有 ConstantVector。</text></svg>