<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">一个 Task 如何组合执行与资源组件</title><desc id="desc">Driver 推进独立的 Operator 实例；共享对象通过 Task 与专用 bridge 管理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="910" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">一个 Task 如何组合执行与资源组件</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">Driver 推进独立的 Operator 实例；共享对象通过 Task 与专用 bridge 管理。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="345" height="160" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Source / Connector</text><text x="78" y="227" font-size="18" fill="#657386" text-anchor="start">TableScan / TableWrite</text><text x="78" y="256" font-size="18" fill="#657386" text-anchor="start">Hive 等 Connector</text><text x="78" y="285" font-size="18" fill="#657386" text-anchor="start">文件格式、I/O、数据源适配</text><rect x="465" y="160" width="355" height="360" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="483" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Drivers × 并行度</text><text x="483" y="227" font-size="17" fill="#657386" text-anchor="start">Operator 0：Scan</text><text x="483" y="256" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="285" font-size="17" fill="#657386" text-anchor="start">Operator 1：FilterProject</text><text x="483" y="314" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="343" font-size="17" fill="#657386" text-anchor="start">Operator 2：HashProbe / Aggregation</text><text x="483" y="372" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="401" font-size="17" fill="#657386" text-anchor="start">Sink：PartitionedOutput 等</text><polyline points="405,245 463,245" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="880" y="160" width="335" height="160" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="898" y="193" font-size="22" fill="#877951" text-anchor="start" font-weight="600">资源管理</text><text x="898" y="227" font-size="18" fill="#657386" text-anchor="start">MemoryPool 树</text><text x="898" y="256" font-size="18" fill="#657386" text-anchor="start">MemoryManager</text><text x="898" y="285" font-size="18" fill="#657386" text-anchor="start">MemoryArbitrator</text><rect x="60" y="380" width="345" height="140" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="413" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">计算组件</text><text x="78" y="447" font-size="18" fill="#657386" text-anchor="start">Expression Evaluation</text><text x="78" y="476" font-size="18" fill="#657386" text-anchor="start">HashTable / RowContainer</text><text x="78" y="505" font-size="18" fill="#657386" text-anchor="start">Spiller</text><polyline points="405,450 463,450" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="820,255 878,255" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="880" y="390" width="335" height="130" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="898" y="423" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">MemoryAllocator</text><text x="898" y="457" font-size="16" fill="#657386" text-anchor="start">MallocAllocator / MmapAllocator</text><text x="898" y="486" font-size="16" fill="#657386" text-anchor="start">分配路径按配置和大小选择</text><polyline points="1045,320 1045,388" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="60" y="615" width="760" height="122" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="648" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Task / QueryCtx</text><text x="78" y="682" font-size="17" fill="#657386" text-anchor="start">Task 管理本地 Drivers、完成状态、错误和取消；QueryCtx 保存查询级上下文。</text><rect x="880" y="615" width="335" height="122" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="898" y="648" font-size="22" fill="#877951" text-anchor="start" font-weight="600">可选 AsyncDataCache</text><text x="898" y="682" font-size="16" fill="#657386" text-anchor="start">参与缓存和内存让渡</text><text x="898" y="711" font-size="16" fill="#657386" text-anchor="start">不是每次分配都要驱逐缓存</text><polyline points="1045,520 1045,613" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="849" x2="1232" y2="849" stroke="#dce3ea" stroke-width="1" /><text x="48" y="876" font-size="18" fill="#657386" text-anchor="start">Task 不是整个分布式查询；线程池中的线程也不永久归属于某个 Driver。</text></svg>