<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="749" viewBox="0 0 1280 749" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">一个 Task 如何组合执行与资源组件</title><desc id="desc">Driver 推进独立的 Operator 实例；共享对象通过 Task 与专用 bridge 管理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="749" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">一个 Task 如何组合执行与资源组件</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">Driver 推进独立的 Operator 实例；共享对象通过 Task 与专用 bridge 管理。</text><line x1="48" y1="111.8679" x2="1232" y2="111.8679" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="135" width="345" height="160" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="135" x2="405.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="168" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Source / Connector</text><text x="78" y="202" font-size="18" fill="#1f2d3d" text-anchor="start">TableScan / TableWrite</text><text x="78" y="231" font-size="18" fill="#1f2d3d" text-anchor="start">Hive 等 Connector</text><text x="78" y="260" font-size="18" fill="#1f2d3d" text-anchor="start">文件格式、I/O、数据源适配</text><rect x="465" y="135" width="355" height="360" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="465" y1="135" x2="820.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="483" y="168" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Drivers × 并行度</text><text x="483" y="202" font-size="17" fill="#657386" text-anchor="start">Operator 0：Scan</text><text x="483" y="231" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="260" font-size="17" fill="#657386" text-anchor="start">Operator 1：FilterProject</text><text x="483" y="289" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="318" font-size="17" fill="#657386" text-anchor="start">Operator 2：HashProbe / Aggregation</text><text x="483" y="347" font-size="17" fill="#657386" text-anchor="start">↓ RowVectorPtr</text><text x="483" y="376" font-size="17" fill="#657386" text-anchor="start">Sink：PartitionedOutput 等</text><polyline points="405,220 463,220" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="880" y="135" width="335" height="160" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="880" y1="135" x2="1215.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="898" y="168" font-size="22" fill="#877951" text-anchor="start" font-weight="600">资源管理</text><text x="898" y="202" font-size="18" fill="#1f2d3d" text-anchor="start">MemoryPool 树</text><text x="898" y="231" font-size="18" fill="#1f2d3d" text-anchor="start">MemoryManager</text><text x="898" y="260" font-size="18" fill="#1f2d3d" text-anchor="start">MemoryArbitrator</text><rect x="60" y="355" width="345" height="140" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="355" x2="405.0" y2="355" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="388" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">计算组件</text><text x="78" y="422" font-size="18" fill="#1f2d3d" text-anchor="start">Expression Evaluation</text><text x="78" y="451" font-size="18" fill="#1f2d3d" text-anchor="start">HashTable / RowContainer</text><text x="78" y="480" font-size="18" fill="#1f2d3d" text-anchor="start">Spiller</text><polyline points="405,425 463,425" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="820,230 878,230" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="880" y="365" width="335" height="130" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="880" y1="365" x2="1215.0" y2="365" stroke="#dce3ea" stroke-width="1.85" /><text x="898" y="398" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">MemoryAllocator</text><text x="898" y="432" font-size="16" fill="#657386" text-anchor="start">MallocAllocator / MmapAllocator</text><text x="898" y="461" font-size="16" fill="#657386" text-anchor="start">分配路径按配置和大小选择</text><polyline points="1045,295 1045,363" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="531" width="760" height="122" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="78" y="564" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Task / QueryCtx</text><text x="78" y="598" font-size="17" fill="#657386" text-anchor="start">Task 管理本地 Drivers、完成状态、错误和取消；QueryCtx 保存查询级上下文。</text><rect x="880" y="531" width="335" height="122" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="880" y1="531" x2="1215.0" y2="531" stroke="#dce3ea" stroke-width="1.85" /><text x="898" y="564" font-size="22" fill="#877951" text-anchor="start" font-weight="600">可选 AsyncDataCache</text><text x="898" y="598" font-size="16" fill="#657386" text-anchor="start">参与缓存和内存让渡</text><text x="898" y="627" font-size="16" fill="#657386" text-anchor="start">不是每次分配都要驱逐缓存</text><polyline points="1045,495 1045,529" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><line x1="48" y1="688" x2="1232" y2="688" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="715" font-size="18" fill="#657386" text-anchor="start">Task 不是整个分布式查询；线程池中的线程也不永久归属于某个 Driver。</text></svg>