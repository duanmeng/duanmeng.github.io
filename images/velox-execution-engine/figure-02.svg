<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Velox 位于数据系统的执行层</title><desc id="desc">宿主系统把计划与资源交给 Velox；Velox 在本机推进计算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="850" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Velox 位于数据系统的执行层</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">宿主系统把计划与资源交给 Velox；Velox 在本机推进计算。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="150" width="1160" height="98" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="183" font-size="22" fill="#877951" text-anchor="start" font-weight="600">工作负载</text><text x="78" y="217" font-size="20" fill="#657386" text-anchor="start">事务 · 分析 · 流处理 · 图计算 · 监控 / 时间序列 · ML / 特征工程</text><rect x="60" y="282" width="1160" height="107" rx="5" fill="#fafbfc" stroke="#dce3ea" stroke-width="1" /><text x="78" y="315" font-size="22" fill="#657386" text-anchor="start" font-weight="600">语言 / IR / 优化器</text><text x="78" y="349" font-size="20" fill="#657386" text-anchor="start">SQL、DataFrame、DSL；逻辑优化、物理计划与全局代价决策</text><rect x="60" y="427" width="1160" height="107" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="460" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Velox 执行组件</text><text x="78" y="494" font-size="20" fill="#657386" text-anchor="start">Type / Vector → Expression / Function → Operator / Driver / Task</text><rect x="60" y="572" width="1160" height="107" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="78" y="605" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">宿主运行时与外部系统</text><text x="78" y="639" font-size="20" fill="#657386" text-anchor="start">分布式调度、任务放置、网络传输、存储服务；通过接口与 Velox 对接</text><polyline points="640,248 640,280" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="640,389 640,425" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="640,534 640,570" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="761" x2="1232" y2="761" stroke="#dce3ea" stroke-width="1" /><text x="48" y="788" font-size="18" fill="#657386" text-anchor="start">Velox 不提供 SQL 语言前端或全局查询优化器；本地自适应优化仍然发生在执行过程中。</text><text x="48" y="816" font-size="18" fill="#657386" text-anchor="start">事务、监控等是数据系统的工作负载分类，不意味着 Velox 提供完整事务数据库能力。</text></svg>