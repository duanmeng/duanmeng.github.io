<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="856" viewBox="0 0 1440 856" role="img"><title>Velox 位于数据系统的执行层</title><desc>宿主系统把计划与资源交给 Velox；Velox 在本机推进计算。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="873" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Velox 位于数据系统的执行层</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">宿主系统把计划与资源交给 Velox；Velox 在本机推进计算。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><line x1="48" y1="149" x2="1392" y2="149" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">工作负载</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">事务 · 分析 · 流处理 · 图计算 · 监控 / 时间序列 · ML / 特征工程</text><rect x="48" y="258.7143" width="1344" height="59.2857" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="66" y="294" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">语言 / IR / 优化器</text><text x="48" y="361" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">SQL、DataFrame、DSL；逻辑优化、物理计划与全局代价决策</text><polyline points="720,383.5294 720,398.5882" fill="none" stroke="#4078bd" stroke-width="1.85" marker-end="url(#a-blue)" /><rect x="48" y="401.8824" width="1344" height="217.2261" rx="5" fill="white" stroke="#39826d" stroke-width="1.55" /><text x="76" y="443" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#2e7963" font-weight="600" text-anchor="start">Velox 执行组件</text><text x="76" y="489" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Type / Vector → Expression / Function → Operator / Driver / Task</text><rect x="76" y="547" width="425" height="59" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="288.5" y="583.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="400" text-anchor="middle">Type / Vector</text><rect x="506" y="547" width="425" height="59" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="718.5" y="583.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="400" text-anchor="middle">Expression / Function</text><rect x="936" y="547" width="425" height="59" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="1148.5" y="583.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="400" text-anchor="middle">Operator / Driver / Task</text><line x1="48" y1="644" x2="1392" y2="644" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="673" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">宿主运行时与外部系统</text><text x="48" y="711" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">分布式调度、任务放置、网络传输、存储服务；通过接口与 Velox 对接</text><line x1="48" y1="753.1923" x2="1392" y2="753.1923" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="785" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Velox 不提供 SQL 语言前端或全局查询优化器；本地自适应优化仍然发生在执行过程中。</text><text x="48" y="819" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">事务、监控等是数据系统的工作负载分类，不意味着 Velox 提供完整事务数据库能力。</text></svg>