<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Driver：阻塞 future 如何让出并重新获得线程</title><desc id="desc">getOutput() 返回 nullptr 后，必须再次查询 isBlocked() 才能判断下一步。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="1180" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Driver：阻塞 future 如何让出并重新获得线程</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">getOutput() 返回 nullptr 后，必须再次查询 isBlocked() 才能判断下一步。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="34" y="150" width="232" height="55" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="150" y="186" font-size="19" fill="#1f2d3d" text-anchor="middle" font-weight="600">Executor / Driver</text><line x1="150" y1="205" x2="150" y2="1054" stroke="#657386" stroke-width="2.2" stroke-dasharray="7 6" /><rect x="349" y="150" width="232" height="55" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="465" y="186" font-size="19" fill="#1f2d3d" text-anchor="middle" font-weight="600">当前 Operator</text><line x1="465" y1="205" x2="465" y2="1054" stroke="#657386" stroke-width="2.2" stroke-dasharray="7 6" /><rect x="664" y="150" width="232" height="55" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="780" y="186" font-size="19" fill="#1f2d3d" text-anchor="middle" font-weight="600">下游 Operator</text><line x1="780" y1="205" x2="780" y2="1054" stroke="#657386" stroke-width="2.2" stroke-dasharray="7 6" /><rect x="984" y="150" width="232" height="55" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="1100" y="186" font-size="19" fill="#1f2d3d" text-anchor="middle" font-weight="600">I/O / Producer</text><line x1="1100" y1="205" x2="1100" y2="1054" stroke="#657386" stroke-width="2.2" stroke-dasharray="7 6" /><polyline points="150,267 465,267" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="255" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">isBlocked() → kNotBlocked</text><polyline points="150,333 780,333" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="321" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">isBlocked() / needsInput()</text><polyline points="150,400 465,400" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="388" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">getOutput() → nullptr</text><polyline points="150,467 465,467" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="455" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">再次 isBlocked(&amp;future)</text><rect x="200" y="505" width="820" height="90" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="218" y="538" font-size="22" fill="#877951" text-anchor="start" font-weight="600">分支 A：等待事件</text><text x="218" y="572" font-size="17" fill="#657386" text-anchor="start">Driver 保存 BlockingState；离开线程后安装 setResume continuation。</text><polyline points="1100,655 150,655" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="643" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">promise 完成 → continuation 清除 hasBlockingFuture</text><text x="178" y="697" font-size="18" fill="#657386" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Task 未暂停：enqueue(driver) → executor 排队 → 再次 run()</text><text x="178" y="731" font-size="18" fill="#657386" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Task 暂停：由 Task::resume 再入队；future 异常 → Task::setError</text><rect x="200" y="782" width="820" height="90" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="218" y="815" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">分支 B：未阻塞并且 isFinished() = true</text><text x="218" y="849" font-size="17" fill="#657386" text-anchor="start">Driver 才把结束通知传给下游；nullptr 本身不是结束标记。</text><polyline points="150,931 780,931" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="162" y="919" font-size="17" fill="#1f2d3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">nextOp-&gt;noMoreInput()</text><line x1="48" y1="1091" x2="1232" y2="1091" stroke="#dce3ea" stroke-width="1" /><text x="48" y="1118" font-size="18" fill="#657386" text-anchor="start">isBlocked() 本身不会把线程挂起；Driver 识别原因并执行 off-thread 流程。</text><text x="48" y="1146" font-size="18" fill="#657386" text-anchor="start">这是协作式调度：正在执行的长同步函数不会被 Driver 从任意指令处抢占。</text></svg>