<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">StringView：16 字节描述符与独立字符串缓冲区</title><desc id="desc">短串最多内联 12 字节；长串保存 4 字节前缀和完整字符串的指针。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="990" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">StringView：16 字节描述符与独立字符串缓冲区</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">短串最多内联 12 字节；长串保存 4 字节前缀和完整字符串的指针。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="155" width="195" height="57" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="157.5" y="191" font-size="21" fill="#877951" text-anchor="middle" font-weight="600">size_：4 B</text><rect x="255" y="155" width="280" height="57" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="395.0" y="191" font-size="21" fill="#65537f" text-anchor="middle" font-weight="600">prefix_：4 B</text><rect x="535" y="155" width="685" height="57" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="877.5" y="191" font-size="21" fill="#326cae" text-anchor="middle" font-weight="600">union：8 B</text><text x="62" y="254" font-size="20" fill="#1f2d3d" text-anchor="start">≤ 12 B：prefix_ + union 存放全部字符</text><text x="675" y="254" font-size="20" fill="#1f2d3d" text-anchor="start">&gt; 12 B：prefix_ + data 指针</text><rect x="60" y="300" width="1160" height="47" rx="3" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="72" y="332.43" font-size="18" fill="#326cae" text-anchor="start" font-weight="600">row</text><text x="132" y="332.43" font-size="18" fi