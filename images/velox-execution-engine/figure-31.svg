<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img"><title>从逻辑类型到 C++ 实现：类型不会因编码而消失</title><desc>TypePtr 描述值的语义与结构；TypeKind 支持分派；C++ 类型承载具体实现。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="770" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">从逻辑类型到 C++ 实现：类型不会因编码而消失</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">TypePtr 描述值的语义与结构；TypeKind 支持分派；C++ 类型承载具体实现。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><rect x="40" y="146" width="1200" height="121" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="179" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">计划 / 表达式 / Operator / Vector：携带完整 Velox Type</text><text x="56" y="211" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">BIGINT()、DATE()、DECIMAL(p,s)、ARRAY(T)、MAP(K,V)、ROW(names, children)</text><text x="56" y="242" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">Function 签名与 Vector::type() 保留语义；Vector encoding 另行描述 FLAT / DICTIONARY / CONSTANT。</text><rect x="40" y="425" width="574" height="155" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="56" y="458" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">物理实现与分派</text><text x="56" y="490" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">BIGINT 与其底层整数存储：int64_t</text><text x="56" y="522" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">DATE 的 TypeKind / 存储路径为 INTEGER</text><text x="56" y="554" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">不同语义可以复用相同的底层实现。</text><rect x="666" y="425" width="574" height="155" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="682" y="458" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">Traits 与 Reader / Writer</text><text x="682" y="490" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">TypeTraits&lt;KIND&gt;::NativeType</text><text x="682" y="522" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">UDF 参数：native 标量 / StringView / 复杂类型视图</text><text x="682" y="554" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2d3d" text-anchor="start">复杂类型不等于直接存一个 std::vector / std::map。</text><polyline points="328,305 328,425" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#arrow-purple)"/><polyline points="952,305 952,425" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="40" y="337" width="574" height="43" fill="white"/><rect x="666" y="337" width="574" height="43" fill="white"/><text x="40" y="366" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#326cae" text-anchor="start">Type 对象继续随 Vector / 表达式传递</text><text x="666" y="366" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2e7963" text-anchor="start">按 kind 选择底层访问与计算实现</text><line x1="40" y1="664" x2="1240" y2="664" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="693" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">逻辑和物理并非互斥的两套继承树：基础类型可同时承担语义类型与存储分类的角色。</text><text x="40" y="722" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">完整 Type 贯穿 I/O 到计算；底层以 C++ 模板和具体 buffer 布局实现访问与运算。</text></svg>