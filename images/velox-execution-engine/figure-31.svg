<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">从逻辑类型到 C++ 实现：类型不会因编码而消失</title><desc id="desc">TypePtr 描述值的语义与结构；TypeKind 支持分派；C++ 类型承载具体实现。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="850" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">从逻辑类型到 C++ 实现：类型不会因编码而消失</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">TypePtr 描述值的语义与结构；TypeKind 支持分派；C++ 类型承载具体实现。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="1160" height="145" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">计划 / 表达式 / Operator / Vector：携带完整 Velox Type</text><text x="78" y="227" font-size="19" fill="#657386" text-anchor="start">BIGINT()、DATE()、DECIMAL(p,s)、ARRAY(T)、MAP(K,V)、ROW(names, children)</text><text x="78" y="256" font-size="19" fill="#657386" text-anchor="start">Function 签名与 Vector::type() 保留语义；Vector encoding 另行描述 FLAT / DICTIONARY / CONSTANT。</text><rect x="60" y="405" width="540" height="145" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="438" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">物理实现与分派</text><text x="78" y="472" font-size="19" fill="#657386" text-anchor="start">BIGINT 与其底层整数存储：int64_t</text><text x="78" y="501" font-size="19" fill="#657386" text-anchor="start">DATE 的 TypeKind / 存储路径为 INTEGER</text><text x="78" y="530" font-size="19" fill="#657386" text-anchor="start">不同语义可以复用相同的底层实现。</text><rect x="680" y="405" width="540" height="145" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="698" y="438" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Traits 与 Reader / Writer</text><text x="698" y="472" font-size="18" fill="#657386" text-anchor="start">TypeTraits&lt;KIND&gt;::NativeType</text><text x="698" y="501" font-size="18" fill="#657386" text-anchor="start">UDF 参数：native 标量 / StringView / 复杂类型视图</text><text x="698" y="530" font-size="18" fill="#657386" text-anchor="start">复杂类型不等于直接存一个 std::vector / std::map。</text><polyline points="345,305 345,403" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="945,305 945,403" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="761" x2="1232" y2="761" stroke="#dce3ea" stroke-width="1" /><text x="48" y="788" font-size="18" fill="#657386" text-anchor="start">逻辑和物理并非互斥的两套继承树：基础类型可同时承担语义类型与存储分类的角色。</text><text x="48" y="816" font-size="18" fill="#657386" text-anchor="start">完整 Type 贯穿 I/O 到计算；底层以 C++ 模板和具体 buffer 布局实现访问与运算。</text></svg>