<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">计划树切成 Pipeline，再实例化多个 Driver</title><desc id="desc">示例：(S JOIN T) 的结果构建第二张表，再与 R 连接；箭头表示数据 / build 依赖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="960" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">计划树切成 Pipeline，再实例化多个 Driver</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">示例：(S JOIN T) 的结果构建第二张表，再与 R 连接；箭头表示数据 / build 依赖。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="170" width="1160" height="150" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="203" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Pipeline 0：Scan T → Filter → HashBuild(T)</text><text x="78" y="237" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="266" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><rect x="60" y="390" width="1160" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="423" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Pipeline 1：Scan S → Filter → HashProbe(T) → HashBuild(ST)</text><text x="78" y="457" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="486" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><rect x="60" y="610" width="1160" height="150" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="78" y="643" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Pipeline 2：Scan R → Filter → HashProbe(ST) → Sink</text><text x="78" y="677" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="706" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><polyline points="1080,320 1080,385" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="810" y="355" font-size="17" fill="#657386" text-anchor="start">T 表 ready / future</text><polyline points="1080,540 1080,605" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="800" y="575" font-size="17" fill="#657386" text-anchor="start">ST 表 ready / future</text><line x1="48" y1="871" x2="1232" y2="871" stroke="#dce3ea" stroke-width="1" /><text x="48" y="898" font-size="18" fill="#657386" text-anchor="start">流水线拆分与 Driver 并行度由计划和 LocalPlanner 决定；Source 并非都接收 splits，例如 Values / LocalExchange。</text><text x="48" y="926" font-size="18" fill="#657386" text-anchor="start">Driver 是可调度状态与算子容器：一次至多由一个线程执行，后续可换另一条 executor 线程。</text></svg>