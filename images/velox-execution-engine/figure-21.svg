<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="805" viewBox="0 0 1280 805" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">计划树切成 Pipeline，再实例化多个 Driver</title><desc id="desc">示例：(S JOIN T) 的结果构建第二张表，再与 R 连接；箭头表示数据 / build 依赖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="805" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">计划树切成 Pipeline，再实例化多个 Driver</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">示例：(S JOIN T) 的结果构建第二张表，再与 R 连接；箭头表示数据 / build 依赖。</text><line x1="48" y1="110.7778" x2="1232" y2="110.7778" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="135" width="1160" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="135" x2="1220.0" y2="135" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="168" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Pipeline 0：Scan T → Filter → HashBuild(T)</text><text x="78" y="202" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="231" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><rect x="60" y="355" width="1160" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="355" x2="1220.0" y2="355" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="388" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Pipeline 1：Scan S → Filter → HashProbe(T) → HashBuild(ST)</text><text x="78" y="422" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="451" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><rect x="60" y="575" width="1160" height="117.5676" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="575" x2="1220.0" y2="575" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="608" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Pipeline 2：Scan R → Filter → HashProbe(ST) → Sink</text><text x="78" y="642" font-size="17" fill="#657386" text-anchor="start">同一 Pipeline 可有 Driver 0、Driver 1、…；每个 Driver 各有一套 Operator 实例。</text><text x="78" y="671" font-size="17" fill="#657386" text-anchor="start">HashBuild / HashProbe 通过 JoinBridge 共享完成后的表，不跨 pipeline 直接递归调用。</text><polyline points="1080,285 1080,350" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><text x="810" y="320" font-size="17" fill="#657386" text-anchor="start">T 表 ready / future</text><polyline points="1080,505 1080,570" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><text x="800" y="540" font-size="17" fill="#657386" text-anchor="start">ST 表 ready / future</text><line x1="48" y1="716" x2="1232" y2="716" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="743" font-size="18" fill="#657386" text-anchor="start">流水线拆分与 Driver 并行度由计划和 LocalPlanner 决定；Source 并非都接收 splits，例如 Values / LocalExchange。</text><text x="48" y="771" font-size="18" fill="#657386" text-anchor="start">Driver 是可调度状态与算子容器：一次至多由一个线程执行，后续可换另一条 executor 线程。</text></svg>