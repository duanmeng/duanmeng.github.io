<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="761" viewBox="0 0 1280 761" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">列式执行的技术脉络</title><desc id="desc">箭头表示研究与设计思想的延续，不表示所有产品直接派生自同一份代码。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="761" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">列式执行的技术脉络</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">箭头表示研究与设计思想的延续，不表示所有产品直接派生自同一份代码。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="500" height="115" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="78" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">CWI / MonetDB</text><text x="78" y="204" font-size="20" fill="#1f2d3d" text-anchor="start">列式存储、整列运算与内存带宽利用</text><rect x="60" y="322" width="500" height="115" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="78" y="355" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">MonetDB/X100 → VectorWise</text><text x="78" y="389" font-size="20" fill="#1f2d3d" text-anchor="start">按适当大小的向量批量执行，减少中间物化</text><polyline points="310,252 310,320" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="650" y="137" width="570" height="300" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="650" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="668" y="170" font-size="22" fill="#877951" text-anchor="start" font-weight="600">各自演化的列式系统</text><text x="668" y="204" font-size="20" fill="#1f2d3d" text-anchor="start">KDB+ · BigQuery · ClickHouse</text><text x="668" y="233" font-size="20" fill="#1f2d3d" text-anchor="start">Amazon Redshift · Apache DataFusion</text><text x="668" y="262" font-size="20" fill="#1f2d3d" text-anchor="start">产品定位、运行时和实现各不相同。</text><text x="668" y="291" font-size="20" fill="#1f2d3d" text-anchor="start">不能把“采用向量化”理解为同一个执行模型。</text><text x="62" y="507" font-size="22" fill="#1f2d3d" text-anchor="start" font-weight="600">批量执行、紧凑布局与自适应优化在后续系统中继续演进</text><rect x="60" y="553" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="78" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Snowflake</text><text x="78" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">云数仓执行</text><rect x="365" y="553" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="383" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Photon</text><text x="383" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">Spark 原生执行</text><rect x="670" y="553" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="688" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Velox</text><text x="688" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">可组合 C++ 库</text><rect x="975" y="553" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="993" y="586" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">DuckDB</text><text x="993" y="620" font-size="18" fill="#1f2d3d" text-anchor="start">嵌入式分析</text><line x1="48" y1="700" x2="1232" y2="700" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="727" font-size="18" fill="#657386" text-anchor="start">关注技术机制与职责边界；人员流动或实现借鉴不等于产品、架构或代码的直接继承。</text></svg>