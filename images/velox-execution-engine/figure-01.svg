<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">列式执行的技术脉络</title><desc id="desc">箭头表示研究与设计思想的延续，不表示所有产品直接派生自同一份代码。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="820" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">列式执行的技术脉络</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">箭头表示研究与设计思想的延续，不表示所有产品直接派生自同一份代码。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="500" height="115" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">CWI / MonetDB</text><text x="78" y="227" font-size="20" fill="#657386" text-anchor="start">列式存储、整列运算与内存带宽利用</text><rect x="60" y="345" width="500" height="115" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="378" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">MonetDB/X100 → VectorWise</text><text x="78" y="412" font-size="20" fill="#657386" text-anchor="start">按适当大小的向量批量执行，减少中间物化</text><polyline points="310,275 310,343" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="650" y="160" width="570" height="300" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="668" y="193" font-size="22" fill="#877951" text-anchor="start" font-weight="600">各自演化的列式系统</text><text x="668" y="227" font-size="20" fill="#657386" text-anchor="start">KDB+ · BigQuery · ClickHouse</text><text x="668" y="256" font-size="20" fill="#657386" text-anchor="start">Amazon Redshift · Apache DataFusion</text><text x="668" y="285" font-size="20" fill="#657386" text-anchor="start">产品定位、运行时和实现各不相同。</text><text x="668" y="314" font-size="20" fill="#657386" text-anchor="start">不能把“采用向量化”理解为同一个执行模型。</text><text x="62" y="530" font-size="22" fill="#1f2d3d" text-anchor="start" font-weight="600">批量执行、紧凑布局与自适应优化在后续系统中继续演进</text><rect x="60" y="576" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="78" y="609" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Snowflake</text><text x="78" y="643" font-size="18" fill="#657386" text-anchor="start">云数仓执行</text><rect x="365" y="576" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="383" y="609" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Photon</text><text x="383" y="643" font-size="18" fill="#657386" text-anchor="start">Spark 原生执行</text><rect x="670" y="576" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="688" y="609" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">Velox</text><text x="688" y="643" font-size="18" fill="#657386" text-anchor="start">可组合 C++ 库</text><rect x="975" y="576" width="245" height="112" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="993" y="609" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">DuckDB</text><text x="993" y="643" font-size="18" fill="#657386" text-anchor="start">嵌入式分析</text><line x1="48" y1="759" x2="1232" y2="759" stroke="#dce3ea" stroke-width="1" /><text x="48" y="786" font-size="18" fill="#657386" text-anchor="start">关注技术机制与职责边界；人员流动或实现借鉴不等于产品、架构或代码的直接继承。</text></svg>