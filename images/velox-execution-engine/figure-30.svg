<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">表达式 peeling：在底层值上计算，再重新包装</title><desc id="desc">确定性、null 语义、兼容的封装与配置是前提；选择集合也必须映射到内层。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="870" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">表达式 peeling：在底层值上计算，再重新包装</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">确定性、null 语义、兼容的封装与配置是前提；选择集合也必须映射到内层。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="540" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">输入：1,000 行 color</text><text x="78" y="227" font-size="20" fill="#657386" text-anchor="start">indices: [0, 1, 2, 0, 1, …]</text><text x="78" y="256" font-size="20" fill="#657386" text-anchor="start">base: [red, green, blue]</text><text x="78" y="285" font-size="20" fill="#657386" text-anchor="start">表达式：upper(color)</text><rect x="680" y="160" width="540" height="150" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="698" y="193" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">剥离包装后</text><text x="698" y="227" font-size="19" fill="#657386" text-anchor="start">对本批次实际需要的 base rows 求 upper</text><text x="698" y="256" font-size="19" fill="#657386" text-anchor="start">base result: [RED, GREEN, BLUE]</text><text x="698" y="285" font-size="19" fill="#657386" text-anchor="start">最多只计算三个底层值。</text><polyline points="600,230 678,230" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="680" y="430" width="540" height="150" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="698" y="463" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">重新包装结果</text><text x="698" y="497" font-size="18" fill="#657386" text-anchor="start">保留输入对应的 indices / null 语义</text><text x="698" y="526" font-size="18" fill="#657386" text-anchor="start">得到逻辑长度仍为 1,000 的 DictionaryVector</text><text x="698" y="555" font-size="18" fill="#657386" text-anchor="start">结果不会退化成仅有三行。</text><polyline points="950,310 950,428" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="60" y="430" width="540" height="150" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="463" font-size="22" fill="#877951" text-anchor="start" font-weight="600">跨批次 memoization</text><text x="78" y="497" font-size="18" fill="#657386" text-anchor="start">满足条件时记住同一 base 对象的结果</text><text x="78" y="526" font-size="18" fill="#657386" text-anchor="start">新 base 或已销毁的 base 会使缓存失效</text><text x="78" y="555" font-size="18" fill="#657386" text-anchor="start">只缓存成功计算的行，未计算行继续补算。</text><polyline points="680,505 602,505" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="781" x2="1232" y2="781" stroke="#dce3ea" stroke-width="1" /><text x="48" y="808" font-size="18" fill="#657386" text-anchor="start">当前 Expr 的 dictionary memoization 主要针对单个 distinct field，且受开关与 memoDisabled 等条件限制。</text><text x="48" y="836" font-size="18" fill="#657386" text-anchor="start">缓存不是按任意输入内容做全局查表，也不保证第一批计算后所有后续批次都完全免算。</text></svg>