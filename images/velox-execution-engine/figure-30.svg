<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="597" viewBox="0 0 1280 597" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">表达式 peeling：在底层值上计算，再重新包装</title><desc id="desc">确定性、null 语义、兼容的封装与配置是前提；选择集合也必须映射到内层。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="597" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">表达式 peeling：在底层值上计算，再重新包装</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">确定性、null 语义、兼容的封装与配置是前提；选择集合也必须映射到内层。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="137" x2="600.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">输入：1,000 行 color</text><text x="78" y="204" font-size="20" fill="#1f2d3d" text-anchor="start">indices: [0, 1, 2, 0, 1, …]</text><text x="78" y="233" font-size="20" fill="#1f2d3d" text-anchor="start">base: [red, green, blue]</text><text x="78" y="262" font-size="20" fill="#1f2d3d" text-anchor="start">表达式：upper(color)</text><rect x="680" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="170" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">剥离包装后</text><text x="698" y="204" font-size="19" fill="#1f2d3d" text-anchor="start">对本批次实际需要的 base rows 求 upper</text><text x="698" y="233" font-size="19" fill="#1f2d3d" text-anchor="start">base result: [RED, GREEN, BLUE]</text><text x="698" y="262" font-size="19" fill="#1f2d3d" text-anchor="start">最多只计算三个底层值。</text><polyline points="600,207 678,207" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="680" y="323" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="323" x2="1220.0" y2="323" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="356" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">重新包装结果</text><text x="698" y="390" font-size="18" fill="#1f2d3d" text-anchor="start">保留输入对应的 indices / null 语义</text><text x="698" y="419" font-size="18" fill="#1f2d3d" text-anchor="start">得到逻辑长度仍为 1,000 的 DictionaryVector</text><text x="698" y="448" font-size="18" fill="#1f2d3d" text-anchor="start">结果不会退化成仅有三行。</text><polyline points="950,287 950,321" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="323" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="323" x2="600.0" y2="323" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="356" font-size="22" fill="#877951" text-anchor="start" font-weight="600">跨批次 memoization</text><text x="78" y="390" font-size="18" fill="#1f2d3d" text-anchor="start">满足条件时记住同一 base 对象的结果</text><text x="78" y="419" font-size="18" fill="#1f2d3d" text-anchor="start">新 base 或已销毁的 base 会使缓存失效</text><text x="78" y="448" font-size="18" fill="#1f2d3d" text-anchor="start">只缓存成功计算的行，未计算行继续补算。</text><polyline points="680,398 602,398" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><line x1="48" y1="508" x2="1232" y2="508" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="535" font-size="18" fill="#657386" text-anchor="start">当前 Expr 的 dictionary memoization 主要针对单个 distinct field，且受开关与 memoDisabled 等条件限制。</text><text x="48" y="563" font-size="18" fill="#657386" text-anchor="start">缓存不是按任意输入内容做全局查表，也不保证第一批计算后所有后续批次都完全免算。</text></svg>