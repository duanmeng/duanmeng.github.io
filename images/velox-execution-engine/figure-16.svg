<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">HashTable：索引目录与真实行分离</title><desc id="desc">当前非 kArray 模式：tag / row pointer 目录定位 RowContainer 中的 key 与 payload。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="850" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">HashTable：索引目录与真实行分离</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">当前非 kArray 模式：tag / row pointer 目录定位 RowContainer 中的 key 与 payload。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="360" height="245" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">HashTable</text><text x="78" y="227" font-size="18" fill="#657386" text-anchor="start">table_ / tableAllocation_</text><text x="78" y="256" font-size="18" fill="#657386" text-anchor="start">rows_ → RowContainer</text><text x="78" y="285" font-size="18" fill="#657386" text-anchor="start">hashers_ → VectorHasher[]</text><text x="78" y="314" font-size="18" fill="#657386" text-anchor="start">hashMode_ / capacity_</text><rect x="525" y="160" width="690" height="160" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="543" y="193" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">连续的 Bucket 区域</text><text x="543" y="227" font-size="17" fill="#657386" text-anchor="start">每个 Bucket 128 B：16 tags + 16 × 6 B pointers + 16 B padding</text><text x="543" y="256" font-size="17" fill="#657386" text-anchor="start">Slot 的 tag 是筛选信息，不是完整 key。</text><polyline points="420,212 523,212" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="525" y="380" width="690" height="145" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="543" y="413" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">RowContainer</text><text x="543" y="447" font-size="19" fill="#657386" text-anchor="start">聚合：group keys + aggregate states</text><text x="543" y="476" font-size="19" fill="#657386" text-anchor="start">Join：keys + payload；重复 key 可组织成行链</text><polyline points="925,320 925,378" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="420,259 470,259 470,450 523,450" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="60" y="588" width="1155" height="113" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="621" font-size="22" fill="#877951" text-anchor="start" font-weight="600">VectorHasher</text><text x="78" y="655" font-size="18" fill="#657386" text-anchor="start">TypePtr type_ · column channel · DecodedVector decoded_ · value ID / hash 计算与范围分析</text><polyline points="238,405 238,586" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="789" x2="1232" y2="789" stroke="#dce3ea" stroke-width="1" /><text x="48" y="816" font-size="18" fill="#657386" text-anchor="start">48-bit 指针布局是这一实现的地址假设；不能因为 CPU 支持 64 位指针就认为任意地址都可压缩为 6 B。</text></svg>