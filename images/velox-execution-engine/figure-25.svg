<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">一次内存增长：先争取容量，再执行物理分配</title><desc id="desc">局部仲裁与全局仲裁依配置和条件进入；下图只展示需要从 Query B 回收的分支。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="1130" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">一次内存增长：先争取容量，再执行物理分配</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">局部仲裁与全局仲裁依配置和条件进入；下图只展示需要从 Query B 回收的分支。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="540" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Query A / Operator leaf</text><text x="78" y="227" font-size="20" fill="#657386" text-anchor="start">1  请求分配 → 增加 leaf reservation</text><text x="78" y="256" font-size="20" fill="#657386" text-anchor="start">2  root capacity 不足 → growPool</text><text x="78" y="285" font-size="20" fill="#657386" text-anchor="start">3  MemoryManager → MemoryArbitrator</text><rect x="680" y="160" width="540" height="150" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="698" y="193" font-size="22" fill="#877951" text-anchor="start" font-weight="600">仲裁与容量来源</text><text x="698" y="227" font-size="19" fill="#657386" text-anchor="start">先使用可用容量、回收空闲 capacity</text><text x="698" y="256" font-size="19" fill="#657386" text-anchor="start">必要时选择可回收 Query B</text><text x="698" y="285" font-size="19" fill="#657386" text-anchor="start">不是对所有查询、所有算子一律 spill。</text><polyline points="600,235 678,235" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="680" y="395" width="540" height="150" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="698" y="428" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">阶段一：让候选 Task 安全停下</text><text x="698" y="462" font-size="16" fill="#657386" text-anchor="start">Query B → Task::MemoryReclaimer</text><text x="698" y="491" font-size="16" fill="#657386" text-anchor="start">requestPause()；等待所有相关 Driver 到达安全点</text><text x="698" y="520" font-size="16" fill="#657386" text-anchor="start">调用线程 / 仲裁线程的等待与 Driver off-thread 区分。</text><polyline points="950,310 950,393" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="680" y="630" width="540" height="150" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="698" y="663" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">阶段二：回收算子状态</text><text x="698" y="697" font-size="17" fill="#657386" text-anchor="start">Node reclaimer → 可回收 Operator reclaimer</text><text x="698" y="726" font-size="17" fill="#657386" text-anchor="start">检查可回收量与非回收临界区，按目标 spill</text><text x="698" y="755" font-size="17" fill="#657386" text-anchor="start">失败先设置 Task error，再执行 resume 收尾。</text><polyline points="950,545 950,628" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="60" y="630" width="540" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="78" y="663" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">回收完成后继续 Query A</text><text x="78" y="697" font-size="17" fill="#657386" text-anchor="start">4  释放 reservation，归还 / 转移 root capacity</text><text x="78" y="726" font-size="17" fill="#657386" text-anchor="start">5  MemoryAllocator 执行字节 / 页分配</text><text x="78" y="755" font-size="17" fill="#657386" text-anchor="start">6  可选缓存协作，空间不足则驱逐缓存或失败。</text><polyline points="680,705 602,705" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="60,705 35,705 35,235 58,235" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5" /><text x="60" y="878" font-size="23" fill="#1f2d3d" text-anchor="start" font-weight="600">“暂停”建立执行安全边界；“回收”调用算子的 spill 实现。两者是不同阶段。</text><line x1="48" y1="1041" x2="1232" y2="1041" stroke="#dce3ea" stroke-width="1" /><text x="48" y="1068" font-size="18" fill="#657386" text-anchor="start">整个过程受超时、查询上限、可回收性与 abort 策略约束，不能保证每次请求都成功。</text><text x="48" y="1096" font-size="18" fill="#657386" text-anchor="start">MemoryPool 配额限制也不覆盖所有外部分配，不能单独保证进程绝不会被 OOM killer 终止。</text></svg>