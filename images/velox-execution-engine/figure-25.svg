<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="863" viewBox="0 0 1280 863" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">一次内存增长：先争取容量，再执行物理分配</title><desc id="desc">局部仲裁与全局仲裁依配置和条件进入；下图只展示需要从 Query B 回收的分支。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="863" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">一次内存增长：先争取容量，再执行物理分配</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">局部仲裁与全局仲裁依配置和条件进入；下图只展示需要从 Query B 回收的分支。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="137" x2="600.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">Query A / Operator leaf</text><text x="78" y="204" font-size="20" fill="#1f2d3d" text-anchor="start">1  请求分配 → 增加 leaf reservation</text><text x="78" y="233" font-size="20" fill="#1f2d3d" text-anchor="start">2  root capacity 不足 → growPool</text><text x="78" y="262" font-size="20" fill="#1f2d3d" text-anchor="start">3  MemoryManager → MemoryArbitrator</text><rect x="680" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="170" font-size="22" fill="#877951" text-anchor="start" font-weight="600">仲裁与容量来源</text><text x="698" y="204" font-size="19" fill="#1f2d3d" text-anchor="start">先使用可用容量、回收空闲 capacity</text><text x="698" y="233" font-size="19" fill="#1f2d3d" text-anchor="start">必要时选择可回收 Query B</text><text x="698" y="262" font-size="19" fill="#1f2d3d" text-anchor="start">不是对所有查询、所有算子一律 spill。</text><polyline points="600,212 678,212" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="680" y="323" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="323" x2="1220.0" y2="323" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="356" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">阶段一：让候选 Task 安全停下</text><text x="698" y="390" font-size="16" fill="#657386" text-anchor="start">Query B → Task::MemoryReclaimer</text><text x="698" y="419" font-size="16" fill="#657386" text-anchor="start">requestPause()；等待所有相关 Driver 到达安全点</text><text x="698" y="448" font-size="16" fill="#657386" text-anchor="start">调用线程 / 仲裁线程的等待与 Driver off-thread 区分。</text><polyline points="950,287 950,321" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="680" y="509" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="509" x2="1220.0" y2="509" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="542" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">阶段二：回收算子状态</text><text x="698" y="576" font-size="17" fill="#657386" text-anchor="start">Node reclaimer → 可回收 Operator reclaimer</text><text x="698" y="605" font-size="17" fill="#657386" text-anchor="start">检查可回收量与非回收临界区，按目标 spill</text><text x="698" y="634" font-size="17" fill="#657386" text-anchor="start">失败先设置 Task error，再执行 resume 收尾。</text><polyline points="950,473 950,507" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><rect x="60" y="509" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="509" x2="600.0" y2="509" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="542" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">回收完成后继续 Query A</text><text x="78" y="576" font-size="17" fill="#657386" text-anchor="start">4  释放 reservation，归还 / 转移 root capacity</text><text x="78" y="605" font-size="17" fill="#657386" text-anchor="start">5  MemoryAllocator 执行字节 / 页分配</text><text x="78" y="634" font-size="17" fill="#657386" text-anchor="start">6  可选缓存协作，空间不足则驱逐缓存或失败。</text><polyline points="680,584 602,584" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="60,584 35,584 35,212 58,212" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" stroke-dasharray="6 5" /><text x="60" y="727" font-size="23" fill="#1f2d3d" text-anchor="start" font-weight="600">“暂停”建立执行安全边界；“回收”调用算子的 spill 实现。两者是不同阶段。</text><line x1="48" y1="774" x2="1232" y2="774" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="801" font-size="18" fill="#657386" text-anchor="start">整个过程受超时、查询上限、可回收性与 abort 策略约束，不能保证每次请求都成功。</text><text x="48" y="829" font-size="18" fill="#657386" text-anchor="start">MemoryPool 配额限制也不覆盖所有外部分配，不能单独保证进程绝不会被 OOM killer 终止。</text></svg>