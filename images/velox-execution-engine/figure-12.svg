<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Simple Function 如何进入向量化执行框架</title><desc id="desc">函数作者编写逐值语义，Adapter 处理行集合、编码、null 与结果缓冲区。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="800" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Simple Function 如何进入向量化执行框架</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">函数作者编写逐值语义，Adapter 处理行集合、编码、null 与结果缓冲区。</text><line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1" /><rect x="60" y="160" width="500" height="150" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1" /><text x="78" y="193" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Simple Function</text><text x="78" y="227" font-size="18" fill="#657386" text-anchor="start">call(out, a, b)</text><text x="78" y="256" font-size="18" fill="#657386" text-anchor="start">可选 callNullable / callNullFree / callAscii</text><text x="78" y="285" font-size="18" fill="#657386" text-anchor="start">initialize 处理常量参数等预计算</text><rect x="680" y="160" width="540" height="150" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1" /><text x="698" y="193" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">SimpleFunctionAdapter&lt;FUNC&gt;</text><text x="698" y="227" font-size="18" fill="#657386" text-anchor="start">模板实例化与类型适配</text><text x="698" y="256" font-size="18" fill="#657386" text-anchor="start">选择 fast path，处理结果与字符串所有权</text><polyline points="560,230 678,230" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><text x="593" y="205" font-size="17" fill="#657386" text-anchor="start">适配</text><rect x="60" y="405" width="500" height="165" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1" /><text x="78" y="438" font-size="22" fill="#877951" text-anchor="start" font-weight="600">输入上下文</text><text x="78" y="472" font-size="19" fill="#657386" text-anchor="start">SelectivityVector rows</text><text x="78" y="501" font-size="19" fill="#657386" text-anchor="start">std::vector&lt;VectorPtr&gt; args</text><text x="78" y="530" font-size="19" fill="#657386" text-anchor="start">完整 output TypePtr 与 EvalCtx</text><rect x="680" y="405" width="540" height="165" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1" /><text x="698" y="438" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">VectorFunction::apply(...)</text><text x="698" y="472" font-size="19" fill="#657386" text-anchor="start">批量读值并调用标量函数</text><text x="698" y="501" font-size="19" fill="#657386" text-anchor="start">必要时 DecodedVector 解码访问</text><text x="698" y="530" font-size="19" fill="#657386" text-anchor="start">生成 / 复用 result VectorPtr</text><polyline points="950,310 950,402" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="560,485 678,485" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#arrow)" /><line x1="48" y1="739" x2="1232" y2="739" stroke="#dce3ea" stroke-width="1" /><text x="48" y="766" font-size="18" fill="#657386" text-anchor="start">Simple Function 的参数使用 C++ 类型 / Reader / Writer 视图；SQL 逻辑类型仍由函数签名和 TypePtr 保留。</text></svg>