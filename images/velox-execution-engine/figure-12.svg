<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="552" viewBox="0 0 1280 552" role="img" aria-labelledby="title desc" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif"><title id="title">Simple Function 如何进入向量化执行框架</title><desc id="desc">函数作者编写逐值语义，Adapter 处理行集合、编码、null 与结果缓冲区。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#657386" /></marker></defs><rect x="0" y="0" width="1280" height="552" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="48" y="55" font-size="28" fill="#1f2d3d" text-anchor="start" font-weight="600">Simple Function 如何进入向量化执行框架</text><text x="48" y="91" font-size="18" fill="#657386" text-anchor="start">函数作者编写逐值语义，Adapter 处理行集合、编码、null 与结果缓冲区。</text><line x1="48" y1="112.1373" x2="1232" y2="112.1373" stroke="#dce3ea" stroke-width="1.85" /><rect x="60" y="137" width="500" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="137" x2="560.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="170" font-size="22" fill="#65537f" text-anchor="start" font-weight="600">Simple Function</text><text x="78" y="204" font-size="18" fill="#1f2d3d" text-anchor="start">call(out, a, b)</text><text x="78" y="233" font-size="18" fill="#1f2d3d" text-anchor="start">可选 callNullable / callNullFree / callAscii</text><text x="78" y="262" font-size="18" fill="#1f2d3d" text-anchor="start">initialize 处理常量参数等预计算</text><rect x="680" y="137" width="540" height="150" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="137" x2="1220.0" y2="137" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="170" font-size="22" fill="#326cae" text-anchor="start" font-weight="600">SimpleFunctionAdapter&lt;FUNC&gt;</text><text x="698" y="204" font-size="18" fill="#1f2d3d" text-anchor="start">模板实例化与类型适配</text><text x="698" y="233" font-size="18" fill="#1f2d3d" text-anchor="start">选择 fast path，处理结果与字符串所有权</text><polyline points="560,207 678,207" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><text x="593" y="182" font-size="17" fill="#657386" text-anchor="start">适配</text><rect x="60" y="321" width="500" height="142.7917" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="60" y1="321" x2="560.0" y2="321" stroke="#dce3ea" stroke-width="1.85" /><text x="78" y="354" font-size="22" fill="#877951" text-anchor="start" font-weight="600">输入上下文</text><text x="78" y="388" font-size="19" fill="#1f2d3d" text-anchor="start">SelectivityVector rows</text><text x="78" y="417" font-size="19" fill="#1f2d3d" text-anchor="start">std::vector&lt;VectorPtr&gt; args</text><text x="78" y="446" font-size="19" fill="#1f2d3d" text-anchor="start">完整 output TypePtr 与 EvalCtx</text><rect x="680" y="321" width="540" height="142.7917" rx="5" fill="white" stroke="none" stroke-width="1" /><line x1="680" y1="321" x2="1220.0" y2="321" stroke="#dce3ea" stroke-width="1.85" /><text x="698" y="354" font-size="22" fill="#2e7963" text-anchor="start" font-weight="600">VectorFunction::apply(...)</text><text x="698" y="388" font-size="19" fill="#1f2d3d" text-anchor="start">批量读值并调用标量函数</text><text x="698" y="417" font-size="19" fill="#1f2d3d" text-anchor="start">必要时 DecodedVector 解码访问</text><text x="698" y="446" font-size="19" fill="#1f2d3d" text-anchor="start">生成 / 复用 result VectorPtr</text><polyline points="950,287 950,318.6854" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><polyline points="560,401 678,401" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arrow)" /><line x1="48" y1="491" x2="1232" y2="491" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="518" font-size="18" fill="#657386" text-anchor="start">Simple Function 的参数使用 C++ 类型 / Reader / Writer 视图；SQL 逻辑类型仍由函数签名和 TypePtr 保留。</text></svg>