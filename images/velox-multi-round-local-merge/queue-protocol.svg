<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img"><title>队列背压：返回 blocked 时，当前批次已经入队</title><desc>示例 queueSize = 2；nullptr EOF 是结束标志，不占队列槽位</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1440" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">队列背压：返回 blocked 时，当前批次已经入队</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">示例 queueSize = 2；nullptr EOF 是结束标志，不占队列槽位</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><rect x="48" y="175" width="369" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="66" y="211" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Producer</text><text x="48" y="277" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Driver 或 spill callback</text><rect x="535" y="175" width="369" height="60" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="553" y="211" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">LocalMergeSource</text><text x="535" y="277" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">有界 queue + promises</text><rect x="1023" y="175" width="369" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="1041" y="211" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Consumer</text><text x="1023" y="277" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">SourceStream</text><line x1="232" y1="322" x2="232" y2="1239" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6"/><line x1="719" y1="322" x2="719" y2="1239" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6"/><line x1="1207" y1="322" x2="1207" y2="1239" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 6"/><polyline points="232,390 719,390" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="252" y="366" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">enqueue(A) → 队列 [A]</text><polyline points="232,535 719,535" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="252" y="511" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">enqueue(B) → 队列 [A, B]</text><polyline points="719,669 232,669" fill="none" stroke="#ac9c76" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-warm)"/><text x="252" y="645" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">kWaitForConsumer + future</text><polyline points="1207,824 719,824" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-green)"/><text x="770" y="800" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">next() → 取走 A，队列 [B]</text><polyline points="719,968 232,968" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-green)"/><text x="252" y="944" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">在队列锁外通知 producer</text><polyline points="232,1110 719,1110" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="252" y="1086" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">恢复后 enqueue(nullptr) → atEnd</text><rect x="769" y="403" width="171" height="47" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="854.5" y="433.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">A</text><rect x="945" y="403" width="171" height="47" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1030.5" y="433.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">空</text><rect x="769" y="547" width="171" height="47" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="854.5" y="577.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">A</text><rect x="945" y="547" width="171" height="47" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="1030.5" y="577.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">B</text><text x="48" y="729" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#1f2d3d" font-weight="400" text-anchor="start">停止读下一批，不重试入队 B</text><rect x="769" y="844" width="171" height="47" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="854.5" y="874.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">B</text><rect x="945" y="844" width="171" height="47" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1030.5" y="874.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">空</text><text x="769" y="1189" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">先取走 B；再 next 才看到 EOF</text><line x1="48" y1="1302" x2="1392" y2="1302" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1336" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">相反方向：queue 空且尚未 EOF → consumer 保存 future，等待 producer 通知</text><text x="48" y="1370" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">同一个队列协议同时服务于 pipeline lazy start、数据可用通知和生产端背压。</text></svg>