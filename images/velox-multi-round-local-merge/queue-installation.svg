<text x="300" y="174" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" fill="#326cae" font-size="20" text-anchor="start">Task</text>
<text x="300" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">按 group / node 注册</text>
<line x1="390" y1="230" x2="390" y2="945" stroke="#657386" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="530" y="140" width="220" height="87" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="530" y="144" width="4" height="79" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="550" y="174" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" fill="#326cae" font-size="20" text-anchor="start">CallbackSink</text>
<text x="550" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">上游 Driver 的尾端</text>
<line x1="640" y1="230" x2="640" y2="945" stroke="#657386" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="780" y="140" width="220" height="87" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="780" y="144" width="4" height="79" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="800" y="174" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" fill="#2e7963" font-size="20" text-anchor="start">MergeSource</text>
<text x="800" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">同一份 shared 对象</text>
