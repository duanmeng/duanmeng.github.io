<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
<title id="title">MergeSource 怎样安装并连接两个 pipeline</title><desc id="desc">注册连接在构造 producer Driver / CallbackSink 时完成；取连接、start 和数据传递发生在运行阶段</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="1080" rx="0" fill="white" stroke="none" stroke-width="1"/>
