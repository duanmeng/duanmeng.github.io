<text x="50" y="174" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" fill="#326cae" font-size="20" text-anchor="start">LocalPlanner</text>
<text x="50" y="205" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">执行 sink supplier</text>
<line x1="140" y1="230" x2="140" y2="945" stroke="#657386" stroke-width="2" stroke-dasharray="7 5"/>
