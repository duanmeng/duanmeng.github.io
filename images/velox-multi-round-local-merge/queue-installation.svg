<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">MergeSource 怎样安装并连接两个 pipeline</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">注册连接在构造 producer Driver / CallbackSink 时完成；取连接、start 和数据传递发生在运行阶段</text>
