<line x1="1140" y1="230" x2="1140" y2="945" stroke="#657386" stroke-width="2" stroke-dasharray="7 5"/>
<text x="265.0" y="263" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">addLocalMergeSource(...)</text>
<polyline points="140,276 390,276" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="640.0" y="332" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">创建本地队列并保存 shared_ptr</text>
<polyline points="390,345 890,345" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="265.0" y="396" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">返回 shared_ptr&lt;MergeSource&gt;</text>
<polyline points="390,409 140,409" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="390.0" y="467" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">构造 CallbackSink：安装 startCb / consumerCb</text>
<polyline points="140,480 640,480" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="523" y="510" width="240" height="88" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<rect x="523" y="514" width="4" height="80" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="543" y="544" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#877951" font-size="20" font-weight="400" text-anchor="start">闭包捕获同一 source</text>
<text x="543" y="575" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">started() / enqueue()</text>
<text x="765.0" y="632" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">addMergeSources → getLocalMergeSources(group, node)</text>
<polyline points="1140,645 390,645" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="765.0" y="697" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">返回已注册的 sources；LocalMerge 保存引用</text>
<polyline points="390,710 1140,710" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1015.0" y="767" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">选中本组 → start()</text>
<polyline points="1140,780 890,780" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="765.0" y="834" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">consumerCb → enqueue(batch)</text>
<polyline points="640,847 890,847" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1015.0" y="904" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="17" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">SourceStream → next()</text>
<polyline points="1140,917 890,917" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="978" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="978.0" x2="1240.0" y2="978.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="1007" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">连接键是 splitGroupId + LocalMerge planNodeId；它们让两边找到同一组队列</text>
<text x="60" y="1032" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">每个 CallbackSink 捕获自己那一路 source；Task 和 LocalMerge 保存共享引用。</text>
</svg>
