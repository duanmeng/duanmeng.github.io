ea" stroke-width="1.55" /><text x="359" y="810" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Driver N−1</text><rect x="359" y="844" width="278" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="377" y="880" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">TableScan</text><text x="359" y="947" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">读取和解码</text><rect x="700" y="844" width="301" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="718" y="880" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">CallbackSink</text><text x="700" y="947" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">调用 consumerCb 入队</text><polyline points="268,878 359,878" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="637,878 700,878" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><text x="1090" y="811" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">MergeSource N−1</text><rect x="1090" y="844" width="180" height="60" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="1180.0" y="881" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><rect x="1275" y="844" width="180" height="60" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="1365.0" y="881" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><text x="1090" y="947" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">本地线程安全有界队列</text><polyline points="1001,874 1090,874" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="1455,874 1531,874" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><rect x="1531" y="231" width="221" height="751.2045" rx="5" fill="white" stroke="#39826d" stroke-width="1.55" /><text x="1549" y="284" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="600" text-anchor="start">LocalMerge</text><text x="1549" y="345" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">1 个 Driver</text><text x="1549" y="384" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">逐路取队首</text><text x="1549" y="418" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">比较排序键</text><text x="1549" y="452" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">选择下一行</text><text x="1549" y="491" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">多个 source</text><text x="1549" y="525" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">归并为一条流</text><rect x="1531" y="994" width="221" height="62" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="1641.5" y="1032" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="400" text-anchor="middle">下游输出</text><polyline points="1641,982.2045 1641,994" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><line x1="48" y1="1086.623" x2="1752" y2="1086.623" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="1119" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">跨 pipeline 的逻辑上下游，不是同一 Driver 内的直接调用</text><text x="48" y="1153" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">CallbackSink 是扫描链的 sink；LocalMerge 是归并链的 source。start / next 由归并端调用。</text><text x="48" y="1187" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">上图固定的是 N 个 producer → N 个队列 → 1 个 merger，不是强制 N 个不同的 pipeline 定义</text><text x="48" y="1221" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">一个有序 source 可对应一个文件或有序文件序列；拆成几个 DriverFactory 取决于实际计划。</text></svg>