ke-width="1.5"/><text x="48" y="1658" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">F 只限制第一阶段；最终 fan-in = 非空文件组数，本实现不递归压成 F 路。</text></svg>