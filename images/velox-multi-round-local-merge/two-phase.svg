接</text><polyline points="782,695 885,695" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)"/><polyline points="822,729 822,885" fill="none" stroke="#657386" stroke-width="1.8" marker-end="url(#a-muted)"/><text x="718" y="907" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#657386" font-weight="400" text-anchor="start">本轮完成</text><text x="48" y="920" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">第 3 轮 · source 16–23</text><text x="48" y="964" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">最后一轮也写入 spill</text><rect x="48" y="1020" width="85" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="90.5" y="1051.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">16</text><rect x="138" y="1020" width="85" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="180.5" y="1051.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">17</text><rect x="228" y="1020" width="85" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="270.5" y="1051.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">18</text><rect x="318" y="1020" width="85" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="360.5" y="1051.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">19</text><rect x="408" y="1020" width="85" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><tex