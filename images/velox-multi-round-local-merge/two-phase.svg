<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img"><title>从 24 路输入到 3 路 spill stream</title><desc>示例：N = 24，F = 8；每一路输入本身有序，三个输入组依次执行</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="960" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">从 24 路输入到 3 路 spill stream</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">示例：N = 24，F = 8；每一路输入本身有序，三个输入组依次执行</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">阶段 1：每轮只启动一组 source</text><rect x="40" y="179" width="366" height="47" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="223.0" y="209.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="middle">第 1 轮 · source 0–7</text><text x="40" y="267" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">运行时，8–23 尚未启动</text><rect x="40" y="294" width="42" height="43" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="61.0" y="322.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="middle">0</text><rect x="86" y="294" width="42" height="43" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="107.0" y="322.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="middle">1</text><rect x="132" y="294" width="42" height="43" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="153.0" y="322.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill