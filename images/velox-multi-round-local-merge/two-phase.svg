th="1.8" marker-end="url(#arrow-blue)"/><text x="832" y="242" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="start">本轮</text><text x="832" y="266" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#657386" text-anchor="start">完成</text><line x1="40" y1="614" x2="1240" y2="614" stroke="#8d76b7" stroke-width="1.8"/><text x="40" y="649" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">两阶段边界：所有输入组写完，才开始最终输出</text><text x="40" y="706" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">SpillMerger：并行读回 3 组，单线程归并</text><text x="40" y="741" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">3 × BatchStream → 3 × 有界队列 → SourceMerger → 下游</text><rect x="40" y="785" width="251" height="49" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="165.5" y="816.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="middle">G0 / queue 0</text><polyline points="165,834 165,855 1084,855 1084,834" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="321" y="785" width="251" height="49" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="446.5" y="816.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="middle">G1 / queue 1</text><polyline points="446,834 446,855 1084,855 1084,834" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="602" y="785" width="251" height="49" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="727.5" y="816.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="middle">G2 / queue 2</text><polyline points="727,834 727,855 1084,855 1084,834" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="941" y="785" width="299" height="49" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="1090.5" y="816.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="middle">SourceMerger</text><line x1="40" y1="892" x2="1240" y2="892" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="921" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">F 只限制第一阶段；最终 fan-in = 非空文件组数，本实现不递归压成 F 路。</text></svg>