<rect x="40" y="828" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="828.0" x2="1240.0" y2="828.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
