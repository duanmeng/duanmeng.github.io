<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1328" viewBox="0 0 1800 1328" role="img"><title>Async stream：逻辑流串行推进，多个流共享 executor</title><desc>streamIdx 对齐 batchStreams_[i] 和 sources_[i]；一条流不固定绑定某个线程</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1800" height="1363" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Async stream：逻辑流串行推进，多个流共享 executor</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">streamIdx 对齐 batchStreams_[i] 和 sources_[i]；一条流不固定绑定某个线程</text><line x1="48" y1="125" x2="1752" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">Spill executor：有限 worker 执行多个 stream 的回调</text><text x="48" y="221" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">start() 为每条 stream 提交初始工作；后续等待队列空位时，通过 future.via(executor_) 继续。</text><rect x="1370" y="259.2871" width="382" height="917.7129" rx="5" fill="white" stroke="#39826d" stroke-width="1.55" /><text x="1392" y="300" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">LocalMerge Driver：</text><text x="1392" y="342" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">单线程 SourceMerger</text><text x="1392" y="480" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">next() 取走一个批次，通知 </text><text x="1392" y="509" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">producer；future 就绪后 </text><text x="1392" y="538" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">stream 才能继续读下一批。</text><text x="1392" y="945" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="start">实线：批次进入归并</text><text x="1392" y="987" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">虚线：空位通知与恢复</text><rect x="48" y="272" width="460" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="66" y="308" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Stream 0：nextBatch()</text><text x="48" y="374" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="408" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="309" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">Queue 0：enqueue(batch)</text><rect x="650" y="350" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="740.0" y="383" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="350" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="925.0" y="383" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="350" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="1110.0" y="383" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">…</text><text x="650" y="452" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="486" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,303 626,303" fill="none" stroke="#4078bd" stroke-width="1.85" marker-end="url(#a-blue)" /><polyline points="1200,376 1370,376" fill="none" stroke="#4078bd" stroke-width="1.85" marker-end="url(#a-blue)" /><polyline points="1370,497 1236,497 1236,535 555,535 555,320 508,320" fill="none" stroke="#4078bd" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-blue)" /><text x="650" y="562" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><rect x="48" y="583" width="460" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="66" y="619" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Stream 1：nextBatch()</text><text x="48" y="685" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="719" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="620" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">Queue 1：enqueue(batch)</text><rect x="650" y="661" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="740.0" y="694" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="661" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="925.0" y="694" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="661" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="1110.0" y="694" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">…</text><text x="650" y="763" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="797" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,614 626,614" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="1200,687 1370,687" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="1370,808 1236,808 1236,846 555,846 555,631 508,631" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-green)" /><text x="650" y="873" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><rect x="48" y="894" width="460" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="66" y="930" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Stream 2：nextBatch()</text><text x="48" y="996" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="1030" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="931" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">Queue 2：enqueue(batch)</text><rect x="650" y="972" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="740.0" y="1005" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="972" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="925.0" y="1005" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="972" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="1110.0" y="1005" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">…</text><text x="650" y="1074" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="1108" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,925 626,925" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="1200,998 1370,998" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="1370,1119 1236,1119 1236,1157 555,1157 555,942 508,942" fill="none" stroke="#8d76b7" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-purple)" /><text x="650" y="1184" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><line x1="48" y1="1224.9756" x2="1752" y2="1224.9756" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="1257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">async 在调度边界：等待背压不占线程；读文件与反序列化并不因此变成非阻塞 API</text><text x="48" y="1291" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">没有通用 AsyncStream 类；这里是一组 BatchStream + 队列 + continuation 构成的逻辑流。</text></svg>