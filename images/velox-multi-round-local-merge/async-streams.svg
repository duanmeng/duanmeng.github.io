<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1490" viewBox="0 0 1800 1490" role="img"><title>Async stream：逻辑流串行推进，多个流共享 executor</title><desc>streamIdx 对齐 batchStreams_[i] 和 sources_[i]；一条流不固定绑定某个线程</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1800" height="1490" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Async stream：逻辑流串行推进，多个流共享 executor</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">streamIdx 对齐 batchStreams_[i] 和 sources_[i]；一条流不固定绑定某个线程</text><line x1="48" y1="125" x2="1752" y2="125" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">Spill executor：有限 worker 执行多个 stream 的回调</text><text x="48" y="221" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">start() 为每条 stream 提交初始工作；后续等待队列空位时，通过 future.via(executor_) 继续。</text><rect x="1370" y="320" width="382" height="930" rx="5" fill="white" stroke="#39826d" stroke-width="1.5"/><text x="1392" y="373" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">LocalMerge Driver：</text><text x="1392" y="415" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">单线程 SourceMerger</text><text x="1392" y="553" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">next() 取走一个批次，通知 </text><text x="1392" y="582" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">producer；future 就绪后 </text><text x="1392" y="611" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#1f2d3d" font-weight="400" text-anchor="start">stream 才能继续读下一批。</text><text x="1392" y="1018" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="start">实线：批次进入归并</text><text x="1392" y="1060" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">虚线：空位通知与恢复</text><rect x="48" y="345" width="460" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="66" y="381" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Stream 0：nextBatch()</text><text x="48" y="447" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="481" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="382" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">Queue 0：enqueue(batch)</text><rect x="650" y="423" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="740.0" y="456.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="423" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="925.0" y="456.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="423" width="180" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="1110.0" y="456.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">…</text><text x="650" y="525" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="559" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,376 626,376" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#a-blue)"/><polyline points="1200,449 1370,449" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#a-blue)"/><polyline points="1370,570 1236,570 1236,608 555,608 555,393 508,393" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="650" y="635" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><rect x="48" y="656" width="460" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="66" y="692" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Stream 1：nextBatch()</text><text x="48" y="758" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="792" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="693" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">Queue 1：enqueue(batch)</text><rect x="650" y="734" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="740.0" y="767.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="734" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="925.0" y="767.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="734" width="180" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="1110.0" y="767.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">…</text><text x="650" y="836" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="870" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,687 626,687" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)"/><polyline points="1200,760 1370,760" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)"/><polyline points="1370,881 1236,881 1236,919 555,919 555,704 508,704" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-green)"/><text x="650" y="946" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><rect x="48" y="967" width="460" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="66" y="1003" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Stream 2：nextBatch()</text><text x="48" y="1069" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">同步文件读取与解码</text><text x="48" y="1103" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">该步仍然占用当前 worker</text><text x="650" y="1004" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">Queue 2：enqueue(batch)</text><rect x="650" y="1045" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="740.0" y="1078.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><rect x="835" y="1045" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="925.0" y="1078.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">batch</text><rect x="1020" y="1045" width="180" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1110.0" y="1078.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">…</text><text x="650" y="1147" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">未满：当前线程直接继续读取</text><text x="650" y="1181" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已满：挂 continuation，返回</text><polyline points="508,998 626,998" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)"/><polyline points="1200,1071 1370,1071" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)"/><polyline points="1370,1192 1236,1192 1236,1230 555,1230 555,1015 508,1015" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><text x="650" y="1257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">空位 → promise 完成 → continuation 回到 executor</text><line x1="48" y1="1350" x2="1752" y2="1350" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1384" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">async 在调度边界：等待背压不占线程；读文件与反序列化并不因此变成非阻塞 API</text><text x="48" y="1418" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">没有通用 AsyncStream 类；这里是一组 BatchStream + 队列 + continuation 构成的逻辑流。</text></svg>