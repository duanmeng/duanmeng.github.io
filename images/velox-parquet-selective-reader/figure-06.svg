<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img"><title>AddressBook：沿 schema path 计算 DL / RL</title><desc>旧式 repeated group；required 不增加 DL，optional / repeated 增加 DL，repeated 增加 RL。</desc><defs>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657386" /></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4078bd" /></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39826d" /></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d76b7" /></marker>
<marker id="arr-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac9c76" /></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a95f64" /></marker>
</defs><rect width="1280" height="780" fill="white" stroke="none" />
<text x="48" y="58" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">AddressBook：沿 schema path 计算 DL / RL</text>
<text x="48" y="94" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">旧式 repeated group；required 不增加 DL，optional / repeated 增加 DL，repeated 增加 RL。</text>
<line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1.6" />
<g class="card">
<rect x="440" y="155" width="400" height="95" rx="6" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.4" />
<text x="460" y="189" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">message AddressBook</text>
</g>
<g class="card">
<rect x="65" y="341" width="325" height="120" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="65" y1="341" x2="390.0" y2="341" stroke="#dce3ea" stroke-width="1.5" /><text x="85" y="375" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">required owner</text>
<text x="85" y="409" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">VARCHAR</text>
<text x="85" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">maxDL = 0 · maxRL = 0</text>
</g>
<g class="card">
<rect x="570" y="341" width="585" height="120" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="570" y1="341" x2="1155.0" y2="341" stroke="#dce3ea" stroke-width="1.5" /><text x="590" y="375" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">repeated contacts</text>
<text x="590" y="409" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">ARRAY(ROW(name, blockID))</text>
<text x="590" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">进入 repeated：DL + 1，RL + 1</text>
</g>
<polyline points="530,250 530,289 230,289 230,341" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)" />
<polyline points="740,250 740,289 850,289 850,341" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)" />
<g class="card">
<rect x="490" y="550" width="310" height="115" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4" />
<text x="510" y="584" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">required name</text>
<text x="510" y="618" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">maxDL = 1 · maxRL = 1</text>
</g>
<g class="card">
<rect x="875" y="550" width="355" height="115" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="875" y1="550" x2="1230.0" y2="550" stroke="#dce3ea" stroke-width="1.5" /><text x="895" y="584" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">optional blockID</text>
<text x="895" y="618" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">再增加一层 DL</text>
<text x="895" y="647" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">maxDL = 2 · maxRL = 1</text>
</g>
<polyline points="725,461 725,505 645,505 645,550" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)" />
<polyline points="1000,461 1000,505 1050,505 1050,550" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)" />
<line x1="48" y1="708" x2="1232" y2="708" stroke="#dce3ea" stroke-width="1.6" />
<text x="48" y="742" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">DL 区分“没有 contact”与“contact 的 blockID 为 null”；RL 区分新的 parent 与同一 parent 的后续元素。</text>
</svg>