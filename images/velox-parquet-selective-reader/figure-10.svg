<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="910" viewBox="0 0 1320 910"><title>read 先缩小行集合，getValues 再让所有列对齐</title><desc>nationkey 先存了 4 个值，regionkey 继续过滤后，最终只需要原 row 0。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="910" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">read 先缩小行集合，getValues 再让所有列对齐</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">nationkey 先存了 4 个值，regionkey 继续过滤后，最终只需要原 row 0。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="62" cy="147" r="18" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="62" y="154" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">1</text>
<text x="98" y="154" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#326cae">read：逐列过滤，但先不把所有列做成输出 Vector</text>
<text x="70" y="225" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">nationkey</text>
<rect x="350" y="195" width="89" height="48" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="394.5" y="226.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">0</text>
<rect x="444" y="195" width="89" height="48" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="488.5" y="226.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">1</text>
<rect x="538" y="195" width="89" height="48" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="582.5" y="226.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">2</text>
<rect x="632" y="195" width="89" height="48" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="676.5" y="226.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">3</text>
<text x="790" y="225" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#1f2d3d">暂存 values：[0,1,2,3]</text>
<text x="70" y="316" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">regionkey</text>
<rect x="350" y="286" width="89" height="48" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.3"/>
<text x="394.5" y="317.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2e7963">0</text>
<rect x="444" y="286" width="89" height="48" rx="4" fill="#fff" stroke="#dce3ea" stroke-width="1.3"/>
<text x="488.5" y="317.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#657386">1</text>
<rect x="538" y="286" width="89" height="48" rx="4" fill="#fff" stroke="#dce3ea" stroke-width="1.3"/>
<text x="582.5" y="317.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#657386">1</text>
<rect x="632" y="286" width="89" height="48" rx="4" fill="#fff" stroke="#dce3ea" stroke-width="1.3"/>
<text x="676.5" y="317.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#657386">1</text>
<text x="790" y="316" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2e7963">最终 outputRows：[0]</text>
<text x="70" y="407" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">name / comment</text>
<text x="350" y="407" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#657386">read 阶段可跳过，保留 loader 所需位置</text>
<circle cx="62" cy="497" r="18" fill="#f0f7f3" stroke="#39826d" stroke-width="1.3"/>
<text x="62" y="504" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2e7963">2</text>
<text x="98" y="504" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2e7963">getValues(outputRows)：压紧已有值，挂上延迟加载器</text>
<rect x="70" y="547" width="345" height="165" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="88" y="585" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">nationkey</text>
<text x="88" y="624" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">[0,1,2,3] → [0]</text>
<text x="88" y="652" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">依据最终 rows compact</text>
<rect x="475" y="547" width="345" height="165" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="493" y="585" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">regionkey</text>
<text x="493" y="624" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">[0] → FlatVector</text>
<text x="493" y="652" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">nulls 同步对齐</text>
<rect x="880" y="547" width="345" height="165" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="898" y="585" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">name / comment</text>
<text x="898" y="624" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">LazyVector(size=1)</text>
<text x="898" y="652" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">ColumnLoader(version, offset)</text>
<path d="M243 712V746H1052V712" fill="none" stroke="#657386" stroke-width="1.8" stroke-linejoin="round"/>
<text x="646" y="785" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2d3d">RowVector：所有 child 的逻辑长度均为 1</text>
<path d="M44 815L1276 815" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="836" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">两阶段分离允许后读的 filter 继续丢行，也使先读列只需按最终集合生成一次输出。</text>
</svg>