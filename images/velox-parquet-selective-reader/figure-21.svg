<text x="543" y="190" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#657386" font-weight="400" text-anchor="start">native call</text>
<polyline points="788,264 493,264" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="555" y="317" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#2e7963" font-weight="400" text-anchor="start">batch 状态 / 有效行</text>
