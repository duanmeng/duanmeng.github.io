<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040"><title>JVM 与 native reader：调用和数据分开放</title><desc>据原分享引用的公开论文重绘；该图描述接口关系，不代表当前 DBR 的全部实现。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="1040" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">JVM 与 native reader：调用和数据分开放</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">据原分享引用的公开论文重绘；该图描述接口关系，不代表当前 DBR 的全部实现。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="62" cy="151" r="18" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="62" y="158" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">1</text>
<text x="98" y="158" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#326cae">JVM：请求下一批，再逐列请求 column vector</text>
<rect x="55" y="205" width="330" height="118" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="73" y="243" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">Generated code</text>
<text x="73" y="282" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">访问堆外 column vectors</text>
<rect x="495" y="205" width="330" height="118" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="513" y="243" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">Vectorized reader</text>
<text x="513" y="282" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">request next batch</text>
<rect x="935" y="205" width="330" height="118" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="953" y="243" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">Column reader 1 … N</text>
<text x="953" y="282" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">request column vectors</text>
<path d="M385 259L495 259" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<path d="M825 259L935 259" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<rect x="55" y="467" width="430" height="246" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="73" y="505" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">Off-heap memory</text>
<text x="73" y="544" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">state 1 … state N</text>
<text x="73" y="572" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">data / dictionary IDs vectors</text>
<text x="73" y="600" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">nulls vectors</text>
<path d="M220 323L220 467" fill="none" stroke="#8d76b7" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-purple)" stroke-dasharray="7 5"/>
<rect x="122.5" y="368" width="195.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="220" y="390" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65537f">直接访问堆外 vector</text>
<rect x="715" y="485" width="510" height="165" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="733" y="523" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">Native reader</text>
<text x="733" y="562" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">接收 state / vector 指针</text>
<text x="733" y="590" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">解码 Parquet，填充堆外向量</text>
<path d="M1100 323V485" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<rect x="1041.0" y="385" width="118.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="1100" y="407" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#657386">native 调用</text>
<path d="M485 528L715 528" fill="none" stroke="#8d76b7" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-purple)" stroke-dasharray="7 5"/>
<rect x="522.5" y="491" width="155.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="600" y="513" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65537f">state / pointers</text>
<path d="M715 616L485 616" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<rect x="532.0" y="579" width="136.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="600" y="601" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#2e7963">values / nulls</text>
<rect x="715" y="788" width="510" height="105" rx="6" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.4"/>
<text x="733" y="826" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#877951">Raw Parquet data</text>
<text x="733" y="865" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">由 native reader 访问文件数据</text>
<path d="M955 788L955 650" fill="none" stroke="#ac9c76" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-warm)"/>
<rect x="907.0" y="726" width="96.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="955" y="748" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#877951">文件读取</text>
<path d="M44 915L1276 915" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="936" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">过滤列生成 selection / mask，后续 payload 列按 mask 解码；生成代码可以直接访问堆外向量。</text>
<text x="44" y="966" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">接口必须约定状态、值、字典索引、nulls 的布局和生命周期，不能只把 Java 对象换成 native 指针。</text>
</svg>