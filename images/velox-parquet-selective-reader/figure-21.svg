</g>
<g class="card">
<rect x="478" y="490" width="320" height="103" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="498" y="524" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="600" text-anchor="start">values / dictionary IDs</text>
<text x="498" y="558" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">数据与字典索引</text>
</g>
<g class="card">
<rect x="881" y="490" width="320" height="103" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="901" y="524" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="600" text-anchor="start">nulls / mask</text>
<text x="901" y="558" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">有效性与行选择</text>
</g>
<polyline points="260,290 260,415" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-blue)"/>
<polyline points="1009,290 1009,415" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-green)"/>
<line x1="48" y1="698" x2="1232" y2="698" stroke="#dce3ea" stroke-width="1.5"/>
<text x="48" y="732" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">共享指针并不自动产生延迟物化：上层访问次序与下层 decoder 必须约定相同的 selection 和 buffer 生命周期。</text>
</svg>