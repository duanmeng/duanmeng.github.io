<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">读操作沿 reader tree 递归；结构由容器节点维护，值保存在叶子列。</text>
