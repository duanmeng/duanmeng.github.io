<text x="893" y="743" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">FloatingPointColumnReader</text>
<text x="893" y="771" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">&lt;double, double&gt;</text>
<path d="M44 825L1276 825" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="846" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">c0 与 c1 是 ROW 的兄弟字段；MAP 下面有 key/value 两条 leaf stream，共三条叶子值流。</text>
