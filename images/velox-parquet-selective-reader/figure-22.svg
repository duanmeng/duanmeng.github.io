<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img"><title>Photon 计划片段：进入 native，再回到 JVM</title><desc>原分享的示例计划；Adapter / Transition 说明执行边界，不表示每个节点都被替换。</desc><defs>
