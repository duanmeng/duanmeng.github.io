<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030"><title>Photon 计划替换：哪些节点仍在 JVM</title><desc>按 Photon 论文中的示例重绘；箭头沿数据流方向，表示这份示例计划的执行边界。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="1030" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">Photon 计划替换：哪些节点仍在 JVM</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">按 Photon 论文中的示例重绘；箭头沿数据流方向，表示这份示例计划的执行边界。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="65" y="160" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#326cae">原 JVM 计划</text>
<text x="510" y="160" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#2e7963">转换后的计划</text>
<rect x="65" y="785" width="320" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="823" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">FileScan</text>
<path d="M225 785L225 680" fill="none" stroke="#4078bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="65" y="585" width="320" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="623" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">Filter</text>
<path d="M225 585L225 480" fill="none" stroke="#4078bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="65" y="385" width="320" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="423" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">Shuffle</text>
<path d="M225 385L225 280" fill="none" stroke="#4078bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="65" y="185" width="320" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="223" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">ToObject</text>
<rect x="510" y="785" width="300" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="528" y="823" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">FileScan</text>
<rect x="940" y="785" width="310" height="95" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="958" y="823" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">Adapter</text>
<rect x="940" y="585" width="310" height="95" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="958" y="623" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">PhotonFilter</text>
<rect x="940" y="385" width="310" height="95" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="958" y="423" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">PhotonShuffle</text>
<rect x="940" y="185" width="310" height="95" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="958" y="223" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">Transition</text>
<rect x="510" y="185" width="300" height="95" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="528" y="223" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">ToObject</text>
<path d="M810 832L940 832" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<path d="M940 232L810 232" fill="none" stroke="#4078bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<path d="M1095 785L1095 680" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<path d="M1095 585L1095 480" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<path d="M1095 385L1095 280" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<rect x="819.0" y="792" width="112.0" height="29" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="875" y="813" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#657386">进入 native</text>
<rect x="827.5" y="192" width="95.0" height="29" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="875" y="213" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#657386">回到 JVM</text>
<text x="510" y="484" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">JVM execution</text>
<text x="510" y="525" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#657386">保留 FileScan / ToObject</text>
<path d="M44 905L1276 905" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="926" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">Adapter / Transition 处理 JVM 与 Photon 的边界；不能从此图推断所有版本的 FileScan 都固定留在 JVM。</text>
<text x="44" y="956" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">它说明计划替换与数据表示转换的关系，不提供 Photon 内部 Parquet reader 的完整解码与预取策略。</text>
</svg>