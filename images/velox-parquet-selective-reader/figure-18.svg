<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="926" viewBox="0 0 1280 926" role="img"><title>ColumnReader 的完整继承链</title><desc>从左到右指向基类；第三列卡片内的箭头继续列出更上层基类。</desc><defs>
