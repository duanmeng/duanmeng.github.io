<text x="955" y="218" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">自己的 ctx / stats / reader</text>
</g>
