<text x="525" y="218" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">AsyncSource::prepare</text>
</g>
<line x1="650" y1="245" x2="650" y2="888" stroke="#657386" stroke-width="2.3" stroke-dasharray="7 5"/>
