<text x="844" y="352" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="start">footer → schema → rowReader</text>
<rect x="840" y="366" width="277.99999999999994" height="27" fill="white"/>
<text x="844" y="386" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="start">→ 首个 RowGroup I/O 计划</text>
