<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img"><title>Split preload：把准备好的扫描状态交给消费方</title><desc>AsyncSource 保存 DataSource 或准备异常；它与 coalesced data load 使用不同的结果协议。</desc><defs>
