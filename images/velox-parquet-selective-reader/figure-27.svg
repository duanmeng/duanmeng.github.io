<text x="675" y="673" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="start">AsyncSource 保存 item / exception_</text>
<polyline points="650,725 200,725" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-green)"/>
<rect x="214" y="692" width="313.99999999999994" height="27" fill="white"/>
<text x="218" y="712" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#2e7963" font-weight="400" text-anchor="start">通知；move() 取结果 / 重抛异常</text>
<g class="card">
<rect x="48" y="762" width="620" height="126" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="68" y="796" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">FileDataSource::setFromDataSource</text>
<text x="68" y="830" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">迁移 ScanSpec adaptation、split 与 reader</text>
<text x="68" y="859" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">重绑定 ConnectorQueryCtx，合并并接管 I/O stats</text>
</g>
<line x1="48" y1="946" x2="1232" y2="946" stroke="#dce3ea" stroke-width="1.5"/>
<text x="48" y="980" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">闭包持有 Task，保持 memory pools 存活；取消检查减少无用准备，但不抢占已经运行的底层 I/O。</text>
<text x="48" y="1011" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">成功接管不只移动 reader 指针：类型、过滤状态、统计对象和上下文都要一致。</text>
</svg>