<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900"><title>从 FilterKind 到模板实例：热循环里少做动态判断</title><desc>以读取 int64_t 并应用 BigintRange 为例；不同路径仍受 encoding、null、hook 与投影条件限制。</desc><defs>
