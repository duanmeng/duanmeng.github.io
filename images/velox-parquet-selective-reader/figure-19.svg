<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="754" viewBox="0 0 1280 754" role="img"><title>加载结束通知，与数据成功发布分开</title><desc>正常成功 / std::exception 路径；外部 cancel 不是抢占式 I/O 中断。</desc><defs>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657386" /></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4078bd" /></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39826d" /></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d76b7" /></marker>
<marker id="arr-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac9c76" /></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a95f64" /></marker>
</defs><rect width="1280" height="756" fill="white" stroke="none" />
<text x="48" y="58" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">加载结束通知，与数据成功发布分开</text>
<text x="48" y="94" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">正常成功 / std::exception 路径；外部 cancel 不是抢占式 I/O 中断。</text>
<line x1="48" y1="112.2424" x2="1232" y2="112.2424" stroke="#dce3ea" stroke-width="1.85" />
<g class="card">
<rect x="48" y="140" width="300" height="98" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<text x="68" y="174" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Planned</text>
<text x="68" y="208" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">尚无人执行</text>
</g>
<g class="card">
<rect x="490" y="140" width="300" height="98" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<text x="510" y="174" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Loading</text>
<text x="510" y="208" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">mutex 下唯一取得者</text>
</g>
<polyline points="348,189 490,189" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-muted)" />
<text x="367" y="166" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">loadOrFuture</text>
<g class="card">
<rect x="220" y="274" width="350" height="110" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<text x="240" y="308" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Loaded</text>
<text x="240" y="342" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">loadData 成功返回</text>
</g>
<g class="card">
<rect x="740" y="274" width="420" height="110" rx="6" fill="#fbf3f3" stroke="#a95f64" stroke-width="1.55" />
<text x="760" y="308" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#8d4f54" font-weight="600" text-anchor="start">Cancelled</text>
<text x="760" y="342" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">loadData 抛出 → 原线程 rethrow</text>
</g>
<polyline points="585,238 585,255.4043 395,255.4043 395,274" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-green)" />
<polyline points="695,238 695,255.4043 950,255.4043 950,274" fill="none" stroke="#a95f64" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-red)" />
<text x="80" y="447" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="start">两条路径都调用 setEndState，并在锁外 setValue(true)</text>
<g class="card">
<rect x="48" y="499" width="530" height="115" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="48" y1="499" x2="578.0" y2="499" stroke="#dce3ea" stroke-width="1.85" /><text x="68" y="533" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">等待者醒来：getData()</text>
<text x="68" y="567" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">仅 Loaded 可发布完整 buffer</text>
<text x="68" y="596" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">future ready 本身不代表读取成功</text>
</g>
<g class="card">
<rect x="690" y="499" width="540" height="115" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="690" y1="499" x2="1230.0" y2="499" stroke="#dce3ea" stroke-width="1.85" /><text x="710" y="533" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">非 Loaded → 空 buffer</text>
<text x="710" y="567" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">DirectInputStream 落到 loadSync</text>
<text x="710" y="596" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">失败则在消费调用栈抛出</text>
</g>
<polyline points="578,556 690,556" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-warm)" />
<line x1="48" y1="652" x2="1232" y2="652" stroke="#dce3ea" stroke-width="1.85" />
<text x="48" y="686" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">这里不使用 SharedPromise.setException；后台原始异常不会经这个 future 自动传给等待者。</text>
<text x="48" y="717" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">cancel 后进行中的 loadData 仍可能完成并写入 Loaded；图未把 Cancelled 画成不可离开的绝对终态。</text>
</svg>