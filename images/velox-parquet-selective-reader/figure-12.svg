<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="890" viewBox="0 0 1320 890"><title>remaining filter 之后，LazyVector 如何回到文件行号</title><desc>独立教学例：reader 已保留 batch rows=[2,5,8,9]；复杂表达式只让输出位置 1、3 通过。</desc><defs>
