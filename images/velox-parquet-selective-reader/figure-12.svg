<text x="718" y="519" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">payload 仍可为 LazyVector</text>
<text x="718" y="547" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">dictionary 只暴露选中位置</text>
<path d="M600 512L700 512" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<text x="60" y="658" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">ColumnLoader 映射</text>
<text x="410" y="658" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#65537f">outputRows[1] = 5；outputRows[3] = 9</text>
<text x="410" y="710" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#1f2d3d">payload reader 最终 read(rows=[5,9])</text>
<path d="M44 765L1276 765" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="786" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">Parquet 没有直接消费 remainingFilterColumns() 来统一禁止 lazy；表达式 eval 可触发加载。</text>
<text x="44" y="816" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">ColumnLoader 校验 version==numReads，禁止父 reader 已推进后再加载旧批次。</text>
