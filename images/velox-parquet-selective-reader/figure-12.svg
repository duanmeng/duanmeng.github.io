<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="693" viewBox="0 0 1280 693" role="img"><title>LazyVector：两份索引怎样组合</title><desc>reader filter 留下稀疏原始行；remaining filter 选择的是返回向量的位置。</desc><defs>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657386" /></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4078bd" /></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39826d" /></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d76b7" /></marker>
<marker id="arr-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac9c76" /></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a95f64" /></marker>
</defs><rect width="1280" height="694" fill="white" stroke="none" />
<text x="48" y="58" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">LazyVector：两份索引怎样组合</text>
<text x="48" y="94" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">reader filter 留下稀疏原始行；remaining filter 选择的是返回向量的位置。</text>
<line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1.85" />
<text x="48" y="163" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">原 batch 的通过行</text>
<rect x="380" y="133" width="173" height="54" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<text x="466.5" y="167" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">2</text>
<rect x="558" y="133" width="173" height="54" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<text x="644.5" y="167" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">5</text>
<rect x="736" y="133" width="173" height="54" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<text x="822.5" y="167" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">8</text>
<rect x="914" y="133" width="173" height="54" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<text x="1000.5" y="167" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">9</text>
<text x="48" y="240" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">LazyVector 逻辑位置</text>
<rect x="380" y="210" width="173" height="54" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<text x="466.5" y="244" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">0</text>
<rect x="558" y="210" width="173" height="54" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<text x="644.5" y="244" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">1</text>
<rect x="736" y="210" width="173" height="54" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<text x="822.5" y="244" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">2</text>
<rect x="914" y="210" width="173" height="54" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<text x="1000.5" y="244" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">3</text>
<polyline points="466,210 466,187" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arr-muted)" />
<polyline points="644,210 644,187" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arr-muted)" />
<polyline points="822,210 822,187" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arr-muted)" />
<polyline points="1000,210 1000,187" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#arr-muted)" />
<g class="card">
<rect x="48" y="300" width="455" height="127" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="48" y1="300" x2="503.0" y2="300" stroke="#dce3ea" stroke-width="1.85" /><text x="68" y="334" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">remaining filter</text>
<text x="68" y="368" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">selectedIndices = [1, 3]</text>
<text x="68" y="397" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">dictionary 包装在 lazy child 外</text>
</g>
<g class="card">
<rect x="664" y="300" width="566" height="127" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="664" y1="300" x2="1230.0" y2="300" stroke="#dce3ea" stroke-width="1.85" /><text x="684" y="334" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">ColumnLoader 映射</text>
<text x="684" y="368" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">effectiveRows[i] = outputRows[rows[i]]</text>
<text x="684" y="397" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">[1, 3] → [5, 9]</text>
</g>
<polyline points="503,366 664,366" fill="none" stroke="#8d76b7" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-purple)" />
<g class="card">
<rect x="48" y="463" width="455" height="130" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="48" y1="463" x2="503.0" y2="463" stroke="#dce3ea" stroke-width="1.85" /><text x="68" y="497" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">保持逻辑位置空间</text>
<text x="68" y="531" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">必要时 scatter 用 dictionary 包装</text>
<text x="68" y="560" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">未请求的位置不是额外已读结果</text>
</g>
<g class="card">
<rect x="664" y="463" width="566" height="130" rx="6" fill="white" stroke="none" stroke-width="1.4" />
<line x1="664" y1="463" x2="1230.0" y2="463" stroke="#dce3ea" stroke-width="1.85" /><text x="684" y="497" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">fieldReader.read(offset, [5, 9])</text>
<text x="684" y="531" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">读取所需 payload，再 getValues</text>
<text x="684" y="560" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">校验 version == parent.numReads()</text>
</g>
<polyline points="947,427 947,463" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-green)" />
<polyline points="664,528 503,528" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 5" marker-end="url(#arr-green)" />
<line x1="48" y1="623.5263" x2="1232" y2="623.5263" stroke="#dce3ea" stroke-width="1.85" />
<text x="48" y="656" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">未加载的旧 LazyVector 依赖父 reader 游标；父 reader 已前进后再加载会触发版本检查。</text>
</svg>