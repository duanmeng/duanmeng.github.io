<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">PageHeader 位于页体之前；RL/DL stream 与 encoded values 的布局依赖 page version。</text>
