<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850"><title>一次 next()：谁请求数据，谁返回 RowVector</title><desc>箭头上的文字区分调用与返回；TableScan 向同一 pipeline 的下游算子输出 batch。</desc><defs>
