<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">箭头上的文字区分调用与返回；TableScan 向同一 pipeline 的下游算子输出 batch。</text>
