<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="845" viewBox="0 0 1320 845"><title>延迟物化改变的是列读取顺序</title><desc>Spark LazyColumnVector、JVM/native reader 与 Photon 材料提供背景；下图表达共同的数据依赖。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="845" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">延迟物化改变的是列读取顺序</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">Spark LazyColumnVector、JVM/native reader 与 Photon 材料提供背景；下图表达共同的数据依赖。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="62" cy="151" r="18" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.3"/>
<text x="62" y="158" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#877951">1</text>
<text x="98" y="158" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#877951">先物化所有列，再执行 predicate</text>
<rect x="65" y="195" width="335" height="112" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="233" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">读取过滤列</text>
<text x="83" y="272" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">decode values</text>
<rect x="445" y="195" width="335" height="112" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="463" y="233" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">读取 payload</text>
<text x="463" y="272" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">decode 全部候选行</text>
<rect x="825" y="195" width="335" height="112" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="843" y="233" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">表达式过滤</text>
<text x="843" y="272" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">产生 selection</text>
<path d="M400 250L445 250" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<path d="M780 250L825 250" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<circle cx="62" cy="378" r="18" fill="#f0f7f3" stroke="#39826d" stroke-width="1.3"/>
<text x="62" y="385" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2e7963">2</text>
<text x="98" y="385" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2e7963">先读 predicate 所需列，再按 selection 读 payload</text>
<rect x="65" y="425" width="335" height="112" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="83" y="463" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#326cae">读取过滤列</text>
<text x="83" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">native 或 JVM reader</text>
<rect x="445" y="425" width="335" height="112" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="463" y="463" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2e7963">filter / mask</text>
<text x="463" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">筛出 row indices</text>
<rect x="825" y="425" width="335" height="112" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="843" y="463" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#65537f">读取 payload</text>
<text x="843" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">仅解码通过行</text>
<path d="M400 480L445 480" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)"/>
<path d="M780 480L825 480" fill="none" stroke="#39826d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
<text x="68" y="614" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1f2d3d">共同接口</text>
<text x="260" y="614" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#2e7963">列调度  →  selection  →  decoder  →  vector</text>
<text x="68" y="662" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1f2d3d">Velox 对应</text>
<text x="260" y="662" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#326cae">ScanSpec  →  RowSet  →  ColumnVisitor  →  LazyVector</text>
<path d="M44 720L1276 720" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="741" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">payload 的依赖方向必须从 predicate 指向 selection，再指向读取；只增加 lazy wrapper 不足以完成这条链。</text>
<text x="44" y="771" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">闭源产品的实际 I/O、缓存与解码策略不能从公开架构示意推断为与 Velox 相同。</text>
</svg>