<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1110" viewBox="0 0 1320 1110"><title>预取先开始时：查询线程等待同一个 CoalescedLoad</title><desc>实线＝调用；虚线＝返回 / 完成通知。对象列不代表独立线程。</desc><defs>
