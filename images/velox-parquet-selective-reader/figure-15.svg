<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">实线＝调用；虚线＝返回 / 完成通知。对象列不代表独立线程。</text>
