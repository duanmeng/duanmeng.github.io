<rect x="243.0" y="860" width="154.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="320.0" y="882" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#1f2d3d">getData(offset)</text>
<path d="M490 946L150 946" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-muted)" stroke-dasharray="7 5"/>
<rect x="249.0" y="913" width="142.0" height="30" rx="3" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="320.0" y="935" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#1f2d3d">LoadedBuffer</text>
<path d="M44 985L1276 985" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="1006" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">等待发生在 DirectInputStream 的调用栈上。这里没有向 Driver 返回 isBlocked future，也没有重新 enqueue Driver。</text>
<text x="44" y="1036" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">若查询线程先抢到 Planned 状态，则由查询线程执行 loadData；预取线程随后看到 Loading/Loaded。</text>
</svg>