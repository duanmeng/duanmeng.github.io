<text x="191" y="645" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#326cae">waitFuture.wait()</text>
<text x="191" y="677" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#326cae">查询线程同步阻塞</text>
