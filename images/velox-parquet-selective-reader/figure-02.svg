<text x="48" y="54" font-size="30" font-weight="700" fill="#1f2d3d">SelectiveReader 的五层职责</text>
<text x="48" y="88" font-size="18" fill="#657386">控制、裁剪、解码、I/O 与 Vector 组装是协作关系，不是一层包办所有优化。</text>
