<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850"><title>合并读取：少发请求的代价是读入 gap</title><desc>示意：A=[0,100) KiB，B=[150,200) KiB；距离阈值与合并字节预算都允许合并。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="850" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">合并读取：少发请求的代价是读入 gap</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">示意：A=[0,100) KiB，B=[150,200) KiB；距离阈值与合并字节预算都允许合并。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="60" y="166" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#657386">文件偏移 / KiB</text>
<text x="200" y="211" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#657386">0</text>
<text x="650" y="211" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#657386">100</text>
<text x="875" y="211" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#657386">150</text>
<text x="1100" y="211" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#657386">200</text>
<rect x="200" y="235" width="450" height="90" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="425" y="290" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#326cae">Region A：100 KiB</text>
<rect x="650" y="235" width="225" height="90" rx="6" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.4"/>
<text x="762" y="290" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#877951">gap：50 KiB</text>
<rect x="875" y="235" width="225" height="90" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="988" y="290" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2e7963">B：50 KiB</text>
<path d="M200 344V362H1100V344" fill="none" stroke="#657386" stroke-width="2" stroke-linejoin="round"/>
<text x="650" y="406" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2d3d">合并读取覆盖 200 KiB；有效请求 150 KiB；overread 50 KiB</text>
<circle cx="62" cy="480" r="18" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.3"/>
<text x="62" y="487" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#326cae">1</text>
<text x="98" y="487" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#326cae">enqueue：注册 Region，立即返回 stream</text>
<circle cx="62" cy="543" r="18" fill="#f0f7f3" stroke="#39826d" stroke-width="1.3"/>
<text x="62" y="550" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2e7963">2</text>
<text x="98" y="550" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2e7963">load：访问历史分类 → 按 offset 排序 → 分组</text>
<circle cx="62" cy="606" r="18" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.3"/>
<text x="62" y="613" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#65537f">3</text>
<text x="98" y="613" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#65537f">prefetch + executor：后台执行；其余按需执行</text>
<path d="M44 725L1276 725" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="746" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">prefetch 类使用 maxCoalesceBytes；sparse 类使用 loadQuantum 控制合并规模。</text>
<text x="44" y="776" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">单个 non-prefetch request 不创建合并任务；prefetch 范围内部的 sparse 请求还可能被 moveCoalesced 吸收。</text>
</svg>