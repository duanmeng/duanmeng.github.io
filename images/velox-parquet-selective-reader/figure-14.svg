<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="930" viewBox="0 0 1360 930">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#657386"/></marker><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#4078bd"/></marker><style>text{font-family:'Noto Sans SC','Noto Sans CJK SC',Inter,Arial,sans-serif} .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',monospace}</style></defs>
<rect width="1360" height="930" fill="#fff"/>
<text x="48" y="54" font-size="30" font-weight="700" fill="#1f2d3d">DirectBufferedInput：注册、分类、分组，再决定是否后台预取</text>
<text x="48" y="88" font-size="18" fill="#657386">enqueue 只登记 Region；load 根据 ScanTracker 的 adjusted read percentage 将请求分成 prefetchable 与 sparse。</text>
<line x1="48" y1="110" x2="1312" y2="110" stroke="#dce3ea" stroke-width="2"/>
<rect x="55" y="145" width="270" height="95" rx="8" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="73" y="176" font-size="19" font-weight="700" fill="#326cae" text-anchor="start" class="">Region A</text>
<text x="73" y="206" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">0–96K</text>
<rect x="370" y="145" width="270" height="95" rx="8" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="388" y="176" font-size="19" font-weight="700" fill="#2e7963" text-anchor="start" class="">Region B</text>
<text x="388" y="206" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">112–160K</text>
<rect x="685" y="145" width="270" height="95" rx="8" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="703" y="176" font-size="19" font-weight="700" fill="#65537f" text-anchor="start" class="">Region C</text>
<text x="703" y="206" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">420–480K</text>
<rect x="1000" y="145" width="270" height="95" rx="8" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/>
<text x="1018" y="176" font-size="19" font-weight="700" fill="#877951" text-anchor="start" class="">Region D</text>
<text x="1018" y="206" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">490–530K</text>
<rect x="55" y="330" width="375" height="150" rx="8" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="73" y="361" font-size="20" font-weight="700" fill="#326cae" text-anchor="start" class="">分类</text>
<text x="73" y="391" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">sequential / 高频 → prefetchable</text>
<text x="73" y="418" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">低 adjusted read % → sparse</text>
<text x="73" y="445" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">每类分别按 offset 排序</text>
<rect x="493" y="330" width="375" height="150" rx="8" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="511" y="361" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start" class="">groupRequests</text>
<text x="511" y="391" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">距离 ≤ maxCoalesceDistance</text>
<text x="511" y="418" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">prefetch：maxCoalesceBytes</text>
<text x="511" y="445" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">sparse：loadQuantum 限制过读</text>
<rect x="930" y="330" width="375" height="150" rx="8" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="948" y="361" font-size="20" font-weight="700" fill="#65537f" text-anchor="start" class="">readRegions</text>
<text x="948" y="391" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">创建 DirectCoalescedLoad</text>
<text x="948" y="418" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">建立 stream → load 映射</text>
<text x="948" y="445" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">仅 prefetch + executor 后台提交</text>
<line x1="430" y1="405" x2="493" y2="405" stroke="#657386" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="868" y1="405" x2="930" y2="405" stroke="#657386" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="95" y="610" width="520" height="150" rx="8" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="113" y="641" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start" class="">prefetch group</text>
<text x="113" y="671" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">A + B 可合并，中间 gap 计入 overread</text>
<text x="113" y="698" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">任务可由 executor 提前 load</text>
<rect x="745" y="610" width="520" height="150" rx="8" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/>
<text x="763" y="641" font-size="20" font-weight="700" fill="#877951" text-anchor="start" class="">sparse / on-demand</text>
<text x="763" y="671" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">C、D 受 loadQuantum 约束</text>
<text x="763" y="698" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start" class="">单个 non-prefetch request 首次消费时同步读</text>
<text x="55" y="850" font-size="18" font-weight="400" fill="#657386" text-anchor="start" class="">DirectCoalescedLoad 是一次合并加载任务；底层 ReadFile 可能面向远端存储，不能简单等同于“一次本地磁盘读取”。</text>
</svg>