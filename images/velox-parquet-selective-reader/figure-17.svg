<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820"><title>裁剪层次不同，省掉的工作也不同</title><desc>先看数据在哪一层被排除，再解释 storage bytes、解压、decode 与输出行数。</desc><defs>
<marker id="arr-muted" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657386"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4078bd"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39826d"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d76b7"/></marker>
<marker id="arr-warm" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac9c76"/></marker>
<marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95f64"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="820" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="44" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1f2d3d">裁剪层次不同，省掉的工作也不同</text>
<text x="44" y="87" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">先看数据在哪一层被排除，再解释 storage bytes、解压、decode 与输出行数。</text>
<path d="M44 111L1276 111" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="60" y="175" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1f2d3d">排除发生的位置</text>
<text x="455" y="175" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1f2d3d">存储读取</text>
<text x="750" y="175" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1f2d3d">解压 / decode</text>
<text x="1000" y="175" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#1f2d3d">物化与下游</text>
<rect x="48" y="224" width="1224" height="90" rx="6" fill="#f3f7fc" stroke="#dce3ea" stroke-width="1"/>
<text x="60" y="276" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#326cae">RowGroup 统计排除</text>
<text x="455" y="276" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">可跳过整组</text>
<text x="750" y="276" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">可跳过整组</text>
<text x="1000" y="276" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">无输出</text>
<rect x="48" y="336" width="1224" height="90" rx="6" fill="#f0f7f3" stroke="#dce3ea" stroke-width="1"/>
<text x="60" y="388" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2e7963">目标 RowSet 跳过 page</text>
<text x="455" y="388" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">依赖预取边界</text>
<text x="750" y="388" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">依赖页 / levels</text>
<text x="1000" y="388" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">减少</text>
<rect x="48" y="448" width="1224" height="90" rx="6" fill="#f7f4fb" stroke="#dce3ea" stroke-width="1"/>
<text x="60" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#65537f">page 内 Visitor filter</text>
<text x="455" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">不必然减少</text>
<text x="750" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">减少后续列工作</text>
<text x="1000" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">减少</text>
<rect x="48" y="560" width="1224" height="90" rx="6" fill="#faf7ef" stroke="#dce3ea" stroke-width="1"/>
<text x="60" y="612" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#877951">remaining filter + Lazy</text>
<text x="455" y="612" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">依赖实际加载</text>
<text x="750" y="612" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">payload 可少解码</text>
<text x="1000" y="612" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1f2d3d">减少</text>
<path d="M44 695L1276 695" fill="none" stroke="#dce3ea" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="716" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">压缩页已预取时，少 decode 几行并不会撤销已发生的网络读取；这仍可显著减少 CPU 与内存写入。</text>
<text x="44" y="746" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#657386">需同时观察输入 / 输出行数、rawBytes、overread、prefetch bytes 和 query-thread I/O latency。</text>
</svg>