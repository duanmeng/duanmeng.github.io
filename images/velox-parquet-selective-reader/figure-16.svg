<polyline points="1058,439 1058,513" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-purple)" />
<line x1="48" y1="676" x2="1232" y2="676" stroke="#dce3ea" stroke-width="1.6" />
<text x="48" y="710" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">shared allocation 由配置和 page-rounding 浪费阈值共同决定，不是所有大 request 都共享。</text>
<text x="48" y="741" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">duplicate region：shared 路径复用只读 slice；非 shared 路径为消费者准备副本。</text>
