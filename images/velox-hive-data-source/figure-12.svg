<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img"><title>动态过滤：先合并语义，再更新 reader 缓存</title><desc>动态条件按输出 channel 传递；可穿过 identity projection，不能任意穿过表达式变换。</desc><defs>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657386"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4078bd"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39826d"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d76b7"/></marker>
<marker id="arr-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac9c76"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a95f64"/></marker>
</defs><rect width="1280" height="1060" fill="white"/>
<text x="48" y="58" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">动态过滤：先合并语义，再更新 reader 缓存</text>
<text x="48" y="94" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">动态条件按输出 channel 传递；可穿过 identity projection，不能任意穿过表达式变换。</text>
<line x1="48" y1="118" x2="1232" y2="118" stroke="#dce3ea" stroke-width="1.5"/>
<g class="card">
<rect x="48" y="159" width="360" height="124" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="68" y="193" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">HashJoin / 其他生产者</text>
<text x="68" y="227" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">产生动态条件</text>
<text x="68" y="257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">在 Driver 内向上游寻找目标</text>
</g>
<g class="card">
<rect x="465" y="159" width="350" height="124" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="485" y="193" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">PushdownFilters</text>
<text x="485" y="227" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">静态条件 + 动态条件合并</text>
<text x="485" y="257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">按 channel 保存完整 filter</text>
</g>
<g class="card">
<rect x="872" y="159" width="360" height="124" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="892" y="193" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">TableScan</text>
<text x="892" y="227" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">addDynamicFilterLocked</text>
<text x="892" y="257" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">转交 DataSource</text>
</g>
<polyline points="408,222 465,222" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)"/>
<polyline points="815,222 872,222" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)"/>
<polyline points="1040,283 1040,351 640,351 640,406" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)"/>
<g class="card">
<rect x="48" y="406" width="1184" height="120" rx="6" fill="#f0f7f3" stroke="#39826d" stroke-width="1.4"/>
<text x="68" y="440" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">FileDataSource::addDynamicFilter(outputChannel, filter)</text>
<text x="68" y="474" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">ScanSpec.getChildByChannel → setFilter；resetCachedValues(true)；splitReader.resetFilterCaches()</text>
</g>
<polyline points="310,526 310,610" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)"/>
<polyline points="960,526 960,610" fill="none" stroke="#657386" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-muted)"/>
<g class="card">
<rect x="48" y="610" width="550" height="176" rx="6" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.4"/>
<text x="68" y="644" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">当前 active DataSource</text>
<text x="68" y="678" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">下一次 reader 使用更新的过滤状态</text>
<text x="68" y="708" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">不能回收已经返回给下游的 batch</text>
<text x="68" y="738" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">不保证取消已提交的 I/O</text>
</g>
<g class="card">
<rect x="680" y="610" width="552" height="176" rx="6" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.4"/>
<text x="700" y="644" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">后台准备的 split</text>
<text x="700" y="678" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">在共享过滤状态的读锁下创建 / addSplit</text>
<text x="700" y="708" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">接管时 moveAdaptationFrom(active spec)</text>
<text x="700" y="738" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">匹配的非常量节点迁移 filter 与代价统计</text>
</g>
<line x1="48" y1="956" x2="1232" y2="956" stroke="#dce3ea" stroke-width="1.5"/>
<text x="48" y="990" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">ScanSpec::setFilter 是替换节点 filter；静态与动态条件的合并发生在上游 PushdownFilters 维护流程。</text>
<text x="48" y="1021" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">预加载与 active reader 不共享一棵可并发推进的 ScanSpec；接管时按字段迁移状态，并重绑消费侧上下文。</text>
</svg>