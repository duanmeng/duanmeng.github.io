<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1270" viewBox="0 0 1440 1270" role="img"><title>动态过滤：先合并语义，再更新 reader 缓存</title><desc>动态条件按输出 channel 传递；可穿过 identity projection，不能任意穿过表达式变换。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1270" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">动态过滤：先合并语义，再更新 reader 缓存</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">动态条件按输出 channel 传递；可穿过 identity projection，不能任意穿过表达式变换。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><line x1="48" y1="150" x2="474" y2="150" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">HashJoin / 其他生产者</text><text x="48" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">产生动态条件</text><text x="48" y="251" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">在 Driver 内向上游寻找目标</text><line x1="505" y1="150" x2="931" y2="150" stroke="#dce3ea" stroke-width="1.5"/><text x="505" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">PushdownFilters</text><text x="505" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">静态条件 + 动态条件合并</text><text x="505" y="251" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">按 channel 保存完整 filter</text><line x1="962" y1="150" x2="1388" y2="150" stroke="#dce3ea" stroke-width="1.5"/><text x="962" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">TableScan</text><text x="962" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">addDynamicFilterLocked</text><text x="962" y="251" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">转交 DataSource</text><polyline points="445,165 495,165" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)"/><polyline points="906,165 952,165" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#a-blue)"/><text x="48" y="391" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">FileDataSource::addDynamicFilter(outputChannel, filter)</text><text x="48" y="432" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">ScanSpec.getChildByChannel → setFilter；resetCachedValues(true)；splitReader.resetFilterCaches()</text><rect x="48" y="506" width="331" height="54" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="213.5" y="540.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">channel → child</text><rect x="384" y="506" width="331" height="54" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="549.5" y="540.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">setFilter</text><rect x="720" y="506" width="331" height="54" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="885.5" y="540.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#877951" font-weight="400" text-anchor="middle">reset values</text><rect x="1056" y="506" width="331" height="54" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1221.5" y="540.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">reset reader cache</text><text x="48" y="632" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">已经运行的 reader</text><text x="795" y="632" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">独立准备的 reader</text><rect x="48" y="674" width="598" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="66" y="710" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">当前 active DataSource</text><rect x="795" y="674" width="597" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="813" y="710" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">后台准备的 split</text><text x="48" y="781" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">下一次 reader 使用更新的过滤状态</text><text x="48" y="815" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不能回收已经返回给下游的 batch</text><text x="48" y="849" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不保证取消已提交的 I/O</text><text x="795" y="781" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">在共享过滤状态的读锁下创建 / addSplit</text><text x="795" y="815" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">接管时 moveAdaptationFrom(active spec)</text><text x="795" y="849" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">匹配的非常量节点迁移 filter 与代价统计</text><rect x="48" y="930" width="598" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="347.0" y="960.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">active ScanSpec</text><rect x="795" y="930" width="597" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1093.5" y="960.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">prepared ScanSpec</text><polyline points="646,953 795,953" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-green)"/><text x="720" y="1015" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">接管时按同名、非常量 child 迁移适配反馈</text><line x1="48" y1="1110" x2="1392" y2="1110" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1144" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">ScanSpec::setFilter 是替换节点 filter；静态与动态条件的合并发生在上游 PushdownFilters 维护流程。</text><text x="48" y="1178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">预加载与 active reader 不共享一棵可并发推进的 ScanSpec；接管时按字段迁移状态，并重绑消费侧上下文。</text></svg>