<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img"><title>next 的返回协议：空 batch 不等于 split 耗尽</title><desc>接口类型为 optional&lt;RowVectorPtr&gt;；TableScan 的主循环区分下面四种结果。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="987" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">next 的返回协议：空 batch 不等于 split 耗尽</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">接口类型为 optional&lt;RowVectorPtr&gt;；TableScan 的主循环区分下面四种结果。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">TableScan → DataSource::next(readBatchSize, future)</text><text x="48" y="219" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">当前 FileDataSource 是同步实现，future 参数未使用；接口本身允许其他 connector 异步返回。</text><rect x="48" y="270" width="374" height="69" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="235.0" y="311.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="400" text-anchor="middle">nullopt</text><text x="510" y="294" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">暂时没有结果</text><text x="510" y="328" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">future 表示继续执行条件</text><text x="510" y="362" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">kWaitForConnector</text><polyline points="422,305 490,305" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><rect x="48" y="413" width="374" height="69" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="235.0" y="454.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">optional(nullptr)</text><text x="510" y="437" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">当前 split 已耗尽</text><text x="510" y="471" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">splitFinished()</text><text x="510" y="505" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">下一次取新 split</text><polyline points="422,448 490,448" fill="none" stroke="#ac9c76" stroke-width="1.85" marker-end="url(#a-warm)" /><rect x="48" y="556" width="374" height="69" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="235.0" y="597.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">RowVector(size = 0)</text><text x="510" y="580" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">推进过输入，但无人通过</text><text x="510" y="614" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">仍在当前 split 内</text><text x="510" y="648" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">继续扫描或按时让出线程</text><polyline points="422,591 490,591" fill="none" stroke="#4078bd" stroke-width="1.85" marker-end="url(#a-blue)" /><rect x="48" y="699" width="374" height="69" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="235.0" y="740.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="400" text-anchor="middle">RowVector(size &gt; 0)</text><text x="510" y="723" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">一个可交给下游的 batch</text><text x="510" y="757" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">可能带 Lazy / Dictionary</text><text x="510" y="791" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">处理后再推进 reader</text><polyline points="422,734 490,734" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><line x1="48" y1="833.0233" x2="1392" y2="833.0233" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="865" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Task 没有 ready split、主动 yield、scan scale-up 是另外的等待来源</text><text x="48" y="899" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">getOutput() 返回 nullptr 只是“本次没有结果”；Driver 还要检查 isBlocked() 与 isFinished()。</text><text x="48" y="933" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">future 交给 Driver 的路径才可能让 Driver 离开工作线程；同步 I/O 或 AsyncSource::move().wait() 会占用当前线程。</text></svg>