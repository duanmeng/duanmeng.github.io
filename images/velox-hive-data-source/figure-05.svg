<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" role="img"><title>Subfield pruning 保留的是所有消费者的并集</title><desc>例：输出 s.a，WHERE 使用 s.b；另有 m[&quot;x&quot;] 与 arr[2] / arr[5] 的读取要求。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1420" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Subfield pruning 保留的是所有消费者的并集</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">例：输出 s.a，WHERE 使用 s.b；另有 m[&quot;x&quot;] 与 arr[2] / arr[5] 的读取要求。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="174" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">ROW s(a, b, c)</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">投影需要 a</text><text x="48" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">remaining filter 需要 b</text><rect x="48" y="311" width="370" height="57" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="233.0" y="346.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">s : ROW</text><polyline points="418,339 490,339" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#a-blue)"/><rect x="511" y="281" width="855" height="55" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="938.5" y="315.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">s.a：读取</text><rect x="511" y="356" width="855" height="55" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="938.5" y="390.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="400" text-anchor="middle">s.b：读取并参与表达式</text><rect x="511" y="431" width="855" height="55" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="938.5" y="465.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="middle">s.c：查询内部用 null 占位</text><text x="48" y="442" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">保留 ROW 形状</text><text x="48" y="535" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">MAP m</text><text x="48" y="578" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">只要求 key = &quot;x&quot;</text><text x="48" y="612" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不是 WHERE m = &quot;x&quot;</text><text x="734" y="535" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">裁剪 map entries</text><rect x="734" y="562" width="306" height="51" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="887.0" y="594.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">key x</text><rect x="1045" y="562" width="306" height="51" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1198.0" y="594.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">其他 key</text><rect x="734" y="629" width="306" height="51" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="887.0" y="661.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">所需 values</text><rect x="1045" y="629" width="306" height="51" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1198.0" y="661.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">不物化</text><text x="48" y="697" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">keys：安装 key selection</text><text x="48" y="731" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">values：保留必要 subfields</text><text x="48" y="765" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不能直接当作父行 WHERE</text><text x="48" y="856" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">ARRAY arr</text><text x="48" y="900" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">要求下标 2 与 5</text><text x="48" y="934" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">SQL 下标从 1 开始</text><rect x="620" y="880" width="121" height="46" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="680.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">1</text><rect x="746" y="880" width="121" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="806.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">2</text><rect x="872" y="880" width="121" height="46" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="932.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">3</text><rect x="998" y="880" width="121" height="46" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1058.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">4</text><rect x="1124" y="880" width="121" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1184.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">5</text><rect x="1250" y="880" width="121" height="46" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5"/><text x="1310.5" y="910.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="middle">…</text><line x1="620" y1="946" x2="1245" y2="946" stroke="#8d76b7" stroke-width="2"/><text x="624" y="982" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#65537f" font-weight="400" text-anchor="start">读取前 5 个元素，保留消费所需位置</text><text x="48" y="1045" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">限制元素前缀</text><text x="48" y="1086" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">maxArrayElementsCount = 5</text><text x="48" y="1120" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不是随机直取第 2 / 5 个字节</text><text x="48" y="1154" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">通配符要求会取消此限制</text><line x1="48" y1="1230" x2="1392" y2="1230" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1264" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">只要某个消费者需要整个父字段，就不能继续裁掉它的 children</text><text x="48" y="1298" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">requiredSubfields = 所有访问的约定；被剪掉的 s.c 不是文件事实上的 null。</text><text x="48" y="1332" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">普通 ROW subfield filters 与 ARRAY / MAP 元素裁剪的父行语义不同，不能混用。</text><text x="48" y="1366" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">路径与类型共同决定裁剪行为；缺少依赖列会改变查询结果，而不仅仅影响性能。</text></svg>