<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img"><title>查询要求怎样编译成 ScanSpec 与 ExprSet</title><desc>投影、reader filter、表达式依赖可以落在同一列上；不是三套互斥列集合。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1150" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">查询要求怎样编译成 ScanSpec 与 ExprSet</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">投影、reader filter、表达式依赖可以落在同一列上；不是三套互斥列集合。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><line x1="48" y1="149" x2="468" y2="149" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">SELECT / assignments</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">name、comment、ds</text><text x="48" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">requiredSubfields</text><line x1="510" y1="149" x2="930" y2="149" stroke="#dce3ea" stroke-width="1.5"/><text x="510" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">WHERE 可提取部分</text><text x="510" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">ds = 09-01</text><text x="510" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">nationkey BETWEEN 0 AND 3</text><line x1="972" y1="149" x2="1392" y2="149" stroke="#dce3ea" stroke-width="1.5"/><text x="972" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">WHERE 剩余部分</text><text x="972" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">nationkey + regionkey ≥ 4</text><text x="972" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">compile → ExprSet → </text><text x="972" y="279" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">distinctFields</text><text x="48" y="357" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#877951" font-weight="600" text-anchor="start">makeScanSpec：先内部投影列，再补 filter-only 列</text><text x="48" y="400" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">合并 requiredSubfields 与表达式 subfields；用表 schema 解析隐藏过滤字段的类型</text><polyline points="720,441 720,475" fill="none" stroke="#ac9c76" stroke-width="1.8" marker-end="url(#a-warm)"/><rect x="48" y="491" width="321" height="60" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="208.5" y="528.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="400" text-anchor="middle">name / comment</text><rect x="388" y="491" width="321" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="548.5" y="528.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#877951" font-weight="400" text-anchor="middle">ds</text><rect x="728" y="491" width="321" height="60" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="888.5" y="528.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="400" text-anchor="middle">nationkey</text><rect x="1068" y="491" width="321" height="60" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1228.5" y="528.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="400" text-anchor="middle">regionkey</text><line x1="48" y1="640" x2="1392" y2="640" stroke="#dce3ea" stroke-width="1.5"/><text x="59" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">projectOut = true</text><text x="399" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">split 后安装常量</text><text x="739" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">range filter + projectOut</text><text x="1079" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">projectOut = true</text><line x1="48" y1="722" x2="1392" y2="722" stroke="#dce3ea" stroke-width="1.5"/><text x="59" y="691" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">无 reader filter</text><text x="399" y="691" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">分区 filter</text><text x="739" y="691" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">读时缩小 RowSet</text><text x="1079" y="691" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">供 ExprSet 使用</text><line x1="48" y1="804" x2="1392" y2="804" stroke="#dce3ea" stroke-width="1.5"/><text x="59" y="773" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">可创建 LazyVector</text><text x="399" y="773" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">无需读文件列</text><text x="739" y="773" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">保留值供加法使用</text><text x="1079" y="773" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">按需触发加载</text><line x1="48" y1="903" x2="1392" y2="903" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="932" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">另例：SELECT name WHERE nationkey BETWEEN 0 AND 3</text><text x="48" y="970" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">此时 nationkey 只需筛行，可为 filter-only；主例因加法需要它，必须保留值。</text><line x1="48" y1="1054" x2="1392" y2="1054" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1088" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">MetadataFilter 还能利用统计排除不可能命中的读取单元，但不能替代 remaining ExprSet 的精确行过滤。</text></svg>