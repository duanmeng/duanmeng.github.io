<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="989" viewBox="0 0 1440 989" role="img"><title>查询、split、batch：三种状态不能混在一起</title><desc>框内是持有的状态；箭头表示外层对象推进内层生命周期。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1008" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">查询、split、batch：三种状态不能混在一起</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">框内是持有的状态；箭头表示外层对象推进内层生命周期。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><rect x="48" y="148" width="32" height="34" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="64.0" y="172" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="middle">1</text><text x="96" y="175" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">DataSource：跨多个 split 存活</text><text x="48" y="215" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="600" text-anchor="start">查询要求与累计反馈</text><text x="48" y="252" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">outputType / assignments → ScanSpec / remaining ExprSet；过滤代价、动态条件、累计 I/O 统计</text><polyline points="262,318 1373,318" fill="none" stroke="#657386" stroke-width="1.85" marker-end="url(#a-muted)" /><text x="1190" y="304" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">执行推进 →</text><rect x="263" y="347" width="1080" height="57" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="803.0" y="382.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">同一个 DataSource：ScanSpec / ExprSet / 累计反馈</text><rect x="48" y="426" width="32" height="34" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="64.0" y="450" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#877951" font-weight="400" text-anchor="middle">2</text><text x="96" y="453" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#877951" font-weight="600" text-anchor="start">SplitReader：绑定当前文件范围</text><rect x="263" y="490" width="527" height="55" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="526.5" y="524.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#877951" font-weight="400" text-anchor="middle">Split A</text><rect x="855" y="490" width="488" height="55" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="1099.0" y="524.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#877951" font-weight="400" text-anchor="middle">Split B</text><text x="263" y="587" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">partition ds = 09-01；旧 schema</text><text x="263" y="621" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Reader / RowReader / 打开文件与输入</text><text x="855" y="587" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">partition ds = 09-02；新 schema</text><text x="855" y="621" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">重绑常量和类型；预加载时移交状态</text><polyline points="790,517 855,517" fill="none" stroke="#ac9c76" stroke-width="1.85" marker-end="url(#a-warm)" /><text x="828" y="466" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#877951" font-weight="400" text-anchor="middle">A 耗尽后才切到 B</text><line x1="820" y1="415" x2="820" y2="866" stroke="#657386" stroke-width="2" stroke-dasharray="7 6" /><text x="48" y="722" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">批次 / 读取版本</text><rect x="263" y="682" width="250" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="281" y="718" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Batch A₀</text><text x="263" y="781" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">rows → reader </text><text x="263" y="810" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">filters</text><text x="263" y="844" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">→ ExprSet</text><rect x="539" y="682" width="251" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="557" y="718" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Batch A₁</text><text x="539" y="781" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">LazyVector</text><text x="539" y="815" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">绑定本次 reader 版本</text><rect x="855" y="682" width="488" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="873" y="718" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Batch B₀</text><text x="855" y="781" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">新文件、新常量、新游标</text><polyline points="386,641 386,682" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="663,641 663,682" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="1097,641 1097,682" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><line x1="48" y1="885.6" x2="1392" y2="885.6" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="918" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">ScanSpec 会跨 batch / split 保留适配反馈，但当前 split 的常量与 reader 不能当成全查询不变状态。</text><text x="48" y="952" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">未加载的旧 LazyVector 依赖旧 reader 版本；不能先推进 reader，再回来任意加载旧 batch。</text></svg>