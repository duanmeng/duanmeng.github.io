<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1115" viewBox="0 0 1440 1115" role="img"><title>Schema evolution：既要识别字段，也要恢复 split 状态</title><desc>上半图采用 name mapping；下半图说明嵌套字段按 position 匹配时的不同结果。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1170" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Schema evolution：既要识别字段，也要恢复 split 状态</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">上半图采用 name mapping；下半图说明嵌套字段按 position 匹配时的不同结果。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><line x1="48" y1="149" x2="647" y2="149" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">旧文件 A：没有 extra</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">目标：ROW(id BIGINT, extra VARCHAR)</text><text x="48" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">ScanSpec.extra = null constant</text><text x="48" y="284" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">WHERE extra IS NOT NULL 可排除 A</text><line x1="795" y1="149" x2="1391" y2="149" stroke="#dce3ea" stroke-width="1.85" /><text x="795" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">新文件 B：extra 已存在</text><text x="795" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">清除前一 split 的 constantValue</text><text x="795" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">按 B 的 file schema 建立 reader</text><text x="795" y="284" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不能继续复用 A 的 null 判定</text><polyline points="654,245 784,245" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><text x="48" y="360" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">同一个 DataSource，逐个处理 split</text><rect x="48" y="419" width="32" height="34" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="64.0" y="443" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="middle">1</text><text x="96" y="446" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">文件：name(first, last) = (Janet, Jones)</text><text x="48" y="488" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">请求：name(first, middle, last)</text><text x="48" y="530" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">新增 middle 插在两个已有字段之间；下面两种模式的字段身份规则不同。</text><text x="48" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">按 name 匹配</text><text x="792" y="609" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">按 position 匹配</text><rect x="48" y="657" width="240" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="168.0" y="690" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">first</text><rect x="293" y="657" width="240" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="413.0" y="690" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">last</text><rect x="48" y="795" width="191" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="143.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">first</text><rect x="244" y="795" width="191" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="339.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">middle</text><rect x="440" y="795" width="191" height="52" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="535.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">last</text><rect x="48" y="713" width="240" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="168.0" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Janet</text><rect x="293" y="713" width="240" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="413.0" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Jones</text><rect x="792" y="657" width="240" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="912.0" y="690" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">first</text><rect x="1037" y="657" width="240" height="52" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="1157.0" y="690" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">last</text><rect x="792" y="795" width="191" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="887.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">first</text><rect x="988" y="795" width="191" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="1083.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">middle</text><rect x="1184" y="795" width="191" height="52" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="1279.5" y="828" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">last</text><rect x="792" y="713" width="240" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="912.0" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Janet</text><rect x="1037" y="713" width="240" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="1157.0" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Jones</text><polyline points="166,759 146,795" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="416,759 540,795" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="910,759 890,795" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><polyline points="1160,759 1088,795" fill="none" stroke="#8d76b7" stroke-width="1.85" marker-end="url(#a-purple)" /><text x="48" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">first = Janet；middle = null</text><text x="48" y="936" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">last = Jones</text><text x="48" y="970" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">字段名决定身份</text><text x="792" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">first = Janet；middle = Jones</text><text x="792" y="936" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">last = null</text><text x="792" y="970" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">位置决定身份，不是按名字补中间字段</text><line x1="48" y1="1012.1515" x2="1392" y2="1012.1515" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="1044" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">columnMappingMode 优先取 split 指定值，否则由 session 配置选择 name / position。</text><text x="48" y="1078" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">field ID 模式还需要对应格式的 ID 元数据与请求 ID 树；类型提升、嵌套 nullness 继续由格式 reader 处理。</text></svg>