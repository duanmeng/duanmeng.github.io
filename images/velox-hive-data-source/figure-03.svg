<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1302" viewBox="0 0 1440 1302" role="img"><title>同一列在四个 schema 中的身份</title><desc>主例：SELECT name AS country, comment, ds；WHERE 还需要 nationkey 与 regionkey。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1302" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">同一列在四个 schema 中的身份</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">主例：SELECT name AS country, comment, ds；WHERE 还需要 nationkey 与 regionkey。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><rect x="48" y="147" width="32" height="34" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="64.0" y="171.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="middle">1</text><text x="96" y="174" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">计划输出 outputType：面向下游算子</text><rect x="48" y="216" width="267" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="181.5" y="251.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">country VARCHAR</text><rect x="320" y="216" width="267" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="453.5" y="251.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">comment VARCHAR</text><rect x="592" y="216" width="267" height="56" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="725.5" y="251.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">ds VARCHAR</text><text x="48" y="362" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">assignments：country → regular(name)；comment → regular(comment)；ds → partition(ds)</text><rect x="48" y="380" width="32" height="34" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="64.0" y="404.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">2</text><text x="96" y="407" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">readerOutputType：面向 connector 内部 ExprSet</text><rect x="48" y="448" width="263" height="58" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="179.5" y="484.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">0: name</text><rect x="316" y="448" width="263" height="58" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="447.5" y="484.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">1: comment</text><rect x="584" y="448" width="263" height="58" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="715.5" y="484.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#877951" font-weight="400" text-anchor="middle">2: ds</text><rect x="852" y="448" width="263" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="983.5" y="484.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">nationkey</text><rect x="1120" y="448" width="263" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1251.5" y="484.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="middle">regionkey</text><text x="48" y="555" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">前缀保留输出位置</text><text x="48" y="594" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">0: name   1: comment   2: ds</text><text x="48" y="628" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">名字还原，输出 channel 的顺序不变</text><text x="855" y="555" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">追加表达式依赖</text><text x="855" y="594" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">nationkey、regionkey</text><text x="855" y="628" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">两列对 SQL 隐藏，对 ExprSet 可见</text><polyline points="182,272 182,304" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><polyline points="454,272 454,304" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><polyline points="726,272 726,304" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="48" y="330" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#326cae" font-weight="400" text-anchor="start">按 assignments 建立下列字段身份映射</text><rect x="48" y="717" width="32" height="34" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="64.0" y="741.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#877951" font-weight="400" text-anchor="middle">3</text><text x="96" y="744" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#877951" font-weight="600" text-anchor="start">文件事实与 reader 目标视图分开</text><rect x="48" y="788" width="602" height="60" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="66" y="824" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">baseReader → fileType</text><text x="48" y="893" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">实际文件字段名、类型与层级</text><text x="48" y="927" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">ds 无需存在于文件；country 是别名</text><text x="48" y="961" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">字段识别先服从 name / position / ID 模式</text><rect x="786" y="788" width="606" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="804" y="824" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">getAdaptedRowType → requestedType</text><text x="786" y="893" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">保留 baseReader 文件字段名</text><text x="786" y="927" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">adaptColumns 调整已有字段目标类型</text><text x="786" y="961" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">缺失列 / 分区列在 ScanSpec 中装常量</text><polyline points="650,818 786,818" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><rect x="48" y="1035" width="145" height="46" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="120.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#877951" font-weight="400" text-anchor="middle">name</text><rect x="198" y="1035" width="145" height="46" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="270.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#877951" font-weight="400" text-anchor="middle">comment</text><rect x="348" y="1035" width="145" height="46" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="420.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#877951" font-weight="400" text-anchor="middle">nationkey</text><rect x="498" y="1035" width="145" height="46" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="570.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#877951" font-weight="400" text-anchor="middle">regionkey</text><rect x="786" y="1035" width="145" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="858.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="middle">name</text><rect x="936" y="1035" width="145" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1008.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="middle">comment</text><rect x="1086" y="1035" width="145" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1158.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="middle">nationkey</text><rect x="1236" y="1035" width="145" height="46" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1308.5" y="1065.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#65537f" font-weight="400" text-anchor="middle">regionkey</text><text x="48" y="1124" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#877951" font-weight="400" text-anchor="start">文件字段身份</text><text x="786" y="1124" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#65537f" font-weight="400" text-anchor="start">同名字段的目标类型；常量由 ScanSpec 提供</text><line x1="48" y1="1180" x2="1392" y2="1180" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1214" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">readerOutputType 描述要产出的内部列；requestedType 是适配后的文件类型视图，两者不能直接画等号。</text><text x="48" y="1248" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">这里的 ROW / VARCHAR / BIGINT 都是 Velox 逻辑 Type；文件物理编码与 C++ 解码类型在 reader 层关联。</text></svg>