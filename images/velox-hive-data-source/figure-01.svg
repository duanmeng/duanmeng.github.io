<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1345" viewBox="0 0 1440 1345" role="img"><title>HiveDataSource 在执行引擎与文件格式之间</title><desc>虚线表示调用；带「继承」标注的箭头指向基类；绿色箭头表示批数据返回。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1362" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">HiveDataSource 在执行引擎与文件格式之间</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">虚线表示调用；带「继承」标注的箭头指向基类；绿色箭头表示批数据返回。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="174" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">执行调度与 connector 创建</text><rect x="48" y="203" width="440" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="66" y="239" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Task → TableScan</text><text x="48" y="304" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Task 供应 splits</text><text x="48" y="338" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">TableScan 推进 addSplit / next</text><rect x="940" y="203" width="452" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" /><text x="958" y="239" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">HiveConnector</text><text x="940" y="304" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">createDataSource()</text><text x="940" y="338" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">提供 factory、config、IO executor</text><polyline points="488,233 940,233" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><text x="658" y="219" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">创建</text><text x="48" y="418" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">DataSource 持有查询状态，并绑定当前 split</text><rect x="48" y="449" width="1344" height="380" rx="5" fill="white" stroke="#dce3ea" stroke-width="1.55" /><rect x="76" y="478" width="565" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="94" y="514" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">FileDataSource : DataSource</text><text x="76" y="578" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">编译 ScanSpec / ExprSet</text><text x="76" y="612" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">整理输出、动态过滤、统计</text><rect x="76" y="671" width="565" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="94" y="707" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">HiveDataSource</text><text x="76" y="769" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">bucket conversion / rowId</text><text x="76" y="803" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">createSplitReader()</text><polyline points="358,671 358,640 632,640 632,538" fill="none" stroke="#39826d" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-green)" /><text x="498" y="629" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#2e7963" font-weight="400" text-anchor="start">继承</text><rect x="811" y="478" width="548" height="60" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="829" y="514" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">FileSplitReader</text><text x="811" y="578" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">打开文件、适配、整 split 判断</text><text x="811" y="612" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">持有 Reader / RowReader</text><rect x="811" y="671" width="548" height="60" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="829" y="707" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">HiveSplitReader</text><text x="811" y="769" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">分区 / synthesized columns</text><text x="811" y="803" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">bucket 行过滤</text><polyline points="1084,671 1084,640 1348,640 1348,538" fill="none" stroke="#ac9c76" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-warm)" /><text x="1215" y="629" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#877951" font-weight="400" text-anchor="start">继承</text><polyline points="641,701 811,701" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><polyline points="1133,365 1133,375 36,375 36,701 76,701" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><text x="48" y="866" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">格式内的扫描与字节读取</text><rect x="76" y="908" width="558" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="94" y="944" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">格式 Reader → RowReader</text><text x="76" y="1003" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Parquet / DWRF / Nimble / …</text><text x="76" y="1037" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">schema、split range、读取单元</text><rect x="803" y="908" width="556" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" /><text x="821" y="944" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">ColumnReader / decoder</text><text x="803" y="1003" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">筛选候选行、解码、LazyVector</text><text x="803" y="1037" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">具体能力取决于文件格式</text><polyline points="634,938 803,938" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><polyline points="1359,701 1407,701 1407,857 735,857 735,938 634,938" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><rect x="76" y="1084" width="558" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" /><text x="94" y="1120" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">RowVector</text><text x="76" y="1179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">逻辑类型 + 列向量</text><text x="76" y="1213" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">返回 TableScan</text><rect x="803" y="1084" width="556" height="60" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.55" /><text x="821" y="1120" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">BufferedInput → ReadFile</text><text x="803" y="1179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">缓存、合并读取、预取</text><text x="803" y="1213" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">本地文件 / 对象存储</text><polyline points="1065,1067.037 1065,1084" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="7 6" marker-end="url(#a-muted)" /><polyline points="280,1066.5185 280,1084" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><polyline points="76,1114 14,1114 14,233 48,233" fill="none" stroke="#39826d" stroke-width="1.85" marker-end="url(#a-green)" /><line x1="48" y1="1274" x2="1392" y2="1274" stroke="#dce3ea" stroke-width="1.85" /><text x="48" y="1308" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">SQL 规划与 split 枚举由宿主系统提供；HiveDataSource 把查询要求落实到当前文件，TableScan 负责执行调度。</text></svg>