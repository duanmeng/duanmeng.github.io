<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img"><title>HiveDataSource 在执行引擎与文件格式之间</title><desc>虚线表示调用；带「继承」标注的箭头指向基类；绿色箭头表示批数据返回。</desc><defs>
