<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img"><title>分区列与特殊列：值可以不来自文件 payload</title><desc>普通 Hive 路径；特殊列的名字与类型由 ColumnHandle 和 split metadata 约定。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1260" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">分区列与特殊列：值可以不来自文件 payload</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">普通 Hive 路径；特殊列的名字与类型由 ColumnHandle 和 split metadata 约定。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><line x1="48" y1="149" x2="668" y2="149" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">partitionKeys[ds] = &quot;2026-09-01&quot;</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">PartitionValue::fromString → typed Variant</text><text x="48" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">constantValue → 常量列；同名物理列不优先</text><text x="48" y="284" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">optional 无值表示 null，不是普通字符串</text><line x1="795" y1="149" x2="1391" y2="149" stroke="#dce3ea" stroke-width="1.5"/><text x="795" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">synthesized info columns</text><text x="795" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">来自 split.infoColumns，例如文件信息</text><text x="795" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">按声明类型构造常量</text><text x="795" y="284" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">已有过滤校验失败会抛异常</text><text x="48" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">两种来源汇入输出 ROW</text><text x="48" y="510" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">row index</text><text x="48" y="552" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">BIGINT；文件内从 0 开始的原始行号</text><text x="48" y="586" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">过滤后仍保持文件中的行身份</text><text x="48" y="620" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">不是最终结果重新编号 0, 1, 2, …</text><text x="795" y="510" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">composite rowId</text><text x="795" y="552" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">ROW 的第 0 个 child 是 row index</text><text x="795" y="586" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">另外 4 个 child 是 split 常量</text><text x="795" y="620" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">需要 split.rowIdProperties</text><text x="48" y="743" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">rowId 的五个位置（对应当前代码的字段顺序）</text><rect x="48" y="793" width="264" height="58" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="180.0" y="829.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">0: row index</text><rect x="317" y="793" width="264" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="449.0" y="829.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">1: file name</text><rect x="586" y="793" width="264" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="718.0" y="829.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">2: metadataVersion</text><rect x="855" y="793" width="264" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="987.0" y="829.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">3: partitionId</text><rect x="1124" y="793" width="264" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1256.0" y="829.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">4: tableGuid</text><polyline points="365,654 365,704 180,704 180,793" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)"/><polyline points="1105,654 1105,704 853,704 853,793" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)"/><text x="48" y="926" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">每个输出位置的身份</text><rect x="48" y="966" width="264" height="51" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="180.0" y="998.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2e7963" font-weight="400" text-anchor="middle">原始行 i</text><rect x="317" y="966" width="264" height="51" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="449.0" y="998.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">同一文件名</text><rect x="586" y="966" width="264" height="51" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="718.0" y="998.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">同一版本</text><rect x="855" y="966" width="264" height="51" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="987.0" y="998.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">同一分区</text><rect x="1124" y="966" width="264" height="51" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1256.0" y="998.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="middle">同一表</text><line x1="48" y1="1122" x2="1392" y2="1122" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1156" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">setupRowIdColumn 中名为 rowGroupId 的局部变量取 split_-&gt;getFileName()，不是 Parquet RowGroup 序号。</text><text x="48" y="1190" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">分区 DATE / TIMESTAMP / DECIMAL 解析需要逻辑类型参数，不能全部当成字符串或裸整数读取。</text></svg>