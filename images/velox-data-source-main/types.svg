<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="634" viewBox="0 0 1280 634" role="img"><title>类型与 channel：输出前缀固定，辅助列只向尾部追加</title><desc>schemaType 描述表列；dataType 描述交付值。extraction 可让请求类型与产生类型不同。</desc><rect width="1280" height="634" fill="#ffffff"/><defs>
