<text x="32" y="608" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">keys → handle.name=m；最终 RowVector 恢复 keys。G 非空时用于分配，不能用 R 的 MAP 代替 ARRAY。</text>
