<polyline points="1032,487 1032,553" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="32,678 1248,678" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="704" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">Type / TypedExpr 等原始描述可共享；ExprSet、ScanSpec、reader 与运行反馈有各自生命周期。</text>
<text x="32" y="733" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">split 再提供路径、范围、分区值与删除信息；当前文件 schema 到准备阶段才确定。</text>
</svg>