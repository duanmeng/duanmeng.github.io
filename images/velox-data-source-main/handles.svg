<text x="1032.0" y="219" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">handles → 列角色 / 前缀 channel</text>
<text x="1032.0" y="247" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">原始谓词 → filters_ / ExprSet</text>
<text x="1032.0" y="275" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">读取需求 → readerOutputType</text>
