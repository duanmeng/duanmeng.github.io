<text x="400.0" y="578" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">outputType + tableHandle + assignments</text>
<text x="400.0" y="606" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">计划输出名 → 列句柄；表谓词与 schema 一起传入</text>
