<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="778" viewBox="0 0 1280 778" role="img"><title>计划句柄与扫描状态：先描述要求，再构造执行现场</title><desc>左侧虚线箭头指向基类；右侧实线表示参数消费与派生。句柄不是已打开的文件。</desc><rect width="1280" height="778" fill="#ffffff"/><defs>
