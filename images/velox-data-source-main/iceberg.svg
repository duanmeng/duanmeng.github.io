<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="736" viewBox="0 0 1280 736" role="img"><title>Iceberg 的过滤分路：位置先行，值比较在后</title><desc>箭头表示同一路径内的处理顺序；changelog 不允许携带 deleteFiles，不能与普通扫描合并画。</desc><rect width="1280" height="736" fill="#ffffff"/><defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4078bd"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#39826d"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d76b7"/></marker>
<marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac9c76"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657386"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a95f64"/></marker>
</defs>
<text x="32" y="45" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="28" font-weight="600" fill="#1f2d3d" text-anchor="start">Iceberg 的过滤分路：位置先行，值比较在后</text>
<text x="32" y="79" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">箭头表示同一路径内的处理顺序；changelog 不允许携带 deleteFiles，不能与普通扫描合并画。</text>
<polyline points="32,101 1248,101" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="145" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#326cae" text-anchor="start">普通 Iceberg 数据扫描</text>
<rect x="32" y="173" width="340" height="113" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="202.0" y="203" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">文件绝对行范围</text>
<text x="202.0" y="232" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">nextRowNumber · nextReadSize</text>
<text x="202.0" y="260" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">metadata 跳读已反映到位置</text>
<rect x="450" y="173" width="344" height="113" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="622.0" y="203" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">position delete / Puffin DV</text>
<text x="622.0" y="232" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">填相对本批 deletedRows 位图</text>
<text x="622.0" y="260" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">Mutation 交给 DWIO</text>
<rect x="872" y="173" width="376" height="113" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="1060.0" y="203" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">DWIO reader</text>
<text x="1060.0" y="232" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">Mutation → 列 Filter</text>
<text x="1060.0" y="260" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">输出所需列 + equality key</text>
<polyline points="372,229 450,229" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="794,229 872,229" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="872" y="355" width="376" height="113" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="1060.0" y="385" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">填充 / 转换</text>
<text x="1060.0" y="414" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">geometry · lineage · target ID</text>
<text x="1060.0" y="442" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">填完后移除临时行号列</text>
<polyline points="1060,286 1060,355" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="450" y="355" width="344" height="113" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="622.0" y="385" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">读后选择</text>
<text x="622.0" y="414" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">post-read Filter → equality delete</text>
<text x="622.0" y="442" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">共用位图；字典包装一次</text>
<polyline points="872,411 794,411" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="32" y="355" width="340" height="113" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="202.0" y="385" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">FileDataSource</text>
<text x="202.0" y="414" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">remaining expression</text>
<text x="202.0" y="442" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">输出前缀 / postProcessor / 改名</text>
<polyline points="450,411 372,411" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="32,509 1248,509" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="548" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#877951" text-anchor="start">Changelog 独立路径</text>
<rect x="32" y="578" width="340" height="87" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/>
<text x="202.0" y="608" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#877951" text-anchor="middle">split 常量过滤</text>
<text x="202.0" y="637" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">operation / ordinal / snapshotid</text>
<rect x="450" y="578" width="344" height="87" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="622.0" y="608" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">基础表读取</text>
<text x="622.0" y="637" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">dataScanSpec · 无 deleteFiles</text>
<rect x="872" y="578" width="376" height="87" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="1060.0" y="608" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">包装 changelog RowVector</text>
<text x="1060.0" y="637" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">rowdata + 常量 → remaining</text>
<polyline points="372,621 450,621" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="794,621 872,621" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="32" y="707" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">Equality delete 要读取实际 key；Position delete / DV 依据文件行位置，不依赖压缩后的 batch 下标。</text>
</svg>