<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><title>动态过滤：Driver 合并，DataSource 替换节点引用</title><desc>shared PushdownFilters 保存累计条件；普通 FileDataSource 没有额外 dynamicFilters_ 缓存。</desc><rect width="1280" height="640" fill="#ffffff"/><defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4078bd"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#39826d"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d76b7"/></marker>
<marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac9c76"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657386"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a95f64"/></marker>
</defs>
<text x="32" y="45" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="28" font-weight="600" fill="#1f2d3d" text-anchor="start">动态过滤：Driver 合并，DataSource 替换节点引用</text>
<text x="32" y="79" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">shared PushdownFilters 保存累计条件；普通 FileDataSource 没有额外 dynamicFilters_ 缓存。</text>
<polyline points="32,101 1248,101" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="32" y="151" width="337" height="100" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="200.5" y="181" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">Join 等生产者</text>
<text x="200.5" y="210" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">输出 channel</text>
<text x="200.5" y="238" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">产生本轮动态 Filter</text>
<rect x="443" y="151" width="360" height="100" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="623.0" y="181" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">Driver::pushdownFilters</text>
<text x="623.0" y="210" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">沿 identityProjection 回溯</text>
<text x="623.0" y="238" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">映射到 TableScan channel</text>
<rect x="876" y="151" width="372" height="100" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="1062.0" y="181" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">shared PushdownFilters</text>
<text x="1062.0" y="210" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">静态根条件 + 动态条件合并</text>
<text x="1062.0" y="238" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">记录 dynamicFilteredColumns</text>
<polyline points="369,201 443,201" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="803,201 876,201" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="876" y="331" width="372" height="100" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="1062.0" y="361" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">TableScan / DataSource</text>
<text x="1062.0" y="390" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">按 output channel 找 ScanSpec</text>
<text x="1062.0" y="418" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">setFilter：替换节点引用</text>
<polyline points="1062,251 1062,331" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="443" y="331" width="360" height="100" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="623.0" y="361" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">ScanSpec 缓存</text>
<text x="623.0" y="390" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">递归 resetCachedValues(true)</text>
<text x="623.0" y="418" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">清 hasFilter，允许重排</text>
<polyline points="876,381 803,381" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="32" y="331" width="337" height="100" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="200.5" y="361" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">RowReader / ColumnReader</text>
<text x="200.5" y="390" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">resetFilterCaches</text>
<text x="200.5" y="418" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">旧字典过滤结果 → Unknown</text>
<polyline points="443,381 369,381" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="32" y="488" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="start">下一个普通 split</text>
<text x="320" y="488" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#657386" text-anchor="start">复用同一 ScanSpec；常量按新 split 重新测试。</text>
<text x="32" y="536" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#877951" text-anchor="start">preload / takeover</text>
<text x="320" y="536" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#657386" text-anchor="start">donor 是另一棵树；晚到条件受 moveAdaptationFrom 条件约束。</text>
<polyline points="32,572 1248,572" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="598" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">prepare 后的非 null 常量不保证重新测试；动态过滤剪枝与下游 join 的精确条件分开判断。</text>
</svg>