<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>LazyVector：行映射与 reader 世代共同约束加载</title><desc>buffer 可共享不代表未加载值可以跨 reader 前进；最终选中行还要映射到原文件位置。</desc><rect width="1280" height="650" fill="#ffffff"/><defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4078bd"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#39826d"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d76b7"/></marker>
<marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac9c76"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657386"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a95f64"/></marker>
</defs>
<text x="32" y="45" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="28" font-weight="600" fill="#1f2d3d" text-anchor="start">LazyVector：行映射与 reader 世代共同约束加载</text>
<text x="32" y="79" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">buffer 可共享不代表未加载值可以跨 reader 前进；最终选中行还要映射到原文件位置。</text>
<polyline points="32,101 1248,101" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="146" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#326cae" text-anchor="start">当前批：generation = 7</text>
<rect x="32" y="176" width="322" height="115" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="193.0" y="206" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">reader outputRows</text>
<text x="193.0" y="235" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">[0, 2, 3]：文件批内位置</text>
<text x="193.0" y="263" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">ColumnReader 仍在本批</text>
<rect x="453" y="176" width="356" height="115" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="631.0" y="206" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">remaining selection</text>
<text x="631.0" y="235" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">[0, 2]：reader 输出下标</text>
<text x="631.0" y="263" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">dictionary 包装 LazyVector</text>
<rect x="908" y="176" width="340" height="115" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="1078.0" y="206" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">ColumnLoader 加载</text>
<text x="1078.0" y="235" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">outputRows[[0,2]] → [0,3]</text>
<text x="1078.0" y="263" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">按实际文件位置读值</text>
<polyline points="354,233 453,233" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="809,233 908,233" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="32" y="359" width="531" height="116" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="297.5" y="389" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">正确：本世代内完成必要加载</text>
<text x="297.5" y="418" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">检查 version == structReader.numReads()</text>
<text x="297.5" y="446" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">已物化结果跨批保留，由引用计数保护</text>
<rect x="653" y="359" width="595" height="116" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/>
<text x="950.5" y="389" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#877951" text-anchor="middle">不成立：保留 lazy 指针，先推进下一批</text>
<text x="950.5" y="418" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">generation 7 → 8 后再加载：版本检查失败</text>
<text x="950.5" y="446" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">销毁 reader 后更不能依靠 LazyVector 延长其生命</text>
<polyline points="1078,291 1078,332 298,332 298,359" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="32,517 1248,517" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="543" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">eager-load 处理投影列与 conditional 选择的冲突；只需少量行时，lazy 可减少 payload 解码。</text>
<text x="32" y="572" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">remaining dictionary、Iceberg delete dictionary、postProcessor 还需共同遵守共享向量的可写性。</text>
</svg>