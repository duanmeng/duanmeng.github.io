<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="699" viewBox="0 0 1280 699" role="img"><title>构造阶段：原始过滤输入如何分成三条执行路径</title><desc>保留 TableHandle 输入；派生 Filter map、残余 TypedExpr、ExprSet 和与树绑定的 MetadataFilter。</desc><rect width="1280" height="699" fill="#ffffff"/><defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4078bd"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#39826d"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d76b7"/></marker>
<marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac9c76"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657386"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a95f64"/></marker>
</defs>
<text x="32" y="45" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="28" font-weight="600" fill="#1f2d3d" text-anchor="start">构造阶段：原始过滤输入如何分成三条执行路径</text>
<text x="32" y="79" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">保留 TableHandle 输入；派生 Filter map、残余 TypedExpr、ExprSet 和与树绑定的 MetadataFilter。</text>
<polyline points="32,101 1248,101" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="32" y="135" width="344" height="113" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="204.0" y="165" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">TableHandle 原始输入</text>
<text x="204.0" y="194" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">subfieldFilters</text>
<text x="204.0" y="222" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">remaining TypedExpr</text>
<rect x="446" y="135" width="398" height="113" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="645.0" y="165" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">提取可下推过滤条件</text>
<text x="645.0" y="194" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">extractFiltersFromRemainingFilter</text>
<text x="645.0" y="222" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">副本中合并 · 原始输入不变</text>
<polyline points="376,191 446,191" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="917" y="135" width="331" height="113" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/>
<text x="1082.5" y="165" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#877951" text-anchor="middle">采样模式（可选）</text>
<text x="1082.5" y="194" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">sampleRate</text>
<text x="1082.5" y="222" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">RandomSkipTracker</text>
<polyline points="844,191 917,191" fill="none" stroke="#ac9c76" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-warm)"/>
<rect x="32" y="314" width="344" height="113" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="204.0" y="344" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">派生 filters_</text>
<text x="204.0" y="373" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">原始 + 可提取条件</text>
<text x="204.0" y="401" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">Filter payload 可共享</text>
<rect x="470" y="314" width="374" height="113" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="657.0" y="344" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">残余 TypedExpr</text>
<text x="657.0" y="373" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">无法逐列下推的表达式</text>
<text x="657.0" y="401" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">如 c0=1 OR c1=2</text>
<polyline points="508,248 508,280 204,280 204,314" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="722,248 722,314" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="32" y="499" width="344" height="110" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/>
<text x="204.0" y="529" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#2e7963" text-anchor="middle">ScanSpec</text>
<text x="204.0" y="558" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">节点 / channel / constants</text>
<text x="204.0" y="586" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">安装普通逐行 Filter</text>
<rect x="470" y="499" width="374" height="110" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="657.0" y="529" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">ExprSet / compiled Expr</text>
<text x="657.0" y="558" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">distinctFields → 辅助列</text>
<text x="657.0" y="586" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">extractSubfields → 读取需求</text>
<rect x="910" y="499" width="338" height="110" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/>
<text x="1079.0" y="529" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#65537f" text-anchor="middle">MetadataFilter</text>
<text x="1079.0" y="558" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">leaf 指针登记到 ScanSpec</text>
<text x="1079.0" y="586" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">AND / OR 统计排除位图</text>
<polyline points="204,427 204,499" fill="none" stroke="#39826d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="657,427 657,499" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="844,366 1079,366 1079,499" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="470,556 376,556" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="1079,609 1079,635 204,635 204,609" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-purple)" stroke-dasharray="6 5"/>
<text x="32" y="675" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#657386" text-anchor="start">树被重建时，旧 MetadataFilter 非空 ≠ leaf 已登记到新树；metadata 与逐行 ExprSet 是独立保证。</text>
</svg>