<text x="62" y="210" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">INT64；unscaled = 12345</text>
<text x="735" y="181" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="22" font-weight="600" text-anchor="start">Reader 请求 DECIMAL(14,3)</text>
<text x="735" y="220" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">precision +2，scale +1；允许保值扩大</text>
<polyline points="307,252 307,340" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="335" y="302" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">乘 10：scale 2 → 3</text>
<rect x="40" y="340" width="535" height="110" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="40" y="344" width="4" height="102" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="62" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">输入 A：DECIMAL(14,3)</text>
<text x="62" y="408" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">unscaled = 123450 → 123.450</text>
<rect x="705" y="340" width="535" height="110" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
