<text x="322" y="575" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">plus：两个 scale 都是 3</text>
<text x="322" y="608" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">123450 + 6789 = 130239；执行溢出检查</text>
<polyline points="640,650 640,715" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="730" y="690" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">绑定返回 Type：DECIMAL(15,3)</text>
<rect x="190" y="715" width="900" height="110" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="190" y="719" width="4" height="102" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="212" y="750" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">结果 Vector：DECIMAL(15,3)</text>
<text x="212" y="783" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">存储 130239；数学值为 130.239；Project 继续携带完整类型。</text>
<rect x="40" y="838" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="867" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">int64_t 只承载整数；Type 参数决定缩放、返回契约与数值解释。</text>
<text x="60" y="892" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">图中整数均为非 null 示例；Reader 转换与 SQL 运算是两个不同阶段。</text>
