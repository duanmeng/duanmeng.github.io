<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">从文件中的 123.45，到查询结果 130.239：保值读取与两输入计算分别展开</text>
<rect x="40" y="142" width="535" height="110" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="40" y="146" width="4" height="102" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
