<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">DECIMAL 的一次完整旅程</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">从文件中的 123.45，到查询结果 130.239：保值读取与两输入计算分别展开</text>
<rect x="40" y="142" width="535" height="110" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="40" y="146" width="4" height="102" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="62" y="177" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">文件：DECIMAL(12,2)</text>
<text x="62" y="210" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">INT64；unscaled = 12345</text>
<text x="735" y="181" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="22" font-weight="600" text-anchor="start">Reader 请求 DECIMAL(14,3)</text>
<text x="735" y="220" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">precision +2，scale +1；允许保值扩大</text>
<polyline points="307,252 307,340" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="335" y="302" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">乘 10：scale 2 → 3</text>
<rect x="40" y="340" width="535" height="110" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="40" y="344" width="4" height="102" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="62" y="375" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">输入 A：DECIMAL(14,3)</text>
<text x="62" y="408" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">unscaled = 123450 → 123.450</text>
<rect x="705" y="340" width="535" height="110" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="705" y="344" width="4" height="102" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="727" y="375" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">输入 B：DECIMAL(8,3)</text>
<text x="727" y="408" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">unscaled = 6789 → 6.789</text>
<polyline points="307,450 307,496 505,496 505,540" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="972,450 972,496 775,496 775,540" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
