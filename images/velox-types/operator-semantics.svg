<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">算子为什么不能只看 NativeType</title><desc id="desc">TIMESTAMP WITH TIME ZONE：BIGINT backing，逻辑比较只使用 UTC 毫秒</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="744" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">算子为什么不能只看 NativeType</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">TIMESTAMP WITH TIME ZONE：BIGINT backing，逻辑比较只使用 UTC 毫秒</text>
<rect x="40" y="138" width="1200" height="93" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="40" y="142" width="4" height="85" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="62" y="173" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">两个值：UTC 毫秒相同，timezone key 不同</text>
<text x="62" y="206" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">底层 packed int64_t 不同，逻辑上却可以表示同一时刻。</text>
<text x="40" y="281" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">packed value A</text>
<text x="40" y="365" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">packed value B</text>
<rect x="265" y="269" width="670" height="61" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<text x="600" y="307" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="23" font-weight="400" text-anchor="middle">UTC millis = 1000</text>
<rect x="935" y="269" width="305" height="61" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<text x="1087" y="307" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="20" font-weight="400" text-anchor="middle">zone = 1  ·  12 bit</text>
<rect x="265" y="353" width="670" height="61" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<text x="600" y="391" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="23" font-weight="400" text-anchor="middle">UTC millis = 1000</text>
<rect x="935" y="353" width="305" height="61" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<text x="1087" y="391" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="20" font-weight="400" text-anchor="middle">zone = 2  ·  12 bit</text>
<rect x="40" y="481" width="560" height="111" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="40" y="485" width="4" height="103" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="62" y="516" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">compare(A, B) = 0</text>
<text x="62" y="549" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">解包 UTC millis 后比较</text>
<rect x="680" y="481" width="560" height="111" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1"/>
<rect x="680" y="485" width="4" height="103" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="702" y="516" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#877951" font-size="21" font-weight="600" text-anchor="start">hash(A) = hash(B)</text>
<text x="702" y="549" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">只 hash 解包后的 UTC millis</text>
<rect x="40" y="658" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="658.0" x2="1240.0" y2="658.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="687" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">Vector / RowContainer 根据 Type 的自定义比较契约选择实现。</text>
<text x="60" y="712" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">GROUP BY / JOIN 若直接 hash packed int64_t，可能破坏逻辑相等关系。</text>
</svg>
