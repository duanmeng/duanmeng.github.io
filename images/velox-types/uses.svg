<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">同一列 DATE：各接口到底使用哪种类型</title><desc id="desc">逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="950" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="934" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">同一列 DATE：各接口到底使用哪种类型</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</text>
<rect x="40" y="145" width="180" height="60" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="56" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">组件</text>
<rect x="250" y="145" width="300" height="60" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="266" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">逻辑类型</text>
<rect x="580" y="145" width="300" height="60" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="596" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">物理类型 / kind</text>
<rect x="910" y="145" width="330" height="60" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="926" y="183" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">C++ 值类型</text>
<rect x="40" y="240" width="180" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="40" y="244" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="62" y="275" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Vector</text>
<rect x="250" y="240" width="300" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="250" y="244" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="272" y="275" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">type() → DATE()</text>
<text x="272" y="308" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">逻辑类型：日期</text>
