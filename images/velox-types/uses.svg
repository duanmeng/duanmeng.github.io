<text x="932" y="308" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">值使用 int32_t</text>
<rect x="40" y="425" width="180" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="40" y="429" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="62" y="460" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Function</text>
<rect x="250" y="425" width="300" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="250" y="429" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="272" y="460" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">date → date</text>
<text x="272" y="493" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">绑定后返回 DATE()</text>
<rect x="580" y="425" width="300" height="120" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="580" y="429" width="4" height="112" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="602" y="460" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">argPhysicalTypes()</text>
<text x="602" y="493" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">INTEGER()，载体 TypePtr</text>
<rect x="910" y="425" width="330" height="120" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="910" y="429" width="4" height="112" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="932" y="460" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">call 的参数与结果</text>
<text x="932" y="493" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Date tag → int32_t</text>
<rect x="40" y="610" width="180" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="40" y="614" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="62" y="645" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Operator</text>
<rect x="250" y="610" width="300" height="120" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="250" y="614" width="4" height="112" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="272" y="645" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">ROW(d DATE)</text>
<text x="272" y="678" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">输入 / 输出逻辑 schema</text>
<rect x="580" y="610" width="300" height="120" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="580" y="614" width="4" height="112" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="602" y="645" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">子列 kind → INTEGER</text>
<text x="602" y="678" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">用于列访问与存储分派</text>
<rect x="910" y="610" width="330" height="120" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="910" y="614" width="4" height="112" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="932" y="645" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">读取 int32_t 值</text>
<text x="932" y="678" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">状态由 C++ 算法组织</text>
<rect x="40" y="848" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="877" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">结果 Vector 继续携带 DATE()；物理签名 INTEGER() 没有替换它的逻辑类型。</text>
<text x="60" y="902" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Vector Function 的 args[i]-&gt;type() / outputType 也是逻辑类型；内部再选择物理分派和 C++ 运算。</text>
</svg>
