<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1307" viewBox="0 0 1440 1307" role="img"><title>同一列 DATE：各接口到底使用哪种类型</title><desc>逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1307" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">同一列 DATE：各接口到底使用哪种类型</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><rect x="48" y="178" width="205" height="61" rx="4" fill="#fafbfc" stroke="#dce3ea" stroke-width="1.5" /><text x="150.5" y="215.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#657386" font-weight="400" text-anchor="middle">组件</text><rect x="285" y="178" width="383" height="61" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="476.5" y="215.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="400" text-anchor="middle">逻辑类型</text><rect x="700" y="178" width="315" height="61" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="857.5" y="215.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="400" text-anchor="middle">物理类型 / kind</text><rect x="1048" y="178" width="344" height="61" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="1220.0" y="215.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="400" text-anchor="middle">C++ 值类型</text><text x="48" y="350" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#326cae" font-weight="600" text-anchor="start">Vector</text><line x1="285" y1="321" x2="668" y2="321" stroke="#dce3ea" stroke-width="1.5" /><text x="285" y="350" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">type() → DATE()</text><text x="285" y="388" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">逻辑类型：日期</text><line x1="700" y1="321" x2="1015" y2="321" stroke="#dce3ea" stroke-width="1.5" /><text x="700" y="350" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">typeKind()</text><text x="700" y="388" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">INTEGER（32 位整数）</text><line x1="1048" y1="321" x2="1392" y2="321" stroke="#dce3ea" stroke-width="1.5" /><text x="1048" y="350" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">FlatVector&lt;int32_t&gt;</text><text x="1048" y="388" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">值使用 int32_t</text><line x1="48" y1="531" x2="1392" y2="531" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="626" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#326cae" font-weight="600" text-anchor="start">Function</text><line x1="285" y1="597" x2="668" y2="597" stroke="#dce3ea" stroke-width="1.5" /><text x="285" y="626" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">date → date</text><text x="285" y="664" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">绑定后返回 DATE()</text><line x1="700" y1="597" x2="1015" y2="597" stroke="#dce3ea" stroke-width="1.5" /><text x="700" y="626" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">argPhysicalTypes()</text><text x="700" y="664" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">INTEGER()，载体 TypePtr</text><line x1="1048" y1="597" x2="1392" y2="597" stroke="#dce3ea" stroke-width="1.5" /><text x="1048" y="626" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">call 的参数与结果</text><text x="1048" y="664" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Date tag → int32_t</text><line x1="48" y1="807" x2="1392" y2="807" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#326cae" font-weight="600" text-anchor="start">Operator</text><line x1="285" y1="873" x2="668" y2="873" stroke="#dce3ea" stroke-width="1.5" /><text x="285" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">ROW(d DATE)</text><text x="285" y="940" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">输入 / 输出逻辑 schema</text><line x1="700" y1="873" x2="1015" y2="873" stroke="#dce3ea" stroke-width="1.5" /><text x="700" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">子列 kind → INTEGER</text><text x="700" y="940" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">用于列访问与存储分派</text><line x1="1048" y1="873" x2="1392" y2="873" stroke="#dce3ea" stroke-width="1.5" /><text x="1048" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">读取 int32_t 值</text><text x="1048" y="940" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">状态由 C++ 算法组织</text><line x1="48" y1="1083" x2="1392" y2="1083" stroke="#dce3ea" stroke-width="1.5" /><line x1="48" y1="1185" x2="1392" y2="1185" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1219" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">结果 Vector 继续携带 DATE()；物理签名 INTEGER() 没有替换它的逻辑类型。</text><text x="48" y="1253" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Vector Function 的 args[i]-&gt;type() / outputType 也是逻辑类型；内部再选择物理分派和 C++ 运算。</text></svg>