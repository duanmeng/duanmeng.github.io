<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</text>
