<text x="272" y="645" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">ROW(d DATE)</text>
<text x="272" y="678" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">输入 / 输出逻辑 schema</text>
<rect x="580" y="610" width="300" height="120" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="580" y="614" width="4" height="112" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="602" y="645" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">子列 kind → INTEGER</text>
<text x="602" y="678" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">用于列访问与存储分派</text>
<rect x="910" y="610" width="330" height="120" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="910" y="614" width="4" height="112" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="932" y="645" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">读取 int32_t 值</text>
<text x="932" y="678" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">状态由 C++ 算法组织</text>
<rect x="40" y="848" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="848.0" x2="1240.0" y2="848.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="877" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">结果 Vector 继续携带 DATE()；物理签名 INTEGER() 没有替换它的逻辑类型。</text>
<text x="60" y="902" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Vector Function 的 args[i]-&gt;type() / outputType 也是逻辑类型；内部再选择物理分派和 C++ 运算。</text>
</svg>
