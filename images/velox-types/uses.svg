<text x="62" y="275" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">Vector</text>
<rect x="250" y="240" width="300" height="120" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="250" y="244" width="4" height="112" rx="0" fill="none" stroke="none" stroke-width="1"/>
