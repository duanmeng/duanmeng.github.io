<text x="602" y="460" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">argPhysicalTypes()</text>
<text x="602" y="493" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">INTEGER()，载体 TypePtr</text>
<rect x="910" y="425" width="330" height="120" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="910" y="429" width="4" height="112" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="932" y="460" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">call 的参数与结果</text>
<text x="932" y="493" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Date tag → int32_t</text>
<rect x="40" y="610" width="180" height="120" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
