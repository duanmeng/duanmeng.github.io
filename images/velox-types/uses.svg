<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>同一列 DATE：各接口到底使用哪种类型</title><desc>逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="740" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">同一列 DATE：各接口到底使用哪种类型</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">逻辑类型、物理类型和 C++ 值类型同时存在；按具体接口区分它们。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><rect x="40" y="143" width="158" height="45" rx="5" fill="#ffffff" stroke="#dce3ea" stroke-width="1.6"/><text x="119.0" y="172.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#657386" text-anchor="middle">组件</text><rect x="214" y="143" width="325" height="45" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="376.5" y="172.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="middle">逻辑类型</text><rect x="555" y="143" width="320" height="45" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="715.0" y="172.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="middle">物理类型 / kind</text><rect x="891" y="143" width="349" height="45" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="1065.5" y="172.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="middle">C++ 值类型</text><text x="40" y="250" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="start">Vector</text><rect x="214" y="211" width="325" height="101" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="228" y="244" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="start">type() → DATE()</text><text x="228" y="288" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">逻辑类型：日期</text><rect x="555" y="211" width="320" height="101" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="569" y="244" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start">typeKind()</text><text x="569" y="288" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">INTEGER（32 位整数）</text><rect x="891" y="211" width="349" height="101" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="905" y="244" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">FlatVector&lt;int32_t&gt;</text><text x="905" y="288" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">值使用 int32_t</text><text x="40" y="379" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="start">Function</text><rect x="214" y="340" width="325" height="101" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="228" y="373" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="start">date → date</text><text x="228" y="417" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">绑定后返回 DATE()</text><rect x="555" y="340" width="320" height="101" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="569" y="373" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start">argPhysicalTypes()</text><text x="569" y="417" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">INTEGER()，载体 TypePtr</text><rect x="891" y="340" width="349" height="101" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="905" y="373" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">call 的参数与结果</text><text x="905" y="417" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">Date tag → int32_t</text><text x="40" y="508" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="start">Operator</text><rect x="214" y="469" width="325" height="101" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="228" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="start">ROW(d DATE)</text><text x="228" y="546" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输入 / 输出逻辑 schema</text><rect x="555" y="469" width="320" height="101" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="569" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start">子列 kind → INTEGER</text><text x="569" y="546" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">用于列访问与存储分派</text><rect x="891" y="469" width="349" height="101" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="905" y="502" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">读取 int32_t 值</text><text x="905" y="546" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">状态由 C++ 算法组织</text><line x1="40" y1="612" x2="1240" y2="612" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="641" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">结果 Vector 继续携带 DATE()；物理签名 INTEGER() 没有替换它的逻辑类型。</text><text x="40" y="670" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">Vector Function 的 args[i]-&gt;type() / outputType 也是逻辑类型；内部再选择物理分派和 C++ 运算。</text></svg>