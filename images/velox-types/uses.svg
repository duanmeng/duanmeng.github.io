<rect x="580" y="244" width="4" height="112" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="602" y="275" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">typeKind()</text>
<text x="602" y="308" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">INTEGER（32 位整数）</text>
