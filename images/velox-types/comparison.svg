<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1288" viewBox="0 0 1440 1288" role="img"><title>“同一种类型”要先确定比较层次</title><desc>类型对象的比较，不等同于值比较，也不等同于允许 SQL 转换</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1288" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">“同一种类型”要先确定比较层次</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">类型对象的比较，不等同于值比较，也不等同于允许 SQL 转换</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><line x1="48" y1="150" x2="468" y2="150" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">kindEquals</text><text x="48" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">递归比较 backing kind 树</text><line x1="510" y1="150" x2="930" y2="150" stroke="#dce3ea" stroke-width="1.5" /><text x="510" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">equivalent</text><text x="510" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">逻辑身份与参数；ROW 忽略名字</text><line x1="972" y1="150" x2="1392" y2="150" stroke="#dce3ea" stroke-width="1.5" /><text x="972" y="179" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">operator== / equals</text><text x="972" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">强匹配；含 ROW 名与 OPAQUE 身份</text><text x="48" y="362" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#657386" font-weight="400" text-anchor="start">以下结果顺序：kindEquals / equivalent / operator==</text><text x="48" y="442" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#1f2d3d" font-weight="600" text-anchor="start">输入类型</text><rect x="635" y="406" width="238" height="58" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="754.0" y="442.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="400" text-anchor="middle">kindEquals</text><rect x="885" y="406" width="238" height="58" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1004.0" y="442.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="400" text-anchor="middle">equivalent</text><rect x="1135" y="406" width="238" height="58" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="1254.0" y="442.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="400" text-anchor="middle">operator==</text><text x="48" y="541" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#1f2d3d" font-weight="600" text-anchor="start">DATE / INTEGER</text><text x="48" y="581" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">true / false / false</text><rect x="635" y="507" width="238" height="63" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="754.0" y="545.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="400" text-anchor="middle">true</text><rect x="885" y="507" width="238" height="63" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="1004.0" y="545.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="400" text-anchor="middle">false</text><rect x="1135" y="507" width="238" height="63" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="1254.0" y="545.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="400" text-anchor="middle">false</text><line x1="48" y1="624" x2="1392" y2="624" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="715" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#1f2d3d" font-weight="600" text-anchor="start">DECIMAL(10,2) / (12,2)</text><text x="48" y="755" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">true / false / false</text><rect x="635" y="681" width="238" height="63" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="754.0" y="719.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="400" text-anchor="middle">true</text><rect x="885" y="681" width="238" height="63" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="1004.0" y="719.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="400" text-anchor="middle">false</text><rect x="1135" y="681" width="238" height="63" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="1254.0" y="719.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="400" text-anchor="middle">false</text><line x1="48" y1="798" x2="1392" y2="798" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="889" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#1f2d3d" font-weight="600" text-anchor="start">ROW 字段名 a → b</text><text x="48" y="929" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">true / true / false</text><rect x="635" y="855" width="238" height="63" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="754.0" y="893.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="400" text-anchor="middle">true</text><rect x="885" y="855" width="238" height="63" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1004.0" y="893.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="400" text-anchor="middle">true</text><rect x="1135" y="855" width="238" height="63" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="1254.0" y="893.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#877951" font-weight="400" text-anchor="middle">false</text><line x1="48" y1="972" x2="1392" y2="972" stroke="#dce3ea" stroke-width="1.5" /><line x1="48" y1="1026" x2="1392" y2="1026" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1055" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">coercion / CAST 是另外的问题</text><text x="48" y="1093" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">类型不等价仍可能允许转换；kind 相同也不能证明换标签就能保值。</text><line x1="48" y1="1200" x2="1392" y2="1200" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1234" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">hashKind / hash() 计算类型描述的 hash；hash(value) 计算值的 hash。</text></svg>