<text x="844" y="980" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">RowType</text>
<text x="844" y="1009" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">父类 TypeBase&lt;ROW&gt;</text>
<text x="88" y="1040" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">child_ 保存元素 TypePtr</text>
<text x="466" y="1040" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">保存 key / value TypePtr</text>
<text x="844" y="1040" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">保存字段 TypePtr 与字段名</text>
<rect x="40" y="1128" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="1157" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">基本 Type 既能描述逻辑类型，也能被用于物理签名；这不是两棵互斥的类树。</text>
<text x="60" y="1182" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">DateType 继承 IntegerType 表示 C++ 实现复用，不表示 SQL DATE 等价于 INTEGER。</text>
