<text x="818" y="819" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">父类 DecimalType&lt;HUGEINT&gt;</text>
