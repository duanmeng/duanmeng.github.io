<text x="148" y="319" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">初始化 kind_；默认 name() / kindName() 来自 TypeTraits&lt;K&gt;</text>
