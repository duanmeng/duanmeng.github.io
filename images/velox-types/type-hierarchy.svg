<text x="228" y="410" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">CanProvideCustomComparisonType&lt;K&gt;</text>
<text x="228" y="439" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">增加基于 NativeType 的值 compare / hash 接口</text>
