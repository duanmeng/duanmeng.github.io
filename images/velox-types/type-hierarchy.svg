<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">Type 的实际继承结构：描述类、模板实例与别名</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">本文涉及的类；虚线箭头由子类指向父类，K 表示各分支使用的 TypeKind 模板实参。</text>
