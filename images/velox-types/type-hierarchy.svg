<text x="308" y="559" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">IntegerType = ScalarType&lt;INTEGER&gt;；BigintType = ScalarType&lt;BIGINT&gt;</text>
