<text x="68" y="199" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">统一接口；保存 const TypeKind kind_</text>
