8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="914" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">逻辑类型、物理类型与 C++ 值类型的层级</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">箭头表示表示方式的关联；不表示值转换，也不表示三个执行阶段。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Velox Type 描述：每个类型对象保留逻辑身份与 backing kind</text><rect x="24" y="160" width="1232" height="330" rx="5" fill="white" stroke="#dce3ea" stroke-width="1.6"/><rect x="40" y="171" width="273" height="124" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="199" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">LOGICAL TYPE</text><text x="56" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">INTEGER</text><text x="56" y="273" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">整数语义</text><rect x="349" y="171" width="273" height="124" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="365" y="199" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">LOGICAL TYPE</text><text x="365" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">DATE</text><text x="365" y="273" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">日期语义</text><rect x="658" y="171" width="273" height="124" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="674" y="199" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">LOGICAL TYPE</text><text x="674" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">BIGINT</text><text x="674" y="273" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">整数语义</text><rect x="967" y="171" width="273" height="124" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="983" y="199" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">LOGICAL TYPE</text><text x="983" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">DECIMAL(12,2)</text><text x="983" y="273" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">precision=12 · scale=2</text><rect x="194" y="353" width="273" height="121" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="210" y="380" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">PHYSICAL KIND</text><text x="210" y="418" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#2e7963" text-anchor="start">INTEGER</text><text x="210" y="452" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">基础表示类别</text><rect x="812" y="353" width="273" height="121" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="828" y="380" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">PHYSICAL KIND</text><text x="828" y="418" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#2e7963" text-anchor="start">BIGINT</text><text x="828" y="452" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">基础表示类别</text><polyline points="177,295 177,321 330,321 330,353" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><polyline points="485,295 485,321 330,321 330,353" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><polyline points="795,295 795,321 948,321 948,353" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><polyline points="1103,295 1103,321 948,321 948,353" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/><text x="40" y="515" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">关联到 C++ 值实现</text><rect x="194" y="538" width="273" height="123" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="210" y="565" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">C++ VALUE TYPE</text><text x="210" y="604" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#65537f" text-anchor="start">int32_t</text><text x="210" y="640" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">承载或访问整数值</text><polyline points="331,474 331,538" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><rect x="812" y="538" width="273" height="123" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="828" y="565" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#657386" text-anchor="start">C++ VALUE TYPE</text><text x="828" y="604" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#65537f" text-anchor="start">int64_t</text><text x="828" y="640" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">承载 unscaled 等原生值</text><polyline points="949,474 949,538" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><text x="40" y="704" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#877951" text-anchor="start">只保留 int32_t 无法区分 DATE / INTEGER；只保留 int64_t 无法恢复 decimal 参数。</text><text x="40" y="748" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2c6f6b" text-anchor="start">Vector 再组织一批值的实际布局</text><text x="40" y="779" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">完整 Type + encoding + values / indices / nulls / children；同一逻辑类型可采用不同编码。</text><line x1="40" y1="817" x2="1240" y2="817" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="846" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">抽象层级、类型树、Vector 编码分别描述不同关系。</text><text x="40" y="875" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">文件格式还有自己的 physical type，例如 Parquet INT64；Reader 负责与 Velox 类型映射。</text></svg>