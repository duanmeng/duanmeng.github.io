<text x="222" y="646" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">int32_t</text>
<text x="222" y="677" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">承载或访问整数值</text>
<rect x="740" y="591" width="350" height="105" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="740" y="595" width="4" height="97" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="762" y="617" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="12" font-weight="400" text-anchor="start">C++ VALUE TYPE</text>
<text x="762" y="646" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">int64_t</text>
<text x="762" y="677" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">承载 unscaled 等原生值</text>
<text x="60" y="750" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="400" text-anchor="start">只保留 int32_t 无法区分 DATE / INTEGER；只保留 int64_t 无法恢复 decimal 参数。</text>
<rect x="40" y="793" width="1200" height="112" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<rect x="40" y="797" width="4" height="104" rx="0" fill="#c2410c" stroke="none" stroke-width="1"/>
<text x="62" y="828" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Vector 再组织一批值的实际布局</text>
<text x="62" y="861" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">完整 Type + encoding + values / indices / nulls / children；同一逻辑类型可采用不同编码。</text>
<rect x="40" y="948" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="977" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">抽象层级、类型树、Vector 编码分别描述不同关系。</text>
<text x="60" y="1002" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">文件格式还有自己的 physical type，例如 Parquet INT64；Reader 负责与 Velox 类型映射。</text>
