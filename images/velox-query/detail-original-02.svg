<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="649" viewBox="0 0 1280 649" role="img"><title>远程 Exchange 的两端状态</title><rect width="1280" height="649" fill="white" stroke="none"/><rect x="8" y="8" width="1264" height="633" fill="white" stroke="none"/><rect x="9" y="9" width="1262" height="76" fill="#ffffff"/><text x="36" y="53" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#1f2d3d">远程 Exchange 的两端状态</text><g transform="translate(24 106) scale(1.4)">
<defs><marker id="ex" markerHeight="9" markerWidth="9" orient="auto" refX="6" refY="3"><path d="M0,0 L6,3 L0,6 Z" fill="#ac9c76"/></marker></defs>
<rect fill="#f3f7fc" height="300" rx="4" stroke="#dce3ea" stroke-width="1" width="360" x="40" y="40"/><rect fill="#f3f7fc" height="26" rx="4" stroke="#dce3ea" stroke-width="1" width="360" x="40" y="40"/><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" font-weight="500" text-anchor="start" x="54" y="58">Worker A — 上游 task</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="92">PartitionedOutput</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="118"> ├─ partitionFunction_</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="144"> ├─ Destination[0..N]</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="170"> │    └─ VectorStreamGroup</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="196"> └─ OutputBufferManager</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="222">      └─ OutputBuffer</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="248">           └─ DestinationBuffer</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="58" xml:space="preserve" y="274">                [partition 0..N]</text><rect fill="#f3f7fc" height="300" rx="4" stroke="#dce3ea" stroke-width="1" width="360" x="480" y="40"/><rect fill="#f3f7fc" height="26" rx="4" stroke="#dce3ea" stroke-width="1" width="360" x="480" y="40"/><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" font-weight="500" text-anchor="start" x="494" y="58">Worker B — 下游 task</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="92">Exchange Operator（对应 ExchangeNode）</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="118"> └─ InMemoryExchangeClient</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="144">      ├─ ExchangeQueue</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="170">      │    └─ SerializedPage deque</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="196">      └─ ExchangeSource[0..M]</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="222">           └─ PrestoExchangeSource</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.0" x="498" xml:space="preserve" y="248">                (HTTP client)</text><line marker-end="url(#ex)" stroke="#657386" stroke-dasharray="6 5" stroke-width="1.5" x1="478" x2="402" y1="190" y2="190"/><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11" text-anchor="middle" x="440" y="178">HTTP GET</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11" text-anchor="middle" x="440" y="206">(B 拉 A)</text>
</g></svg>
