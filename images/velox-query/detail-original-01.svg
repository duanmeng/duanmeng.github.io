<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780.2" viewBox="0 0 1280 780.2" role="img"><title>宿主如何给 Task 添加 Split</title><desc>宿主如何给 Task 添加 Split；Coordinator (Java,不在本仓库) — 决定 split → worker 分配(节点亲和 / 负载均衡)</desc><rect width="1280" height="817.6" fill="white" stroke="none" /><rect x="8" y="8" width="1264" height="801.6" fill="white" stroke="none" /><rect x="9" y="9" width="1262" height="68.0866" fill="white" stroke="none" /><text x="36" y="53" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#1f2d3d">宿主如何给 Task 添加 Split</text><g transform="translate(24 87.7004) scale(1.4)">
<defs><marker id="qp" markerHeight="9" markerWidth="9" orient="auto" refX="6" refY="3"><path d="M0,0 L6,3 L0,6 Z" fill="#657386" /></marker></defs>
