<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="845" viewBox="0 0 1280 845" role="img"><title>宿主如何给 Task 添加 Split</title><rect width="1280" height="845" fill="white"/><rect x="8" y="8" width="1264" height="829" fill="white" stroke="#d6d3cc"/><rect x="9" y="9" width="1262" height="76" fill="#edf5ff"/><text x="36" y="53" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="26" fill="#111827">宿主如何给 Task 添加 Split</text><g transform="translate(24 106) scale(1.4)">
<defs><marker id="qp" markerHeight="9" markerWidth="9" orient="auto" refX="6" refY="3"><path d="M0,0 L6,3 L0,6 Z" fill="#5f5e5a"></path></marker></defs>
<rect fill="#f2f7ff" height="44" rx="4" stroke="#d6d3cc" stroke-width="1" width="760" x="60" y="16"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="12.5" text-anchor="start" x="76" y="43">Coordinator (Java,不在本仓库) — 决定 split → worker 分配(节点亲和 / 负载均衡)</text><line marker-end="url(#qp)" stroke="#8b8b8b" stroke-dasharray="6 5" stroke-width="1.5" x1="440" x2="440" y1="60" y2="94"></line><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11" text-anchor="start" x="454" y="82">POST /v1/task/{id}  body.sources[]</text><rect fill="#f2f7ff" height="392" rx="4" stroke="#d6d3cc" stroke-width="1" width="788" x="46" y="102"></rect><rect fill="#f2f7ff" height="26" rx="4" stroke="#d6d3cc" stroke-width="1" width="230" x="46" y="102"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="12.0" font-weight="500" text-anchor="start" x="60" y="120">Worker (Presto C++)</text><rect fill="#f2f7ff" height="46" rx="4" stroke="#d6d3cc" stroke-width="1" width="740" x="70" y="144"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="13.0" font-weight="500" text-anchor="start" x="86" y="165">TaskResource::createOrUpdateTask()</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11" text-anchor="start" x="86" y="182">解析 TaskUpdateRequest.sources[]</text><line marker-end="url(#qp)" stroke="#8b8b8b" stroke-dasharray="6 5" stroke-width="1.5" x1="440" x2="440" y1="190" y2="208"></line><rect fill="#f2f7ff" height="132" rx="4" stroke="#d6d3cc" stroke-width="1" width="740" x="70" y="210"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="13.0" font-weight="500" text-anchor="start" x="86" y="231">TaskManager::createOrUpdateTaskImpl()</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="252">1. 按 planNodeId 合并同请求内的多个 source</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="269">2. toVeloxSplit() 转换 ScheduledSplit → exec::Split</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="286">3. execTask-&gt;addSplitWithSequence(nodeId, split, seqId)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="303">4. execTask-&gt;setMaxSplitSequenceId(nodeId, maxSeqId)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="320">5. noMoreSplits / delayedNoMoreSplitsPlanNodes_</text><line marker-end="url(#qp)" stroke="#8b8b8b" stroke-dasharray="6 5" stroke-width="1.5" x1="440" x2="440" y1="342" y2="360"></line><rect fill="#f2f7ff" height="44" rx="4" stroke="#d6d3cc" stroke-width="1" width="740" x="70" y="362"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" x="86" y="389">Velox Task — 按 (planNodeId, splitGroupId) 存入 SplitsStore</text><line marker-end="url(#qp)" stroke="#8b8b8b" stroke-dasharray="6 5" stroke-width="1.5" x1="440" x2="440" y1="406" y2="424"></line><rect fill="#f2f7ff" height="50" rx="4" stroke="#d6d3cc" stroke-width="1" width="740" x="70" y="426"></rect><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" x="86" y="449">TableScan(driver).getSplitOrFuture(planNodeId)</text><text fill="#111827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" font-size="11" text-anchor="start" x="86" y="467">有 split → 读　·　无 → kWaitForSplit　·　结束 → finished</text>
</g></svg>