f" font-size="13.0" font-weight="700" text-anchor="start" x="86" y="224.4997">TaskManager::createOrUpdateTaskImpl()</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="245.4997">1. 按 planNodeId 合并同请求内的多个 source</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="262.4997">2. toVeloxSplit() 转换 ScheduledSplit → exec::Split</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="279.4997">3. execTask-&gt;addSplitWithSequence(nodeId, split, seqId)</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="296.4997">4. execTask-&gt;setMaxSplitSequenceId(nodeId, maxSeqId)</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11.5" x="96" xml:space="preserve" y="313.4997">5. noMoreSplits / delayedNoMoreSplitsPlanNodes_</text><line marker-end="url(#qp)" stroke="#657386" stroke-dasharray="6 5" stroke-width="1.6" x1="440" x2="440" y1="335.4997" y2="353.4997" /><rect fill="#f0f7f3" height="44" rx="4" stroke="#39826d" stroke-width="1.6" width="740" x="70" y="355.4997" /><text fill="#2e7963" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" x="86" y="382.4997">Velox Task — 按 (planNodeId, splitGroupId) 存入 SplitsStore</text><line marker-end="url(#qp)" stroke="#657386" stroke-dasharray="6 5" stroke-width="1.6" x1="440" x2="440" y1="399.4997" y2="417.4997" /><rect fill="#f0f7f3" height="50" rx="4" stroke="#39826d" stroke-width="1.6" width="740" x="70" y="419.4997" /><text fill="#2e7963" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" x="86" y="442.4997">TableScan(driver).getSplitOrFuture(planNodeId)</text><text fill="#1f2d3d" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="11" text-anchor="start" x="86" y="460.4997">有 split → 读　·　无 → kWaitForSplit　·　结束 → finished</text>
