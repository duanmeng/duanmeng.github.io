<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="937" viewBox="0 0 1280 937" role="img"><title>Decode：批次调度、游标消费与内存生命周期</title><desc>从当前 chunk 的 Encoding 恢复值，再由 Column reader 组织输出</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1280" height="937" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">Decode：批次调度、游标消费与内存生命周期</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">从当前 chunk 的 Encoding 恢复值，再由 Column reader 组织输出</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">01 当前批次的调度</text><text x="458" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">02 消费当前编码的游标</text><text x="878" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">03 结果与生命周期</text><rect x="40" y="173" width="344" height="118" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="206" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Column reader</text><text x="56" y="238" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">请求当前批次，准备输出缓冲或取值</text><text x="56" y="266" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">动作</text><polyline points="212,298 212,323" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><rect x="40" y="323" width="344" height="118" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="356" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Chunked decoder</text><text x="56" y="388" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">取得当前 chunk，并管理批次与 </text><text x="56" y="416" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">chunk 的衔接</text><text x="40" y="479" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">仅在当前 chunk 尚未就绪时</text><polyline points="212,494 212,519" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#arrow-purple)"/><rect x="40" y="519" width="344" height="146" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="56" y="552" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">按 prefix 构造 Encoding</text><text x="56" y="584" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">取得 chunk，按需解除外层压缩</text><text x="56" y="614" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">可发生 payload 解压、字典或元数据初</text><text x="56" y="641" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">始化</text><text x="40" y="706" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#877951" text-anchor="start">初始化也可能 materialize</text><text x="40" y="736" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">Dictionary alphabet / BBP 元数据</text><text x="40" y="766" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">可能通过子 encoding 恢复</text><rect x="458" y="173" width="344" height="204" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="474" y="206" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">顺序批量读取</text><text x="474" y="238" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">materializeNullable(n, out, …)</text><text x="474" y="268" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">恢复物理值，处理 non-null / scatter</text><text x="474" y="298" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">普通 TypedEncoding 可继续调用 </text><text x="474" y="325" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">materialize</text><rect x="474" y="334" width="58" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="503.0" y="357.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">v₀</text><rect x="536" y="334" width="58" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="565.0" y="357.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">v₁</text><rect x="598" y="334" width="58" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="627.0" y="357.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">v₂</text><rect x="660" y="334" width="58" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="689.0" y="357.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">v₃</text><rect x="722" y="334" width="58" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="751.0" y="357.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">…</text><rect x="458" y="430" width="344" height="204" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="474" y="463" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">选择性读取</text><text x="474" y="495" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">readWithVisitor(rows, filter, extract)</text><text x="474" y="525" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">产出命中行、所需值或触发 hook</text><text x="474" y="555" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">与批量路径对应不同的 chunked </text><text x="474" y="582" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">decoder 类</text><rect x="474" y="591" width="98" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="523.0" y="614.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">row i</text><rect x="576" y="591" width="98" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="625.0" y="614.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">row j</text><rect x="678" y="591" width="98" height="32" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="727.0" y="614.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7963" text-anchor="middle">…</text><text x="606" y="411" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">两种消费路径</text><polyline points="384,367 419,367 419,214 458,214" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="419,367 419,470 458,470" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="384,581 406,581 406,367 419,367" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><polyline points="802,272 839,272 839,415 878,415" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="802,529 839,529 839,415" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="878" y="210" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#65537f" text-anchor="start">完成本批，按需跨 chunk</text><rect x="878" y="253" width="362" height="210" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="894" y="286" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">Column reader 组织 Velox </text><text x="894" y="318" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">vectors</text><text x="894" y="350" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">处理值与 null，并保留所需 buffer </text><text x="894" y="378" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">owner</text><text x="894" y="409" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">写出 string_view 不会转移字符所有权</text><rect x="894" y="489" width="102" height="41" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="945.0" y="516.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#65537f" text-anchor="middle">values</text><rect x="1002" y="489" width="102" height="41" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="1053.0" y="516.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#65537f" text-anchor="middle">nulls</text><rect x="1110" y="489" width="102" height="41" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="1161.0" y="516.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#65537f" text-anchor="middle">owner</text><text x="878" y="574" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#65537f" text-anchor="start">输出引用与底层 buffer 一起保活</text><line x1="40" y1="811" x2="1240" y2="811" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="840" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">materialize 的产物可能是用户值，也可能是内部索引或元数据</text><text x="40" y="869" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">先看哪个对象在调用、结果写到哪个 buffer；Encoding 本身不拥有原始 encoded bytes。</text><text x="40" y="898" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">职责划分示意，非全局强制时序；I/O 可预取，外层或 codec 内压缩可在不同阶段解除。</text></svg>