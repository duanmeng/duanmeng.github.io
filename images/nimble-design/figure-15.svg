<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1685" viewBox="0 0 1440 1685" role="img"><title>Decode：批次调度、游标消费与内存生命周期</title><desc>从当前 chunk 的 Encoding 恢复值，再由 Column reader 组织输出</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1685" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Decode：批次调度、游标消费与内存生命周期</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">从当前 chunk 的 Encoding 恢复值，再由 Column reader 组织输出</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="175" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">01 当前批次的调度</text><rect x="48" y="222" width="595" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="66" y="258" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Column reader</text><text x="48" y="322" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">请求当前批次，准备输出缓冲或取值动作</text><rect x="795" y="222" width="597" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="813" y="258" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">Chunked decoder</text><text x="795" y="322" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">取得当前 chunk，并管理批次与 chunk 的衔接</text><polyline points="643,252 795,252" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="795" y="421" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">仅在当前 chunk 尚未就绪时</text><polyline points="1092,370 1092,385 1380,385 1380,470" fill="none" stroke="#39826d" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-green)"/><line x1="48" y1="478" x2="643" y2="478" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="507" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">初始化也可能 materialize</text><text x="48" y="545" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Dictionary alphabet / BBP 元数据</text><text x="48" y="579" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">可能通过子 encoding 恢复</text><rect x="795" y="480" width="597" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="813" y="516" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">按 prefix 构造 Encoding</text><text x="795" y="580" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">取得 chunk，按需解除外层压缩</text><text x="795" y="614" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">可发生 payload 解压、字典或元数据初始化</text><text x="48" y="761" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#2e7963" font-weight="600" text-anchor="start">02 消费当前编码的游标</text><polyline points="1091,694 1091,786 350,786 350,806" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><polyline points="1091,786 1091,806" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><line x1="48" y1="803" x2="642" y2="803" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="832" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">顺序批量读取</text><text x="48" y="870" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">materializeNullable(n, out, …)</text><text x="48" y="904" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">恢复物理值，处理 non-null / scatter</text><text x="48" y="938" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">普通 TypedEncoding 可继续调用 materialize</text><line x1="795" y1="803" x2="1392" y2="803" stroke="#dce3ea" stroke-width="1.5"/><text x="795" y="832" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">选择性读取</text><text x="795" y="870" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">readWithVisitor(rows, filter, extract)</text><text x="795" y="904" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">产出命中行、所需值或触发 hook</text><text x="795" y="938" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">与批量路径对应不同的 chunked decoder 类</text><rect x="48" y="1060" width="110" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="103.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">v₀</text><rect x="163" y="1060" width="110" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="218.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">v₁</text><rect x="278" y="1060" width="110" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="333.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">v₂</text><rect x="393" y="1060" width="110" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="448.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">v₃</text><rect x="508" y="1060" width="110" height="46" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="563.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">…</text><rect x="795" y="1060" width="192" height="46" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="891.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">row i</text><rect x="992" y="1060" width="192" height="46" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="1088.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">row j</text><rect x="1189" y="1060" width="192" height="46" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="1285.0" y="1090.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="middle">…</text><polyline points="334,1106 334,1154 718,1154 718,1324" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><polyline points="1091,1106 1091,1154 718,1154" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-purple)"/><text x="48" y="1211" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">03 结果与生命周期</text><text x="48" y="1255" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">完成本批，按需跨 chunk</text><rect x="48" y="1324" width="1344" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="66" y="1360" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Column reader 组织 Velox vectors</text><text x="48" y="1425" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">处理值与 null，并保留所需 buffer owner</text><text x="48" y="1459" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">写出 string_view 不会转移字符所有权</text><line x1="48" y1="1529" x2="1392" y2="1529" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1563" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">materialize 的产物可能是用户值，也可能是内部索引或元数据</text><text x="48" y="1597" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">先看哪个对象在调用、结果写到哪个 buffer；Encoding 本身不拥有原始 encoded bytes。</text><text x="48" y="1631" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">职责划分示意，非全局强制时序；I/O 可预取，外层或 codec 内压缩可在不同阶段解除。</text></svg>