<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1283" viewBox="0 0 1280 1283" role="img"><title>Read 与 Slice：共享编码字节，产物与成本不同</title><desc>分叉点在取得 encoding bytes 之后；原生 slice 不要求先构造完整的普通 decoder。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1280" height="1283" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">Read 与 Slice：共享编码字节，产物与成本不同</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">分叉点在取得 encoding bytes 之后；原生 slice 不要求先构造完整的普通 decoder。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="147" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">文件读取路径：先定位，再取得目标 chunk 的 encoding bytes</text><rect x="40" y="172" width="280" height="115" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="56" y="205" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">Postscript / Footer</text><text x="56" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">→ Stripes / StripeGroup 目录</text><rect x="363" y="172" width="401" height="115" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="379" y="205" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">定位 stream → 目标 chunk</text><text x="379" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">可选 chunk index；否则需沿 chunk 推进</text><rect x="807" y="172" width="433" height="115" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="823" y="205" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">读取 chunk payload</text><text x="823" y="237" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">若有外层压缩：先解压成 encoding bytes</text><polyline points="320,203 363,203" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><polyline points="764,203 807,203" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="40" y="339" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">另一入口：serialized / raw streams</text><text x="40" y="370" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">遵循各 API 的 framing / version 契约</text><rect x="674" y="321" width="566" height="59" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="690" y="354" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Encoding bytes + format / schema</text><polyline points="520,345 674,345" fill="none" stroke="#8d76b7" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><polyline points="1000,293 1000,321" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="674" y="407" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">StreamSlicer 不等于</text><text x="674" y="434" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">任意 tablet 文件重写器。</text><text x="40" y="480" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Read：得到解码后的值</text><text x="674" y="480" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">Slice：得到新的编码字节</text><rect x="40" y="504" width="555" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="537" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">EncodingFactory：构造 decoder</text><text x="56" y="569" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">可能验证结构、物化字典、解压内部 payload</text><rect x="40" y="655" width="555" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="688" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">skip / visitor / materialize</text><text x="56" y="720" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">按 codec 能力推进、筛选、解码和输出</text><rect x="40" y="790" width="555" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="823" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">输出：values / Velox vector</text><text x="56" y="855" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">跳过未选值的物化，不代表没有初始化或扫描成本。</text><polyline points="315,620 315,655" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><polyline points="315,764 315,790" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><polyline points="1209,380 1209,455 639,455 639,535 595,535" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><polyline points="1209,455 1260,455 1260,535 1240,535" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="674" y="504" width="566" height="114" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="690" y="537" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">确定范围 → 转换子行域 → codec 分派</text><text x="690" y="574" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">复杂 schema 先用父结构的 rank / count / sum 映射子范围</text><text x="674" y="648" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#2e7963" text-anchor="start">按 codec 支持选择下面的实现分支</text><rect x="674" y="677" width="262" height="116" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="690" y="710" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">原生 slice</text><text x="690" y="742" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">解析 header / children，复</text><text x="690" y="769" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">用编码态</text><rect x="972" y="677" width="268" height="230" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.6"/><text x="988" y="710" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#877951" text-anchor="start">Fallback（支持时）</text><text x="988" y="742" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">decoder → skip / </text><text x="988" y="769" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">materialize → encode</text><text x="988" y="799" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输出：目标 Buffer 中的新 </text><text x="988" y="826" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">bytes</text><text x="988" y="856" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">不保证零拷贝；也不是对所有</text><text x="988" y="883" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start"> codec 都是 O(1)。</text><polyline points="956,618 956,661 805,661 805,677" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="1204,618 1204,661 1110,661 1110,677" fill="none" stroke="#ac9c76" stroke-width="1.8" marker-end="url(#arrow-warm)"/><text x="40" y="950" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c6f6b" text-anchor="start">FSST 原生 slice：不解压字符串，但仍要扫描和复制</text><text x="40" y="984" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">lengths = [5, 3, 7, 2]，slice(1, 2)</text><text x="40" y="1014" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">blobBegin = 5；blobBytes = 3 + 7 = 10</text><rect x="40" y="1040" width="124" height="43" rx="5" fill="#ffffff" stroke="#dce3ea" stroke-width="1.6"/><text x="102.0" y="1068.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#657386" text-anchor="middle">5</text><rect x="170" y="1040" width="124" height="43" rx="5" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.6"/><text x="232.0" y="1068.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2c6f6b" text-anchor="middle">3</text><rect x="300" y="1040" width="124" height="43" rx="5" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.6"/><text x="362.0" y="1068.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2c6f6b" text-anchor="middle">7</text><rect x="430" y="1040" width="124" height="43" rx="5" fill="#ffffff" stroke="#dce3ea" stroke-width="1.6"/><text x="492.0" y="1068.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#657386" text-anchor="middle">2</text><text x="40" y="1120" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c6f6b" text-anchor="start">保留子串字节区间 [5, 15)</text><text x="40" y="1154" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">保留 symbol table + 新 lengths [3, 7] + 复制 blob [5, 15)</text><text x="40" y="1184" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">当前长度处理到 offset + length；另有子编码初始化与输出字节成本。</text><text x="805" y="984" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">还需计入的成本</text><text x="805" y="1023" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">I/O 与外层解压，不因少取几行而消失。</text><text x="805" y="1057" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">Dictionary slice 仍保留整个 alphabet。</text><text x="805" y="1091" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">有 chunk index，也不等于 codec 内 O(1) 点查。</text><text x="805" y="1125" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">EncodingView 仅覆盖部分 codec。</text><line x1="40" y1="1215" x2="1240" y2="1215" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="1244" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">图示 API / codec 行为基于正文固定源码快照；不把“支持 slice”解释为任意格式、任意布局都可无成本切片。</text></svg>