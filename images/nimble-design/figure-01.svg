unk</text><rect x="770" y="586" width="166" height="40" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="853.0" y="613.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#65537f" font-weight="400" text-anchor="middle">Encoding</text><rect x="965" y="532" width="186" height="107" rx="5" fill="white" stroke="#4078bd" stroke-width="1.5"/><text x="983" y="566" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="600" text-anchor="start">Chunk</text><rect x="975" y="586" width="166" height="40" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1058.0" y="613.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#65537f" font-weight="400" text-anchor="middle">Encoding</text><rect x="1170" y="532" width="186" height="107" rx="5" fill="white" stroke="#4078bd" stroke-width="1.5"/><text x="1188" y="566" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="600" text-anchor="start">Chunk</text><rect x="1180" y="586" width="166" height="40" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="1263.0" y="613.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#65537f" font-weight="400" text-anchor="middle">Encoding</text><text x="760" y="710" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#1f2d3d" font-weight="400" text-anchor="start">不同 Stream 的 Chunk 边界可以不同</text><text x="760" y="778" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Stream 的 Chunk 可继续划分自己的 Encoding</text><line x1="735" y1="832" x2="1392" y2="832" stroke="#dce3ea" stroke-width="1.5"/><text x="735" y="861" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-siz