 Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">Schema</text><text x="278" y="525" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">字段 / 类型 → stream ID</text><text x="278" y="550" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">columnar.schema · 列式读取必需</text><rect x="40" y="564" width="556" height="45" rx="0" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="54" y="591" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">统计</text><text x="278" y="591" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">文件 / Stripe 列统计（可选）</text><rect x="40" y="609" width="556" height="45" rx="0" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="54" y="636" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">可选索引</text><text x="278" y="636" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">Chunk 位置索引等，辅助定位</text><rect x="40" y="654" width="556" height="67" rx="0" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="54" y="681" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">文件属性 / 用户 </text><text x="54" y="710" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">metadata</text><text x="278" y="681" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">columnar.properties 