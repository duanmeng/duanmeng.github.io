<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="918" viewBox="0 0 1280 918" role="img"><title>级联编码：每一层消除一种冗余，子序列再选择自己的编码</title><desc>说明性可选组合，不是默认策略必选；D ≤ M ≤ N。是否划算仍取决于数据规模与分布。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1280" height="918" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">级联编码：每一层消除一种冗余，子序列再选择自己的编码</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">说明性可选组合，不是默认策略必选；D ≤ M ≤ N。是否划算仍取决于数据规模与分布。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">同一个 chunk 的根 encoding 字节范围</text><text x="794" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">内部 children 不是独立物理 streams</text><text x="14" y="203" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#65537f" text-anchor="start">1</text><rect x="40" y="170" width="750" height="90" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="56" y="203" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">Nullable · String</text><text x="56" y="235" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">N 个逻辑值：保留 null 位置，分离非空数据</text><text x="14" y="372" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#326cae" text-anchor="start">2</text><rect x="40" y="339" width="750" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="372" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">Dictionary · String · M 个非空值</text><text x="56" y="404" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">用 D 个不同字符串 + M 个索引，消除完整值的重复</text><rect x="911" y="339" width="329" height="90" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="927" y="372" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">RLE · Bool</text><text x="927" y="404" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">N 个 non-null flags</text><text x="40" y="305" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#326cae" text-anchor="start">Data：只保留非空值</text><text x="911" y="305" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#2e7963" text-anchor="start">Nulls：全部行的标志</text><polyline points="400,260 400,339" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><polyline points="790,208 1219,208 1219,339" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="40" y="484" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#2c6f6b" text-anchor="start">Alphabet：D 个不同字符串</text><text x="865" y="484" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#65537f" text-anchor="start">Indices：M 个索引</text><polyline points="405,429 405,514" fill="none" stroke="#3e8580" stroke-width="1.8" marker-end="url(#arrow-teal)"/><polyline points="790,377 827,377 827,500 1100,500 1100,514" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#arrow-purple)"/><text x="14" y="548" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#2c6f6b" text-anchor="start">3</text><rect x="40" y="514" width="750" height="202" rx="5" fill="white" stroke="#3e8580" stroke-width="1.6"/><text x="56" y="547" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2c6f6b" text-anchor="start">FSST · 利用不同字符串之间的重复子串</text><text x="56" y="577" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">rowCount = D；内部包含以下三部分：</text><rect x="56" y="594" width="222" height="40" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="167.0" y="621.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#65537f" text-anchor="middle">symbol table</text><text x="56" y="662" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">FSST codec 的</text><text x="56" y="687" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">metadata</text><rect x="296" y="594" width="222" height="40" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="407.0" y="621.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#326cae" text-anchor="middle">Lengths</text><text x="296" y="662" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">FixedBitWidth · u32</text><text x="296" y="687" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">D 个压缩长度</text><rect x="536" y="594" width="222" height="40" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="647.0" y="621.0" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700" fill="#2e7963" text-anchor="middle">compressed blob</text><text x="536" y="662" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">D 个字符串的</text><text x="536" y="687" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">独立编码串拼接</text><rect x="865" y="514" width="375" height="90" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="881" y="547" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">FixedBitWidth · u32</text><text x="881" y="579" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">M 个索引，指向 alphabet</text><text x="865" y="670" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#877951" text-anchor="start">读取时的一个重要成本</text><text x="865" y="700" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">普通 Dictionary decoder 构造时物化整个 </text><text x="865" y="727" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">alphabet。</text><line x1="40" y1="759" x2="1240" y2="759" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="788" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">连线表示父编码持有子编码；表、长度与 blob 都是本根 encoding 的内部字节，不会出现在 tablet stream 目录中。</text><text x="40" y="817" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">选择过程是 top-down greedy，不是穷举整棵树的全局最优搜索</text><text x="40" y="846" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">父层选中后通过 encodeNested 为子序列继续选型。每层都增加 header、初始化和内存成本；层数越多不一定越好。</text></svg>