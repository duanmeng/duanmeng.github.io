<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1370" viewBox="0 0 1440 1370" role="img"><title>级联编码：每一层消除一种冗余，子序列再选择自己的编码</title><desc>说明性可选组合，不是默认策略必选；D ≤ M ≤ N。是否划算仍取决于数据规模与分布。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker></defs><rect width="1440" height="1370" fill="white"/><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">级联编码：每一层消除一种冗余，子序列再选择自己的编码</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">说明性可选组合，不是默认策略必选；D ≤ M ≤ N。是否划算仍取决于数据规模与分布。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="175" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#65537f" font-weight="600" text-anchor="start">同一个 chunk 的根 encoding 字节范围</text><text x="48" y="217" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">内部 children 不是独立物理 streams</text><text x="24" y="326" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#65537f" font-weight="400" text-anchor="start">1</text><text x="24" y="574" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#326cae" font-weight="400" text-anchor="start">2</text><text x="24" y="825" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#2c6f6b" font-weight="400" text-anchor="start">3</text><rect x="48" y="292" width="918" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="66" y="328" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">Nullable · String</text><text x="48" y="393" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">N 个逻辑值：保留 null 位置，分离非空数据</text><text x="48" y="474" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="start">Data：只保留非空值</text><text x="1062" y="474" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2e7963" font-weight="400" text-anchor="start">Nulls：全部行的标志</text><polyline points="500,442 500,527" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#a-blue)"/><polyline points="966,320 1378,320 1378,527" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)"/><rect x="48" y="540" width="918" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="66" y="576" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">Dictionary · String · M 个非空值</text><text x="48" y="641" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">用 D 个不同字符串 + M 个索引，消除完整值的重复</text><rect x="1041" y="540" width="351" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5"/><text x="1059" y="576" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">RLE · Bool</text><text x="1041" y="641" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">N 个 non-null flags</text><text x="48" y="724" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2c6f6b" font-weight="400" text-anchor="start">Alphabet：D 个不同字符串</text><text x="836" y="724" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#65537f" font-weight="400" text-anchor="start">Indices：M 个索引</text><polyline points="377,677 377,778" fill="none" stroke="#3e8580" stroke-width="1.8" marker-end="url(#a-teal)"/><polyline points="1130,677 1130,778" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#a-purple)"/><rect x="37" y="773" width="750" height="389" rx="5" fill="white" stroke="#dce3ea" stroke-width="1.5"/><rect x="48" y="791" width="722" height="60" rx="5" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.5"/><text x="66" y="827" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2c6f6b" font-weight="600" text-anchor="start">FSST · 利用不同字符串之间的重复子串</text><text x="48" y="892" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">rowCount = D；内部包含以下三部分：</text><rect x="48" y="950" width="229" height="49" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5"/><text x="162.5" y="981.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#877951" font-weight="400" text-anchor="middle">symbol table</text><text x="48" y="1043" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">FSST codec 的</text><text x="48" y="1077" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">metadata</text><rect x="298" y="950" width="229" height="49" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/><text x="412.5" y="981.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#326cae" font-weight="400" text-anchor="middle">Lengths</text><text x="298" y="1043" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">FixedBitWidth · u32</text><text x="298" y="1077" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">D 个压缩长度</text><rect x="548" y="950" width="229" height="49" rx="4" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.5"/><text x="662.5" y="981.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="21" fill="#2c6f6b" font-weight="400" text-anchor="middle">compressed blob</text><text x="548" y="1043" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">D 个字符串的</text><text x="548" y="1077" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="18" fill="#1f2d3d" font-weight="400" text-anchor="start">独立编码串拼接</text><rect x="838" y="791" width="554" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5"/><text x="856" y="827" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">FixedBitWidth · u32</text><text x="838" y="892" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">M 个索引，指向 alphabet</text><line x1="838" y1="1014" x2="1392" y2="1014" stroke="#dce3ea" stroke-width="1.5"/><text x="838" y="1043" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">读取时的一个重要成本</text><text x="838" y="1081" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">普通 Dictionary decoder 构造时物化整个 alphabet。</text><line x1="48" y1="1195" x2="1392" y2="1195" stroke="#dce3ea" stroke-width="1.5"/><text x="48" y="1229" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">连线表示父编码持有子编码；表、长度与 blob 都是本根 encoding 的内部字节，不会出现在 tablet stream 目录中。</text><text x="48" y="1263" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">选择过程是 top-down greedy，不是穷举整棵树的全局最优搜索</text><text x="48" y="1297" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">父层选中后通过 encodeNested 为子序列继续选型。每层都增加 header、初始化和内存成本；层数越多不一定越好。</text></svg>