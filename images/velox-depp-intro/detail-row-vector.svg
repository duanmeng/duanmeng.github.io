<rect x="40" y="667" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="667" x2="1240.0" y2="667" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="696" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">ROW 的字段由多个 child vectors 表达，并不是把整个结构复制进一个 values buffer。</text>
<text x="60" y="721" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">每个 child 还可以有自己的编码与共享缓冲；字段访问要结合父行与 child 的 null。</text>
