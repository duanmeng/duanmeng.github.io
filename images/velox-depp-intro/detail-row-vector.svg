<text x="60" y="752" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">每个 child 还可以有自己的编码与共享缓冲；字段访问要结合父行与 child 的 null。</text>
