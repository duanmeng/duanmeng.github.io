<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Velox 的系统边界</title><desc id="desc">宿主提交计划并管理生命周期；执行层提供可复用接口与内核。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="744" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">Velox 的系统边界</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">宿主提交计划并管理生命周期；执行层提供可复用接口与内核。</text>
<rect x="50" y="165" width="350" height="128" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">宿主系统</text>
<text x="72" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">语言 / 优化 / 集群调度</text>
<text x="72" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">Presto、Spark 等集成层</text>
<polyline points="414,225 450,225" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="370" width="350" height="155" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="50" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="72" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">生命周期</text>
<text x="72" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">协议、task 更新与重试</text>
<text x="72" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">注入资源及语义配置</text>
<polyline points="225,306 225,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="165" width="350" height="128" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">Velox 执行</text>
<text x="487" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">PlanNode / Task / Driver</text>
<text x="487" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">表达式、函数与 Operator</text>
<polyline points="829,225 865,225" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="465" y="370" width="350" height="155" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1"/>
<rect x="465" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="487" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">资源管理</text>
<text x="487" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">MemoryPool / Arbitrator</text>
<text x="487" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">可回收状态与 Spill</text>
<polyline points="640,306 640,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="880" y="165" width="350" height="128" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="169" width="4" height="120" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="200" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">数据接口</text>
<text x="902" y="233" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Connector / ExchangeSource</text>
<text x="902" y="265" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">接入存储与交换实现</text>
<rect x="880" y="370" width="350" height="155" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1"/>
<rect x="880" y="374" width="4" height="147" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="902" y="405" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">数据表示</text>
<text x="902" y="438" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Type / Vector / Buffer</text>
<text x="902" y="477" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="16" font-weight="400" text-anchor="start">编码、null 与所有权</text>
<polyline points="1055,306 1055,353" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="658" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="658.0" x2="1240.0" y2="658.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="687" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">Velox 是执行库，可以嵌入 Worker，也可以独立求值表达式。</text>
<text x="60" y="712" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">完整 SQL 前端、分布式调度和具体传输协议由宿主组合提供。</text>
</svg>
