<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img"><title>Velox 的系统边界</title><desc>宿主提交计划并管理生命周期；执行层提供可复用接口与内核。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1110" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Velox 的系统边界</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">宿主提交计划并管理生命周期；执行层提供可复用接口与内核。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><line x1="48" y1="149" x2="645" y2="149" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">宿主系统</text><text x="48" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">语言 / 优化 / 集群调度</text><text x="48" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Presto、Spark 等集成层</text><line x1="795" y1="149" x2="1392" y2="149" stroke="#dce3ea" stroke-width="1.5" /><text x="795" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">生命周期</text><text x="795" y="216" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">协议、task 更新与重试</text><text x="795" y="250" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">注入资源及语义配置</text><rect x="48" y="393" width="1344" height="534" rx="5" fill="white" stroke="#dce3ea" stroke-width="1.5" /><text x="76" y="439" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#2e7963" font-weight="600" text-anchor="start">Velox 执行</text><text x="76" y="486" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">PlanNode / Task / Driver</text><text x="76" y="520" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">表达式、函数与 Operator</text><rect x="76" y="566" width="420" height="59" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="286.0" y="602.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#2e7963" font-weight="400" text-anchor="middle">PlanNode</text><rect x="501" y="566" width="420" height="59" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="711.0" y="602.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#2e7963" font-weight="400" text-anchor="middle">Task</text><rect x="926" y="566" width="420" height="59" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1136.0" y="602.5" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#2e7963" font-weight="400" text-anchor="middle">Driver → Operators</text><polyline points="340,315 340,393" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)" /><polyline points="1094,315 1094,393" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a-blue)" /><line x1="76" y1="685" x2="432" y2="685" stroke="#dce3ea" stroke-width="1.5" /><text x="76" y="714" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">资源管理</text><text x="76" y="752" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">MemoryPool / Arbitrator</text><text x="76" y="786" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">可回收状态与 Spill</text><line x1="540" y1="685" x2="896" y2="685" stroke="#dce3ea" stroke-width="1.5" /><text x="540" y="714" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="600" text-anchor="start">数据接口</text><text x="540" y="752" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Connector / ExchangeSource</text><text x="540" y="786" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">接入存储与交换实现</text><line x1="1002" y1="685" x2="1358" y2="685" stroke="#dce3ea" stroke-width="1.5" /><text x="1002" y="714" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">数据表示</text><text x="1002" y="752" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">Type / Vector / Buffer</text><text x="1002" y="786" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">编码、null 与所有权</text><line x1="48" y1="985" x2="1392" y2="985" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="1019" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">Velox 是执行库，可以嵌入 Worker，也可以独立求值表达式。</text><text x="48" y="1053" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">完整 SQL 前端、分布式调度和具体传输协议由宿主组合提供。</text></svg>