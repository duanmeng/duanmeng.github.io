<text x="72" y="456" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">Vector function：rows + argument vectors + result</text>
<text x="72" y="489" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">根据编码、null 与适配规则访问选中行，调用逐行逻辑并写回结果。</text>
<polyline points="250,313 250,403" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="330" y="535" width="630" height="95" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="330" y="539" width="4" height="87" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="352" y="570" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">Result vector</text>
<text x="352" y="603" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">结果槽按逻辑行编号保存，复用或准备可写 buffer。</text>
<polyline points="640,516.125 640,527.2083" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="40" y="664" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="664" x2="1240.0" y2="664" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="693" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">保留 result、rows、argument vectors 和模板适配四个关系。</text>
<text x="60" y="718" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">示例中的 out 必须通过引用写回；原图按值传 out 不能向调用者返回计算结果。</text>
</svg>