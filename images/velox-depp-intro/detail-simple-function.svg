<text x="72" y="488" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Vector function：rows + argument vectors + result</text>
<text x="72" y="521" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">根据编码、null 与适配规则访问选中行，调用逐行逻辑并写回结果。</text>
<polyline points="250,345 250,435" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="330" y="635" width="630" height="95" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="330" y="639" width="4" height="87" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="352" y="670" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Result vector</text>
<text x="352" y="703" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">结果槽按逻辑行编号保存，复用或准备可写 buffer。</text>
<polyline points="640,580 640,618" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="798" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="827" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">保留 result、rows、argument vectors 和模板适配四个关系。</text>
<text x="60" y="852" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">示例中的 out 必须通过引用写回；原图按值传 out 不能向调用者返回计算结果。</text>
</svg>