<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="755" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc">
<title id="title">Simple Function → Vector Function</title><desc id="desc">模板适配把逐行函数接入 batch 执行接口；不等于每个函数都自动变成 SIMD 指令。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.6" /></marker></defs>
<rect x="0" y="0" width="1280" height="766" rx="0" fill="white" stroke="none" stroke-width="1" />
<rect x="8" y="8" width="1264" height="750" rx="4" fill="white" stroke="none" stroke-width="1" />
<rect x="9" y="9" width="1262" height="89.2" rx="0" fill="white" stroke="none" stroke-width="1" />
<line x1="9" y1="98.2" x2="1271" y2="98.2" stroke="#dce3ea" stroke-width="1.85" />
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">Simple Function → Vector Function</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">模板适配把逐行函数接入 batch 执行接口；不等于每个函数都自动变成 SIMD 指令。</text>
<rect x="720" y="133" width="495" height="150" rx="4" fill="white" stroke="none" stroke-width="1" />
<line x1="720" y1="133" x2="1215.0" y2="133" stroke="#dce3ea" stroke-width="1.85" /><rect x="720" y="137" width="4" height="142" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="742" y="168" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">Simple Function</text>
<text x="742" y="201" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">逐行签名（示意）：</text>
<text x="742" y="238" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="start">call(int32_t&amp; out, int32_t a, int32_t b)</text>
<text x="742" y="269" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="start">out = a + b;</text>
<polyline points="715,332 495,332" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<text x="545" y="303" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="18" font-weight="400" text-anchor="start">模板展开</text>
<text x="710" y="374" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="400" text-anchor="middle">SimpleFunctionAdapter&lt;...&gt;</text>
