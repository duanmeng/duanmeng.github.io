<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1147" viewBox="0 0 1280 1147" role="img"><title>Expr 求值路径：保留 rows、编码、null 与部分结果</title><desc>根据官方原图重绘完整阶段；表示适用的通用路径，具体函数可选择不同分支或快速路径。</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1f2d3d" stroke-width="1.5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#dce3ea" stroke-width="1.5"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4078bd" stroke-width="1.5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#39826d" stroke-width="1.5"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d76b7" stroke-width="1.5"/></marker><marker id="arrow-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#ac9c76" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3e8580" stroke-width="1.5"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="1147" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">Expr 求值路径：保留 rows、编码、null 与部分结果</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">根据官方原图重绘完整阶段；表示适用的通用路径，具体函数可选择不同分支或快速路径。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><rect x="40" y="142" width="330" height="43" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="205.0" y="170.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#326cae" text-anchor="middle">阶段 / 输入</text><rect x="398" y="142" width="484" height="43" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="640.0" y="170.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#65537f" text-anchor="middle">实现与条件</text><rect x="910" y="142" width="330" height="43" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="1075.0" y="170.5" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#2e7963" text-anchor="middle">保留与输出</text><rect x="40" y="209" width="330" height="141" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="55" y="241" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#326cae" text-anchor="start">1 · Expr::eval</text><text x="55" y="284" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">输入：rows、data（输入列）</text><text x="398" y="239" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">检查共享子表达式是否已有结果；若所需行全部已计算，</text><text x="398" y="267" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">直接返回。</text><text x="398" y="303" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">否则将 rows 缩小为尚未有结果的行，保留 partial result</text><text x="398" y="331" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">。</text><rect x="910" y="209" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="925" y="243" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输出：rows 子集、不变的 data、</text><text x="925" y="270" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">partial result。</text><polyline points="881,279 910,279" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="205,350 205,378" fill="none" stroke="#4078bd" stroke-width="1.8" marker-end="url(#arrow-blue)"/><rect x="40" y="378" width="330" height="141" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="55" y="410" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#65537f" text-anchor="start">2 · Expr::evalEncodings</text><text x="55" y="453" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">输入：rows、data、partial result</text><text x="398" y="408" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">在确定性与编码兼容等条件满足时，尝试 peeling 输入包</text><text x="398" y="436" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">装。</text><text x="398" y="472" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">改用 inner vectors，并将选中行映射到对应底层行；保存</text><text x="398" y="500" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start"> peeled wrappings。</text><rect x="910" y="378" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="925" y="412" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输出：新的 rows/data、peeled </text><text x="925" y="439" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">wrappings、partial result。</text><polyline points="881,448 910,448" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="205,519 205,547" fill="none" stroke="#8d76b7" stroke-width="1.8" marker-end="url(#arrow-purple)"/><rect x="40" y="547" width="330" height="141" rx="5" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.6"/><text x="55" y="579" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#877951" text-anchor="start">3 · Expr::evalWithNulls</text><text x="55" y="622" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">输入：rows、data、peeled </text><text x="55" y="647" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">wrappings、partial result</text><text x="398" y="577" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">若表达式传播 null，找出至少一个输入为 null 的行。</text><text x="398" y="613" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">从需要实际函数求值的 rows 中去除这些行，同时记住 </text><text x="398" y="641" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">null rows。</text><rect x="910" y="547" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="925" y="581" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输出：rows 子集、未改变的 </text><text x="925" y="608" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">data/wrappings、null rows、</text><text x="925" y="635" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">partial result。</text><polyline points="881,617 910,617" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="205,688 205,716" fill="none" stroke="#ac9c76" stroke-width="1.8" marker-end="url(#arrow-warm)"/><rect x="40" y="716" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="55" y="748" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2e7963" text-anchor="start">4 · Expr::evalAll</text><text x="55" y="791" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">输入：rows、data、peeled </text><text x="55" y="816" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">wrappings、null rows</text><text x="398" y="746" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">特殊形式进入 evalSpecialForm；普通函数递归求值输入</text><text x="398" y="774" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">表达式。</text><text x="398" y="810" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">再按语义处理 null、剥离可用编码，调用 </text><text x="398" y="838" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">VectorFunction::apply。</text><rect x="910" y="716" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="925" y="750" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">函数结果按需要重新加包装与 null；</text><text x="925" y="777" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">保留 earlier partial result。</text><polyline points="881,786 910,786" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><polyline points="205,857 205,885" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><rect x="40" y="885" width="330" height="141" rx="5" fill="#f0f7f6" stroke="#3e8580" stroke-width="1.6"/><text x="55" y="917" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c6f6b" text-anchor="start">5 · Finalize</text><text x="55" y="960" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">输入：result、wrappings、null rows</text><text x="55" y="985" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="start">、partial result</text><text x="398" y="915" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">恢复 peeled 包装，设置 null 行，并合并此前已计算的部</text><text x="398" y="943" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">分结果。</text><text x="398" y="979" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">若是共享子表达式，保存结果供后续引用复用。</text><rect x="910" y="885" width="330" height="141" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="925" y="919" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">输出：覆盖所需逻辑行且保持语义的</text><text x="925" y="946" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="start">最终 result vector。</text><polyline points="881,955 910,955" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#arrow-green)"/><line x1="40" y1="1050" x2="1240" y2="1050" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="1079" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">rows、partial result 与包装信息必须随阶段传递，不能只画一条函数调用链。</text><text x="40" y="1108" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">重用前提包括确定性、错误和 null 语义；TRY、条件分支与有状态函数尤其需要按契约处理。</text></svg>