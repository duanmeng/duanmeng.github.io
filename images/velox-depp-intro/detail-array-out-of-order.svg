<rect x="40" y="858" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="887" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">offset 决定起点，size 决定长度；不能用相邻 offset 相减替代 size。</text>
<text x="60" y="912" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">与只存一串单调 offsets 的布局相比，这支持分支求值时的乱序写入与范围复用。</text>
