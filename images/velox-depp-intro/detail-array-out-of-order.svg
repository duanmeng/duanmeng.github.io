<text x="60" y="819" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">与只存一串单调 offsets 的布局相比，这支持分支求值时的乱序写入与范围复用。</text>
