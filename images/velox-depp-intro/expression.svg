<rect x="50" y="284" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="72" y="315" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">底层值求值</text>
<text x="72" y="348" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">选择可用的函数执行路径</text>
<polyline points="410,339 450,339" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
