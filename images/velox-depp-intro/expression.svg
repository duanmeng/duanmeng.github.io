<text x="487" y="348" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">CSE / dictionary memoization</text>
<polyline points="825,339 865,339" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="880" y="280" width="350" height="118" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="880" y="284" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="902" y="315" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">结果 Vector</text>
<text x="902" y="348" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">恢复映射并保留正确 null</text>
<polyline points="1055,251.6768 1055,261.5758 225,261.5758 225,272.3232" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="40" y="432" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1" /><line x1="40.0" y1="432" x2="1240.0" y2="432" stroke="#dce3ea" stroke-width="1.85" data-style-decoration="summary-divider" />
<text x="60" y="461" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">编码 peeling 与 memoization 都有适用前提。</text>
<text x="60" y="486" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">TRY、条件分支、非确定函数及错误传播不能被无条件全量求值改写。</text>
</svg>