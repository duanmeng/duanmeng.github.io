<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="523" viewBox="0 0 1280 523" role="img" aria-labelledby="title desc">
<title id="title">表达式执行：数据、行集合与语义共同参与</title><desc id="desc">示意适用路径；并非每个函数都会依次经过所有优化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.6" /></marker></defs>
<rect x="0" y="0" width="1280" height="534" rx="0" fill="white" stroke="none" stroke-width="1" />
<rect x="8" y="8" width="1264" height="518" rx="4" fill="white" stroke="none" stroke-width="1" />
<rect x="9" y="9" width="1262" height="88.5" rx="0" fill="white" stroke="none" stroke-width="1" />
<line x1="9" y1="97.5" x2="1271" y2="97.5" stroke="#dce3ea" stroke-width="1.85" />
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">表达式执行：数据、行集合与语义共同参与</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">示意适用路径；并非每个函数都会依次经过所有优化。</text>
<rect x="50" y="126" width="350" height="118" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.55" />
<rect x="50" y="130" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="72" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="21" font-weight="600" text-anchor="start">输入 Vector</text>
<text x="72" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">Flat / Constant / Dictionary / Lazy</text>
<polyline points="410,185 450,185" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="465" y="126" width="350" height="118" rx="4" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.55" />
<rect x="465" y="130" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="487" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#65537f" font-size="21" font-weight="600" text-anchor="start">SelectivityVector</text>
<text x="487" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">标记需要求值的逻辑行</text>
<polyline points="825,185 865,185" fill="none" stroke="#657386" stroke-width="1.85" stroke-dasharray="6 5" marker-end="url(#arrow)" />
<rect x="880" y="126" width="350" height="118" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.55" />
<rect x="880" y="130" width="4" height="110" rx="0" fill="none" stroke="none" stroke-width="1" />
<text x="902" y="161" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#2e7963" font-size="21" font-weight="600" text-anchor="start">语义与编码判断</text>
<text x="902" y="194" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">null、确定性、可剥离包装</text>
