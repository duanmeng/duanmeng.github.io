<text x="60" y="608" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">slot 从匹配 / 空闲 mask 中选出；索引保存 48-bit 指针表示。</text>
