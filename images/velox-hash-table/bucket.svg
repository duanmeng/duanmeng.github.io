<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">16 个 tag 与 16 个压缩指针共用一个 bucket；每个指针槽占 6 字节。</text>
