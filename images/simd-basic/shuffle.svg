<text x="947" y="541" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="20" font-weight="400" text-anchor="middle">完整 256 位范围倒序</text>
<rect x="60" y="610" width="1160" height="149" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="82" y="649" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="22" font-weight="600" text-anchor="start">shuffle_epi8：控制参数是一个字节向量，不是 immediate。</text>
<text x="82" y="691" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="400" text-anchor="start">bit7 = 1 → 输出零；否则使用低 4 位，在本 128 位子块的 16 字节中查找。</text>
<text x="82" y="728" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="18" font-weight="400" text-anchor="start">bits4..6 不参与索引。索引 16 不会跳到另一半，它仍选择本半的第 0 个字节。</text>
<rect x="40" y="810" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="839" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">先写出输入 / 输出索引，再选择 intrinsic；用唯一值测试，避免重复数据掩盖顺序错误。</text>
<text x="60" y="864" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">unpack、pack、hadd 等指令也常按 128 位子块处理，不能只看 256 位寄存器总宽度。</text>
