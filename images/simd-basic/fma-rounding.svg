<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="981" viewBox="0 0 1440 981" role="img"><title>FMA 与分离乘加：差别来自中间舍入</title><desc>a = 1 + 2⁻¹³，b = 1 − 2⁻¹³，c = −1；采用 binary32 最近偶数舍入。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1f2d3d" stroke-width="1.5" /></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5" /></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dce3ea" stroke-width="1.5" /></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4078bd" stroke-width="1.5" /></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#39826d" stroke-width="1.5" /></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8d76b7" stroke-width="1.5" /></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#ac9c76" stroke-width="1.5" /></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#a95f64" stroke-width="1.5" /></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="981" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">FMA 与分离乘加：差别来自中间舍入</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">a = 1 + 2⁻¹³，b = 1 − 2⁻¹³，c = −1；采用 binary32 最近偶数舍入。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="178" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#326cae" font-weight="600" text-anchor="start">精确乘积：1 − 2⁻²⁶</text><text x="48" y="220" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">a、b 均可精确表示</text><text x="48" y="320" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#877951" font-weight="600" text-anchor="start">分离 mul + add</text><text x="795" y="320" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="25" fill="#2e7963" font-weight="600" text-anchor="start">融合 FMA</text><line x1="718" y1="297" x2="718" y2="779" stroke="#dce3ea" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="48" y="370" width="595" height="64" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="345.5" y="409.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="27" fill="#326cae" font-weight="400" text-anchor="middle">1 − 2⁻²⁶</text><rect x="795" y="370" width="596" height="64" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="1093.0" y="409.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="27" fill="#326cae" font-weight="400" text-anchor="middle">1 − 2⁻²⁶</text><polyline points="342,434 342,516" fill="none" stroke="#ac9c76" stroke-width="1.8" marker-end="url(#a-warm)" /><polyline points="1092,434 1092,630" fill="none" stroke="#39826d" stroke-width="1.8" marker-end="url(#a-green)" /><rect x="48" y="521" width="595" height="60" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="345.5" y="558.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#877951" font-weight="400" text-anchor="middle">round → 1</text><text x="795" y="523" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="400" text-anchor="start">中间乘积不先舍入为 float</text><text x="48" y="623" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#877951" font-weight="400" text-anchor="start">先把乘积舍入为 float：1</text><polyline points="342,652 342,706" fill="none" stroke="#ac9c76" stroke-width="1.8" marker-end="url(#a-warm)" /><rect x="48" y="714" width="595" height="64" rx="4" fill="#faf7ef" stroke="#ac9c76" stroke-width="1.5" /><text x="345.5" y="753.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="26" fill="#877951" font-weight="400" text-anchor="middle">1 + (−1) → 0</text><rect x="795" y="635" width="596" height="64" rx="4" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1093.0" y="674.0" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="24" fill="#2e7963" font-weight="400" text-anchor="middle">(1 − 2⁻²⁶) − 1 → −2⁻²⁶</text><text x="48" y="830" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">最终结果为 0</text><text x="795" y="756" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">最终结果可精确表示</text><line x1="48" y1="893" x2="1392" y2="893" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="927" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">FMA 是独立 ISA 特性；更少的舍入可能改变逐位复现结果。</text></svg>