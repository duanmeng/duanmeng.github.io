<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="title desc"><title id="title">FMA 与分离乘加：差别来自中间舍入</title><desc id="desc">a = 1 + 2⁻¹³，b = 1 − 2⁻¹³，c = −1；采用 binary32 最近偶数舍入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="960" height="585" rx="3" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="944" height="569" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="942" height="84" rx="3" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="93" x2="951" y2="93" stroke="#d6d3cc" stroke-width="1.4"/>
<text x="32" y="44" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="26" font-weight="600" fill="#111827" text-anchor="start">FMA 与分离乘加：差别来自中间舍入</text>
<text x="32" y="75" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">a = 1 + 2⁻¹³，b = 1 − 2⁻¹³，c = −1；采用 binary32 最近偶数舍入。</text>
<rect x="224" y="125" width="512" height="82" rx="3" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="225" y="126" width="4" height="80" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="242" y="155" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="start">精确乘积：1 − 2⁻²⁶</text>
<text x="242" y="183" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">a、b 均可精确表示</text>
<line x1="354" y1="208" x2="254" y2="257" stroke="#8b8b8b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="606" y1="208" x2="706" y2="257" stroke="#8b8b8b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="32" y="268" width="408" height="93" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<rect x="33" y="269" width="4" height="91" rx="0" fill="#c2410c" stroke="none" stroke-width="1"/>
<text x="50" y="298" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="start">分离 mul + add</text>
<text x="50" y="326" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">先把乘积舍入为 float：1</text>
<rect x="520" y="268" width="408" height="93" rx="3" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="521" y="269" width="4" height="91" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="538" y="298" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="start">融合 FMA</text>
<text x="538" y="326" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">中间乘积不先舍入为 float</text>
<line x1="236" y1="363" x2="236" y2="409" stroke="#8b8b8b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="724" y1="363" x2="724" y2="409" stroke="#8b8b8b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="32" y="422" width="408" height="84" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<rect x="33" y="423" width="4" height="82" rx="0" fill="#c2410c" stroke="none" stroke-width="1"/>
<text x="50" y="452" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="start">1 + (−1) → 0</text>
<text x="50" y="480" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">最终结果为 0</text>
<rect x="520" y="422" width="408" height="84" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="521" y="423" width="4" height="82" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="538" y="452" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="start">(1 − 2⁻²⁶) − 1 → −2⁻²⁶</text>
<text x="538" y="480" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">最终结果可精确表示</text>
<rect x="32" y="518" width="896" height="42" rx="3" fill="#f7f2ea" stroke="none" stroke-width="1"/>
<text x="48" y="545" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">FMA 是独立 ISA 特性；更少的舍入可能改变逐位复现结果。</text>
</svg>