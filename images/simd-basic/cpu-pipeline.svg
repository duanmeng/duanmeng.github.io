 stroke="#3e8580" stroke-width="1.5" /></marker></defs><rect width="1440" height="1120" fill="white" /><text x="48" y="59" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="30" fill="#1f2d3d" font-weight="600" text-anchor="start">Intel CPU：指令流与向量数据路径</text><text x="48" y="95" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="19" fill="#657386" font-weight="400" text-anchor="start">概念架构；没有规定某款 CPU 的端口数、物理寄存器数量或内部执行宽度。</text><line x1="48" y1="125" x2="1392" y2="125" stroke="#dce3ea" stroke-width="1.5" /><text x="48" y="176" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="23" fill="#326cae" font-weight="600" text-anchor="start">指令通路：调度后执行，完成后按顺序退休</text><rect x="48" y="219" width="350" height="60" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5" /><text x="66" y="255" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#326cae" font-weight="600" text-anchor="start">取指 / 解码</text><text x="48" y="320" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">机器指令 → 微操作</text><rect x="533" y="219" width="372" height="60" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.5" /><text x="551" y="255" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#65537f" font-weight="600" text-anchor="start">重命名 / 调度</text><text x="533" y="320" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="20" fill="#1f2d3d" font-weight="400" text-anchor="start">操作数就绪 + 资源可用</text><rect x="1038" y="219" width="354" height="60" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.5" /><text x="1056" y="255" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" font-size="22" fill="#2e7963" font-weight="600" text-anchor="start">退休 / 提交</text><text x="1038" y="320" font-family="Noto S