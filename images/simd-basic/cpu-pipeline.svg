 1 L 8 5 L 1 9" fill="none" stroke="#a95f64" stroke-width="1.5"/></marker></defs><rect width="1280" height="826" fill="white"/><text x="40" y="48" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d" text-anchor="start">Intel CPU：指令流与向量数据路径</text><text x="40" y="82" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#657386" text-anchor="start">概念架构；没有规定某款 CPU 的端口数、物理寄存器数量或内部执行宽度。</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#dce3ea" stroke-width="1.4"/><text x="40" y="148" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">指令通路：调度后执行，完成后按顺序退休</text><rect x="40" y="171" width="368" height="90" rx="5" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.6"/><text x="56" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#326cae" text-anchor="start">取指 / 解码</text><text x="56" y="236" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">机器指令 → 微操作</text><rect x="452" y="171" width="368" height="90" rx="5" fill="#f7f4fb" stroke="#8d76b7" stroke-width="1.6"/><text x="468" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#65537f" text-anchor="start">重命名 / 调度</text><text x="468" y="236" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="start">操作数就绪 + 资源可用</text><rect x="872" y="171" width="368" height="90" rx="5" fill="#f0f7f3" stroke="#39826d" stroke-width="1.6"/><text x="888" y="204" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#2e7963" text-anchor="start">退休 / 提交</text><text x="888" y="236" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-s