<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="934" viewBox="0 0 1280 934" role="img" aria-labelledby="title desc">
<title id="title">浮点求和：循环内累积，循环外归约</title><desc id="desc">多个独立 accumulator 减少依赖链；最终要显式合并高低 128 位。示意最终合并的八个值。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="934" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="918" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">浮点求和：循环内累积，循环外归约</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">多个独立 accumulator 减少依赖链；最终要显式合并高低 128 位。示意最终合并的八个值。</text>
<rect x="60" y="145" width="535" height="91" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="60" y="149" width="4" height="83" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="82" y="180" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">acc0</text>
<text x="82" y="213" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">处理一组连续批次</text>
<rect x="685" y="145" width="535" height="91" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="685" y="149" width="4" height="83" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="707" y="180" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">acc1</text>
<text x="707" y="213" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">处理另一组连续批次</text>
<polyline points="328,248 328,280 640,280 640,319" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="953,248 953,280 650,280" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="677" y="310" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="18" font-weight="400" text-anchor="start">acc0 + acc1</text>
<rect x="60.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="132.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v0</text>
<rect x="205.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="277.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v1</text>
<rect x="350.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="422.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v2</text>
<rect x="495.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
