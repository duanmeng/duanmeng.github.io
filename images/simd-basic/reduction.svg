<rect x="785.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="857.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v5</text>
<rect x="930.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="1002.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v6</text>
<rect x="1075.0" y="338" width="145.0" height="58" rx="0" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<text x="1147.5" y="375" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v7</text>
<polyline points="640,408 640,448" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="676" y="438" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="18" font-weight="400" text-anchor="start">低 128 位 + 高 128 位</text>
<rect x="225.0" y="468" width="207.5" height="58" rx="0" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="328.75" y="505" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v0+v4</text>
<rect x="432.5" y="468" width="207.5" height="58" rx="0" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="536.25" y="505" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v1+v5</text>
<rect x="640.0" y="468" width="207.5" height="58" rx="0" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="743.75" y="505" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v2+v6</text>
<rect x="847.5" y="468" width="207.5" height="58" rx="0" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="951.25" y="505" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="20" font-weight="500" text-anchor="middle">v3+v7</text>
<polyline points="640,538 640,578" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="676" y="568" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="18" font-weight="400" text-anchor="start">再配对合并</text>
<rect x="285.0" y="598" width="355.0" height="58" rx="0" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="462.5" y="635" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="500" text-anchor="middle">v0+v2+v4+v6</text>
<rect x="640.0" y="598" width="355.0" height="58" rx="0" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="817.5" y="635" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="500" text-anchor="middle">v1+v3+v5+v7</text>
<polyline points="640,668 640,707" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="330" y="723" width="620" height="84" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="330" y="727" width="4" height="76" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="352" y="758" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">最终标量</text>
<text x="352" y="791" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">将两部分相加，再处理剩余尾部</text>
<rect x="40" y="832" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="861" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">hadd 不是全 256 位求和；循环内频繁横向操作还会增加重排开销。</text>
<text x="60" y="886" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">浮点加法不满足结合律：这种归约顺序可能与从左到右的 scalar sum 得到不同末位。</text>
</svg>