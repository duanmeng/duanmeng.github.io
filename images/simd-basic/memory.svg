<text x="882" y="538" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">向有效输出范围写入</text>
<rect x="60" y="646" width="1140" height="94" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="82" y="682" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="22" font-weight="600" text-anchor="start">loadu 只取消 32 字节对齐要求，不取消越界检查。</text>
<text x="82" y="714" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="18" font-weight="400" text-anchor="start">先 load 32 B 再丢掉无效 lane，仍可能跨到不可访问页面；尾部要在访问前处理。</text>
<rect x="40" y="770" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="799" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">热循环条件 n - i &gt;= 8；尾部标量处理，或使用契约明确的 masked load。</text>
<text x="60" y="824" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">masked load 的禁用元素变为零；masked store 的禁用元素保持目标内存原值。</text>
