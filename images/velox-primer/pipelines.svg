<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">本地分组聚合：从 producer 到 consumer</title><desc id="desc">示例仅展示一个 Task 内的局部结构；分布式计划还可能包含远程交换。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8b8b8b" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="780" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="764" rx="4" fill="white" stroke="#d6d3cc" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#edf5ff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#d6d3cc" stroke-width="1"/>
<text x="40" y="49" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="28" font-weight="600" text-anchor="start">本地分组聚合：从 producer 到 consumer</text>
<text x="40" y="80" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">示例仅展示一个 Task 内的局部结构；分布式计划还可能包含远程交换。</text>
<rect x="50" y="170" width="400" height="112" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="174" width="4" height="104" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="205" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Producer Driver 0</text>
<text x="72" y="238" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Scan → Filter → PartialAgg</text>
<rect x="50" y="365" width="400" height="112" rx="4" fill="#f2f7ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="50" y="369" width="4" height="104" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="72" y="400" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Producer Driver 1</text>
<text x="72" y="433" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">Scan → Filter → PartialAgg</text>
<rect x="535" y="255" width="275" height="112" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
<rect x="535" y="259" width="4" height="104" rx="0" fill="#7e22ce" stroke="none" stroke-width="1"/>
<text x="557" y="290" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">LocalPartition</text>
<text x="557" y="323" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">按 grouping key 分区</text>
<polyline points="465,226 493,226 493,311 520,311" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="465,421 493,421 493,311 520,311" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="905" y="170" width="325" height="112" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="905" y="174" width="4" height="104" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="927" y="205" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Consumer 0</text>
<text x="927" y="238" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">LocalExchange → MergeAgg</text>
<rect x="905" y="365" width="325" height="112" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<rect x="905" y="369" width="4" height="104" rx="0" fill="#15803d" stroke="none" stroke-width="1"/>
<text x="927" y="400" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="600" text-anchor="start">Consumer 1</text>
<text x="927" y="433" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">LocalExchange → MergeAgg</text>
<polyline points="825,311 862,311 862,226 890,226" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<polyline points="825,311 862,311 862,421 890,421" fill="none" stroke="#8b8b8b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="640" y="549" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="21" font-weight="400" text-anchor="middle">相同 key 必须送到同一个负责合并的分区</text>
<rect x="40" y="678" width="1200" height="70" rx="4" fill="#f7f2ea" stroke="#d6d3cc" stroke-width="1"/>
<text x="60" y="707" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#111827" font-size="19" font-weight="600" text-anchor="start">Partial 输出的是可合并状态，不能假定已经得到全局最终值。</text>
<text x="60" y="732" font-family="Inter, Noto Sans SC, Noto Sans CJK SC, Arial, sans-serif" fill="#4b5563" font-size="17" font-weight="400" text-anchor="start">这里只展示一种合法拓扑；具体 Operator 与 Driver 数由计划和配置决定。</text>
</svg>