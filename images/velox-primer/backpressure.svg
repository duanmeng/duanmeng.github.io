<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="755" viewBox="0 0 1280 755" role="img" aria-labelledby="title desc">
<title id="title">Local Exchange：数据流与反向背压</title><desc id="desc">队列计数和 future 一起决定何时继续执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#657386" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="755" rx="0" fill="white" stroke="none" stroke-width="1"/>
<rect x="8" y="8" width="1264" height="739" rx="4" fill="white" stroke="none" stroke-width="1"/>
<rect x="9" y="9" width="1262" height="94" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<line x1="9" y1="103" x2="1271" y2="103" stroke="#dce3ea" stroke-width="1"/>
<text x="40" y="49" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="28" font-weight="600" text-anchor="start">Local Exchange：数据流与反向背压</text>
<text x="40" y="80" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">队列计数和 future 一起决定何时继续执行。</text>
<rect x="20" y="130" width="360" height="80" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="20" y="134" width="4" height="72" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="200" y="177" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="18" font-weight="600" text-anchor="middle">LocalPartition</text>
<line x1="200" y1="228" x2="200" y2="623" stroke="#657386" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="460" y="130" width="360" height="80" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="460" y="134" width="4" height="72" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="640" y="177" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="18" font-weight="600" text-anchor="middle">Queue / MemoryManager</text>
<line x1="640" y1="228" x2="640" y2="623" stroke="#657386" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="900" y="130" width="360" height="80" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1"/>
<rect x="900" y="134" width="4" height="72" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="1080" y="177" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#326cae" font-size="18" font-weight="600" text-anchor="middle">LocalExchange</text>
<line x1="1080" y1="228" x2="1080" y2="623" stroke="#657386" stroke-width="1" stroke-dasharray="6 5"/>
<text x="420.0" y="249" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="middle">入队并计入内存占用</text>
<polyline points="200,265 640,265" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="420.0" y="332" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="middle">超过阈值：返回等待 future</text>
<polyline points="640,348 200,348" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="860.0" y="415" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="middle">consumer 取出下一批</text>
<polyline points="640,431 1080,431" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="860.0" y="498" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="middle">释放缓冲占用</text>
<polyline points="1080,514 640,514" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="420.0" y="581" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="middle">完成 producer 的等待 promise</text>
<polyline points="640,597 200,597" fill="none" stroke="#657386" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="653" width="1200" height="70" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="40.0" y1="653.0" x2="1240.0" y2="653.0" stroke="#dce3ea" stroke-width="1" data-style-decoration="summary-divider"/>
<text x="60" y="682" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#1f2d3d" font-size="19" font-weight="600" text-anchor="start">空队列不等于结束；还要确认不会再来 producer 数据。</text>
<text x="60" y="707" font-family="Noto Sans SC, Noto Sans CJK SC, Inter, Arial, sans-serif" fill="#657386" font-size="17" font-weight="400" text-anchor="start">阈值用于背压，入队中的一个 batch 可能让占用暂时超过门槛。</text>
</svg>
