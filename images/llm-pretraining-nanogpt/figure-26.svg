<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img"><title>FlashAttention：把完整矩阵改为分块计算</title><desc>计算同样的 Attention；通过分块与在线 softmax，减少 HBM 中间读写。</desc><rect width="1280" height="660" fill="#ffffff"/><defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4078bd"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#39826d"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d76b7"/></marker>
<marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac9c76"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#657386"/></marker>
</defs>
<text x="32" y="46" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="28" font-weight="600" fill="#1f2d3d" text-anchor="start">FlashAttention：把完整矩阵改为分块计算</text>
<text x="32" y="78" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#657386" text-anchor="start">计算同样的 Attention；通过分块与在线 softmax，减少 HBM 中间读写。</text>
<polyline points="32,100 1248,100" fill="none" stroke="#dce3ea" stroke-width="1.8" stroke-linejoin="round"/>
<text x="32" y="140" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#326cae" text-anchor="start">朴素注意力</text>
<text x="676" y="140" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#2e7963" text-anchor="start">FlashAttention</text>
<rect x="32" y="166" width="548" height="76" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="306.0" y="196" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="middle">生成完整 T × T 分数矩阵</text>
<polyline points="306,242 306,274" fill="none" stroke="#4078bd" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="32" y="276" width="548" height="200" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<text x="55" y="310" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="600" fill="#326cae" text-anchor="start">写回显存 HBM</text>
<rect x="58" y="334" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="83" y="334" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="108" y="334" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
