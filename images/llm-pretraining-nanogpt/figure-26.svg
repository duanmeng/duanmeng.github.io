<rect x="83" y="380" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="108" y="380" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
