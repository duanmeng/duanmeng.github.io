<rect x="158" y="380" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="58" y="403" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="83" y="403" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="108" y="403" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="133" y="403" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="158" y="403" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="58" y="426" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
<rect x="83" y="426" width="23" height="21" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
