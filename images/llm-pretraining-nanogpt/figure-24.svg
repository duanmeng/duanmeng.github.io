<text x="120.0" y="289" font-family="Noto Sans SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">X</text>
<rect x="300" y="130" width="148" height="70" rx="4" fill="#f3f7fc" stroke="#4078bd" stroke-width="1.5"/>
